          </vector>
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/MainActivity.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private var st1: TextView? = null
              private var st2: TextView? = null
              private var density = 1f

              private fun dp(x: Int): Int = (x * density).toInt()

              private fun label(text: String, size: Float, bold: Boolean, color: Int): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, android.graphics.Typeface.BOLD)
                  t.setPadding(0, dp(6), 0, dp(2))
                  return t
              }

              private fun button(text: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = text
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun slider(
                  title: String, min: Int, max: Int, value: Int, onSet: (Int) -> Unit
              ): View {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(0, dp(8), 0, 0)
                  val t = TextView(this)
                  t.text = title + ": " + value
                  t.setTextColor(Color.parseColor("#222222"))
                  val sb = SeekBar(this)
                  sb.max = max - min
                  sb.progress = value - min
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          t.text = title + ": " + (p + min)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {
                      }

                      override fun onStopTrackingTouch(s: SeekBar?) {
                          val p = s?.progress ?: 0
                          onSet(p + min)
                      }
                  })
                  box.addView(t)
                  box.addView(sb)
                  return box
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  density = resources.displayMetrics.density

                  val dark = Color.parseColor("#111111")
                  val grey = Color.parseColor("#555555")

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(20), dp(28), dp(20), dp(28))
                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)

                  root.addView(label("CamesNotch", 28f, true, dark))
                  root.addView(label("Notch ala iPhone untuk Android, tanpa iklan.", 14f, false, grey))

                  root.addView(label("1. Akses notifikasi", 16f, true, dark))
                  val s1 = label("", 14f, false, grey)
                  st1 = s1
                  root.addView(s1)
                  root.addView(button("Buka pengaturan akses notifikasi") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  })

                  root.addView(label("2. Aksesibilitas", 16f, true, dark))
                  val s2 = label("", 14f, false, grey)
                  st2 = s2
                  root.addView(s2)
                  root.addView(button("Buka pengaturan aksesibilitas") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  root.addView(
                      label(
                          "Kalau pilihannya abu-abu (Android 13 ke atas): buka Info Aplikasi CamesNotch, " +
                                  "ketuk titik tiga di kanan atas, pilih Izinkan setelan terbatas, lalu ulangi.",
                          12f, false, grey
                      )
                  )

                  root.addView(label("Pengaturan", 16f, true, dark))
                  val sw = Switch(this)
                  sw.text = "Notch aktif"
                  sw.isChecked = Prefs.enabled(this)
                  sw.setOnCheckedChangeListener { _, checked ->
                      Prefs.setEnabled(this, checked)
                      NotchController.rebuild()
                  }
                  root.addView(sw)

                  root.addView(slider("Lebar notch (% layar)", 20, 45, Prefs.widthPct(this)) {
                      Prefs.setWidthPct(this, it)
                      NotchController.rebuild()
                  })
                  root.addView(slider("Tinggi tambahan (dp)", 0, 20, Prefs.extraDp(this)) {
                      Prefs.setExtraDp(this, it)
                      NotchController.rebuild()
                  })
                  root.addView(slider("Geser horizontal (dp)", -30, 30, Prefs.offsetDp(this)) {
                      Prefs.setOffsetDp(this, it)
                      NotchController.rebuild()
                  })

                  root.addView(label("Aplikasi yang tampil di notch", 16f, true, dark))
                  val chosen = HashSet<String>(Prefs.apps(this))
                  for (app in Prefs.APPS) {
                      val cb = CheckBox(this)
                      cb.text = app.first
                      cb.isChecked = chosen.contains(app.second)
                      cb.setOnCheckedChangeListener { _, checked ->
                          if (checked) chosen.add(app.second) else chosen.remove(app.second)
                          Prefs.setApps(this, chosen)
                      }
                      root.addView(cb)
                  }

                  root.addView(label("Coba", 16f, true, dark))
                  root.addView(button("Tes notifikasi di notch") {
                      if (NotchController.isReady()) {
                          NotchController.demo()
                      } else {
                          Toast.makeText(this, "Aktifkan Aksesibilitas dulu.", Toast.LENGTH_SHORT).show()
                      }
                  })

                  if (Build.VERSION.SDK_INT >= 31 &&
                      checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val l = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  val a = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  st1?.text = if (l.contains(packageName)) "Aktif" else "Belum aktif"
                  st2?.text = if (a.contains(packageName)) "Aktif" else "Belum aktif"
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/Model.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.graphics.Bitmap
          import android.graphics.Color

          enum class Kind {
              IDLE, PILL, PANEL_NOTIF, PANEL_CALL, PANEL_MUSIC, PANEL_LIST, PANEL_NOTIFS, PANEL_QUICK
          }

          class Mini(
              val type: Int,
              val text: String = "",
              val bmp: Bitmap? = null,
              val color: Int = Color.WHITE
          ) {
              companion object {
                  const val ART = 0
                  const val BARS = 1
                  const val BOLT = 2
                  const val BT = 3
                  const val ALARM = 4
                  const val RING = 5
                  const val TEXT = 6
              }
          }

          class Row(
              val title: String,
              val sub: String,
              val color: Int,
              val bmp: Bitmap? = null,
              val right: String = "",
              val id: String = ""
          )

          class UiState(
              val kind: Kind,
              val left: Mini? = null,
              val right: Mini? = null,
              val dots: Int = 0,
              val dotIdx: Int = 0,
              val title: String = "",
              val sub: String = "",
              val time: String = "",
              val color: Int = Color.GRAY,
              val bmp: Bitmap? = null,
              val progress: Float = 0f,
              val posText: String = "",
              val durText: String = "",
              val playing: Boolean = false,
              val rows: List<Row> = emptyList(),
              val tiles: BooleanArray = BooleanArray(4),
              val volume: Float = 0f
          )
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/NotchAccessibilityService.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.content.res.Configuration
          import android.view.accessibility.AccessibilityEvent

          class NotchAccessibilityService : AccessibilityService() {

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  NotchController.attachA11y(this)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
              }

              override fun onInterrupt() {
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  NotchController.rebuild()
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  NotchController.detachA11y()
                  return super.onUnbind(intent)
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/NotchController.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.PendingIntent
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.WindowManager
          import java.util.Calendar
          import kotlin.math.max
          import kotlin.math.roundToInt

          object NotchController : NotchView.Host {

              private enum class Exp { NONE, MUSIC, ACTS, NOTIFS, QUICK }

              private class CallInfo(
                  val name: String,
                  val answer: PendingIntent?,
                  val decline: PendingIntent?,
                  val open: PendingIntent?
              )

              private class Act(val type: Int, val left: Mini, val right: Mini, val row: Row)

              private val ORANGE = Color.parseColor("#EF9F27")
              private val TEAL = Color.parseColor("#5DCAA5")
              private val CORAL = Color.parseColor("#D85A30")

              private val h = Handler(Looper.getMainLooper())

              private var a11y: AccessibilityService? = null
              private var listener: NotificationListenerService? = null
              private var wm: WindowManager? = null
              private var view: NotchView? = null
              private var lp: WindowManager.LayoutParams? = null
              private var unit = 2f

              private var mgr: MediaSessionManager? = null
              private var sessions: List<MediaController> = emptyList()
              private var media: MediaController? = null

              private var timerEnd = 0L
              private var alarmRinging = false
              private var call: CallInfo? = null

              private var trans: UiState? = null
              private var transOpen: PendingIntent? = null
              private var exp = Exp.NONE
              private var shift = 0
              private var notifList: List<StatusBarNotification> = emptyList()

              private var torchId: String? = null
              private var torchOn = false
              private var torchRegistered = false

              // ------------------------------------------------------------ lifecycle

              fun attachA11y(s: AccessibilityService) {
                  a11y = s
                  wm = s.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val f = IntentFilter()
                  f.addAction(Intent.ACTION_POWER_CONNECTED)
                  f.addAction(BluetoothDevice.ACTION_ACL_CONNECTED)
                  try {
                      s.registerReceiver(receiver, f)
                  } catch (e: Exception) {
                  }
                  initTorch(s)
                  rebuild()
              }

              fun detachA11y() {
                  val s = a11y
                  removeView()
                  if (s != null) {
                      try {
                          s.unregisterReceiver(receiver)
                      } catch (e: Exception) {
                      }
                      try {
                          if (torchRegistered) {
                              val cm = s.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cm.unregisterTorchCallback(torchCb)
                              torchRegistered = false
                          }
                      } catch (e: Exception) {
                      }
                  }
                  a11y = null
              }

              fun attachListener(s: NotificationListenerService) {
                  listener = s
                  mgr = s.getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                  val cn = ComponentName(s, NotchListener::class.java)
                  try {
                      mgr?.addOnActiveSessionsChangedListener(sessionsListener, cn)
                  } catch (e: Exception) {
                  }
                  updateSessions()
                  scanNotifs()
                  render()
              }

              fun detachListener() {
                  for (c in sessions) {
                      try {
                          c.unregisterCallback(mediaCb)
                      } catch (e: Exception) {
                      }
                  }
                  try {
                      mgr?.removeOnActiveSessionsChangedListener(sessionsListener)
                  } catch (e: Exception) {
                  }
                  sessions = emptyList()
                  media = null
                  listener = null
                  render()
              }

              fun isReady(): Boolean = view != null

              fun demo() {
                  showTransient(
                      UiState(
                          Kind.PANEL_NOTIF,
                          title = "Budi",
                          sub = "Bro, jadi bikin appnya?",
                          time = "sekarang",
                          color = Color.parseColor("#1D9E75")
                      ), 5000L, null
                  )
              }

              fun rebuild() {
                  val s = a11y ?: return
                  removeView()
                  if (!Prefs.enabled(s)) return
                  val dm = s.resources.displayMetrics
                  if (dm.widthPixels > dm.heightPixels) return
                  val u = dm.widthPixels / 360f
                  unit = u

                  var sb = 30f * u
                  val sbId = s.resources.getIdentifier("status_bar_height", "dimen", "android")
                  if (sbId > 0) sb = s.resources.getDimensionPixelSize(sbId).toFloat()

                  var cutB = 0f
                  var cutW = 0f
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          val cut = wm?.currentWindowMetrics?.windowInsets?.displayCutout
                          val r = cut?.boundingRectTop
                          if (r != null && !r.isEmpty) {
                              cutB = r.bottom.toFloat()
                              cutW = r.width().toFloat()
                          }
                      } catch (e: Exception) {
                      }
                  }

                  val extra = Prefs.extraDp(s) * dm.density
                  var nw = Prefs.widthPct(s) / 100f * 360f * u
                  if (cutW > 0f) nw = max(nw, cutW + 24f * u)
                  var nh = if (cutB > 0f) cutB + 2f * u else 26f * u
                  nh = max(nh, 22f * u) + extra
                  val pw = 324f * u

                  val v = NotchView(s, this)
                  v.configure(u, nw, nh, sb, pw)

                  val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  val l = WindowManager.LayoutParams(
                      nw.toInt(),
                      nh.toInt(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  l.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  l.x = (Prefs.offsetDp(s) * dm.density).toInt()
                  l.y = 0
                  if (Build.VERSION.SDK_INT >= 28) {
                      l.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  try {
                      wm?.addView(v, l)
                  } catch (e: Exception) {
                      return
                  }
                  view = v
                  lp = l
                  render()
              }

              private fun removeView() {
                  h.removeCallbacks(tickRun)
                  h.removeCallbacks(collapseRun)
                  h.removeCallbacks(clearTransRun)
                  val v = view
                  if (v != null) {
                      try {
                          wm?.removeView(v)
                      } catch (e: Exception) {
                      }
                  }
                  view = null
                  lp = null
              }

              fun onConfig() {
                  rebuild()
              }

              // --------------------------------------------------------------- window

              private fun growWindow(v: NotchView) {
                  val l = lp ?: return
                  val slack = (14f * unit).toInt()
                  l.width = max(l.width, v.targetW() + slack)
                  l.height = max(l.height, v.targetH() + slack)
                  l.flags = l.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  try {
                      wm?.updateViewLayout(v, l)
                  } catch (e: Exception) {
                  }
              }

              override fun onSettled() {
                  val v = view ?: return
                  val l = lp ?: return
                  l.width = v.targetW()
                  l.height = v.targetH()
                  l.flags = l.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  try {
                      wm?.updateViewLayout(v, l)
                  } catch (e: Exception) {
                  }
              }

              private fun render() {
                  val v = view ?: return
                  val st = buildState()
                  if (v.setState(st)) growWindow(v)
                  scheduleTicks()
              }

              private val tickRun = Runnable { render() }

              private fun scheduleTicks() {
                  h.removeCallbacks(tickRun)
                  val music = exp == Exp.MUSIC && media?.playbackState?.state == PlaybackState.STATE_PLAYING
                  val timer = timerRemaining() > 0
                  if (music) {
                      h.postDelayed(tickRun, 500L)
                  } else if (timer) {
                      h.postDelayed(tickRun, 1000L)
                  }
              }

              // ---------------------------------------------------------------- state

              private fun buildState(): UiState {
                  when (exp) {
                      Exp.MUSIC -> return musicPanel()
                      Exp.ACTS -> return UiState(Kind.PANEL_LIST, rows = acts().map { it.row })
                      Exp.NOTIFS -> return UiState(Kind.PANEL_NOTIFS, rows = notifRowsNow())
                      Exp.QUICK -> return quickPanel()
                      else -> {
                      }
                  }
                  val t = trans
                  if (t != null) return t
                  val ci = call
                  if (ci != null) return UiState(Kind.PANEL_CALL, title = ci.name)
                  if (alarmRinging) {
                      return UiState(
                          Kind.PILL,
                          left = Mini(Mini.ALARM, color = ORANGE),
                          right = Mini(Mini.TEXT, nowText(), color = ORANGE)
                      )
                  }
                  val a = acts()
                  if (a.size >= 2) {
                      return UiState(
                          Kind.PILL,
                          left = a[0].left,
                          right = a[1].right,
                          dots = a.size,
                          dotIdx = Math.floorMod(shift, a.size)
                      )
                  }
                  if (a.size == 1) return UiState(Kind.PILL, left = a[0].left, right = a[0].right)
                  return UiState(Kind.IDLE)
              }

              private fun acts(): List<Act> {
                  val list = ArrayList<Act>()
                  val m = media
                  if (m != null && m.playbackState?.state == PlaybackState.STATE_PLAYING) {
                      val md = m.metadata
                      val bmp = if (md != null) art(md) else null
                      val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Musik"
                      val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                      list.add(
                          Act(
                              0,
                              Mini(Mini.ART, bmp = bmp, color = CORAL),
                              Mini(Mini.BARS),
                              Row(title, artist, CORAL, bmp, "", "music")
                          )
                      )
                  }
                  val rem = timerRemaining()
                  if (rem > 0) {
                      val t = fmtSec(rem)
                      list.add(
                          Act(
                              1,
                              Mini(Mini.RING, color = ORANGE),
                              Mini(Mini.TEXT, t, color = ORANGE),
                              Row("Timer", "Hitung mundur", ORANGE, null, t, "timer")
                          )
                      )
                  }
                  if (list.size >= 2) {
                      val k = Math.floorMod(shift, list.size)
                      if (k > 0) {
                          val rotated = ArrayList<Act>()
                          rotated.addAll(list.subList(k, list.size))
                          rotated.addAll(list.subList(0, k))
                          return rotated
                      }
                  }
                  return list
              }

              private fun art(md: MediaMetadata): Bitmap? {
                  return md.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                      ?: md.getBitmap(MediaMetadata.METADATA_KEY_ART)
                      ?: md.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)
              }

              private fun musicPanel(): UiState {
                  val m = media
                  val md = m?.metadata
                  val ps = m?.playbackState
                  val dur = md?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                  val playing = ps?.state == PlaybackState.STATE_PLAYING
                  var pos = ps?.position ?: 0L
                  if (pos < 0L) pos = 0L
                  if (ps != null && playing) {
                      pos += ((SystemClock.elapsedRealtime() - ps.lastPositionUpdateTime) * ps.playbackSpeed).toLong()
                  }
                  if (dur > 0L && pos > dur) pos = dur
                  val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Musik"
                  val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                  val bmp = if (md != null) art(md) else null
                  return UiState(
                      Kind.PANEL_MUSIC,
                      title = title,
                      sub = artist,
                      color = CORAL,
                      bmp = bmp,
                      progress = if (dur > 0L) pos.toFloat() / dur.toFloat() else 0f,
                      posText = fmtMs(pos),
                      durText = if (dur > 0L) fmtMs(dur) else "--:--",
                      playing = playing
                  )
              }

              private fun quickPanel(): UiState {
                  val c = a11y ?: return UiState(Kind.IDLE)
                  val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val mx = max(1, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC))
                  val vol = am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / mx.toFloat()
                  var wifi = false
                  try {
                      val wmgr = c.applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      wifi = wmgr.isWifiEnabled
                  } catch (e: Exception) {
                  }
                  var data = false
                  try {
                      data = Settings.Global.getInt(c.contentResolver, "mobile_data", 1) == 1
                  } catch (e: Exception) {
                  }
                  var bt = false
                  try {
                      val ad = BluetoothAdapter.getDefaultAdapter()
                      bt = ad != null && ad.isEnabled
                  } catch (e: Exception) {
                  }
                  return UiState(Kind.PANEL_QUICK, tiles = booleanArrayOf(wifi, data, torchOn, bt), volume = vol)
              }

              private fun notifRowsNow(): List<Row> {
                  val l = listener ?: return emptyList()
                  val ctx = a11y ?: return emptyList()
                  val apps = Prefs.apps(ctx)
                  val all = try {
                      l.activeNotifications
                  } catch (e: Exception) {
                      null
                  }
                  if (all == null) return emptyList()
                  val f = all
                      .filter { apps.contains(it.packageName) && (it.notification.flags and Notification.FLAG_GROUP_SUMMARY) == 0 }
                      .sortedByDescending { it.postTime }
                      .take(4)
                  notifList = f
                  val rows = ArrayList<Row>()
                  for (i in f.indices) {
                      rows.add(rowOf(f[i], "n:" + i))
                  }
                  return rows
              }

              private fun rowOf(sbn: StatusBarNotification, id: String): Row {
                  val ex = sbn.notification.extras
                  val t = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val x = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  return Row(t, x, colorFor(sbn.packageName), iconOf(sbn), "", id)
              }

              private fun colorFor(pkg: String): Int {
                  return when {
                      pkg.startsWith("com.whatsapp") -> Color.parseColor("#1D9E75")
                      pkg.contains("telegram") -> Color.parseColor("#378ADD")
                      pkg.contains("instagram") -> Color.parseColor("#D4537E")
                      else -> Color.parseColor("#7F77DD")
                  }
              }

              private fun iconOf(sbn: StatusBarNotification): Bitmap? {
                  val ctx = a11y ?: return null
                  try {
                      val ic = sbn.notification.getLargeIcon() ?: return null
                      val d = ic.loadDrawable(ctx) ?: return null
                      val b = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
                      val cv = Canvas(b)
                      d.setBounds(0, 0, 96, 96)
                      d.draw(cv)
                      return b
                  } catch (e: Exception) {
                      return null
                  }
              }

              // ----------------------------------------------------------- formatting

              private fun timerRemaining(): Long {
                  if (timerEnd <= 0L) return 0L
                  val r = (timerEnd - System.currentTimeMillis()) / 1000L
                  return if (r > 0L) r else 0L
              }

              private fun fmtSec(s: Long): String {
                  val hh = s / 3600L
                  val mm = (s % 3600L) / 60L
                  val ss = s % 60L
                  return if (hh > 0L) String.format("%d.%02d.%02d", hh, mm, ss) else String.format("%02d.%02d", mm, ss)
              }

              private fun fmtMs(ms: Long): String {
                  val t = ms / 1000L
                  return String.format("%d:%02d", t / 60L, t % 60L)
              }

              private fun nowText(): String {
                  val c = Calendar.getInstance()
                  return String.format("%02d.%02d", c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE))
              }

              // --------------------------------------------------------- notifications

              fun onPosted(sbn: StatusBarNotification) {
                  scanNotifs()
                  val ctx = a11y
                  if (ctx != null) {
                      val n = sbn.notification
                      val isGroup = (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0
                      if (Prefs.apps(ctx).contains(sbn.packageName) && !isGroup && !sbn.isOngoing &&
                          n.category != Notification.CATEGORY_CALL
                      ) {
                          val row = rowOf(sbn, "notif")
                          if (row.title.isNotEmpty() || row.sub.isNotEmpty()) {
                              showTransient(
                                  UiState(
                                      Kind.PANEL_NOTIF,
                                      title = row.title,
                                      sub = row.sub,
                                      time = "sekarang",
                                      color = row.color,
                                      bmp = row.bmp
                                  ), 5000L, n.contentIntent
                              )
                              return
                          }
                      }
                  }
                  render()
              }

              fun onRemoved(sbn: StatusBarNotification) {
                  scanNotifs()
                  render()
              }

              private fun isClock(p: String): Boolean {
                  val s = p.lowercase()
                  return s.contains("deskclock") || s.contains("clock") || s.contains("alarm")
              }

              private fun scanNotifs() {
                  val l = listener ?: return
                  val all = try {
                      l.activeNotifications
                  } catch (e: Exception) {
                      null
                  }
                  if (all == null) return
                  var tEnd = 0L
                  var ring = false
                  var ci: CallInfo? = null
                  for (sbn in all) {
                      val n = sbn.notification
                      val cat = n.category
                      if (cat == Notification.CATEGORY_CALL) {
                          val c = parseCall(sbn)
                          if (c != null) ci = c
                      } else if (isClock(sbn.packageName) || cat == Notification.CATEGORY_ALARM) {
                          val ex = n.extras
                          if (n.fullScreenIntent != null) {
                              ring = true
                          } else if (ex.getBoolean(Notification.EXTRA_SHOW_CHRONOMETER) &&
                              ex.getBoolean(Notification.EXTRA_CHRONOMETER_COUNT_DOWN)
                          ) {
                              tEnd = n.`when`
                          }
                      }
                  }
                  timerEnd = tEnd
                  alarmRinging = ring
                  call = ci
              }

              private fun parseCall(sbn: StatusBarNotification): CallInfo? {
                  val n = sbn.notification
                  val answerWords = listOf("angkat", "jawab", "answer", "accept", "terima")
                  val declineWords = listOf("tolak", "decline", "reject", "abaikan", "dismiss")
                  var ans: PendingIntent? = null
                  var dec: PendingIntent? = null
                  val actions = n.actions
                  if (actions != null) {
                      for (a in actions) {
                          val t = (a.title?.toString() ?: "").lowercase()
                          if (answerWords.any { t.contains(it) }) {
                              ans = a.actionIntent
                          } else if (declineWords.any { t.contains(it) }) {
                              dec = a.actionIntent
                          }
                      }
                  }
                  val incoming = ans != null || n.fullScreenIntent != null
                  if (!incoming) return null
                  val name = n.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: "Panggilan masuk"
                  val open = n.contentIntent ?: n.fullScreenIntent
                  return CallInfo(name, ans, dec, open)
              }

              // ------------------------------------------------------------ transient

              private val clearTransRun = Runnable {
                  trans = null
                  transOpen = null
                  render()
              }

              private fun showTransient(st: UiState, ms: Long, open: PendingIntent?) {
                  if (exp != Exp.NONE) {
                      render()
                      return
                  }
                  trans = st
                  transOpen = open
                  h.removeCallbacks(clearTransRun)
                  h.postDelayed(clearTransRun, ms)
                  render()
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      val act = i.action
                      if (act == Intent.ACTION_POWER_CONNECTED) {
                          val b = c.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          var pct = 0
                          if (b != null) {
                              val lv = b.getIntExtra("level", 0)
                              val sc = b.getIntExtra("scale", 100)
                              pct = lv * 100 / max(1, sc)
                          }
                          showTransient(
                              UiState(
                                  Kind.PILL,
                                  left = Mini(Mini.BOLT),
                                  right = Mini(Mini.TEXT, pct.toString() + "%", color = TEAL)
                              ), 3500L, null
                          )
                      } else if (act == BluetoothDevice.ACTION_ACL_CONNECTED) {
                          var name = "Bluetooth"
                          try {
                              val d = i.getParcelableExtra<BluetoothDevice>(BluetoothDevice.EXTRA_DEVICE)
                              val n = d?.name
                              if (n != null) name = n
                          } catch (e: Exception) {
                          }
                          showTransient(
                              UiState(
                                  Kind.PILL,
                                  left = Mini(Mini.BT),
                                  right = Mini(Mini.TEXT, name, color = Color.WHITE)
                              ), 4000L, null
                          )
                      }
                  }
              }

              // ---------------------------------------------------------------- media

              private val mediaCb = object : MediaController.Callback() {
                  override fun onPlaybackStateChanged(state: PlaybackState?) {
                      pickMedia()
                      render()
                  }

                  override fun onMetadataChanged(metadata: MediaMetadata?) {
                      render()
                  }

                  override fun onSessionDestroyed() {
                      updateSessions()
                  }
              }

              private val sessionsListener = MediaSessionManager.OnActiveSessionsChangedListener { list ->
                  for (c in sessions) {
                      try {
                          c.unregisterCallback(mediaCb)
                      } catch (e: Exception) {
                      }
                  }
                  sessions = list ?: emptyList()
                  for (c in sessions) {
                      try {
                          c.registerCallback(mediaCb, h)
                      } catch (e: Exception) {
                      }
                  }
                  pickMedia()
                  render()
              }

              private fun updateSessions() {
                  val m = mgr ?: return
                  val l = listener ?: return
                  val cn = ComponentName(l, NotchListener::class.java)
                  val list = try {
                      m.getActiveSessions(cn)
                  } catch (e: Exception) {
                      emptyList<MediaController>()
                  }
                  for (c in sessions) {
                      try {
                          c.unregisterCallback(mediaCb)
                      } catch (e: Exception) {
                      }
                  }
                  sessions = list
                  for (c in sessions) {
                      try {
                          c.registerCallback(mediaCb, h)
                      } catch (e: Exception) {
                      }
                  }
                  pickMedia()
                  render()
              }

              private fun pickMedia() {
                  val playing = sessions.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                  if (playing != null) {
                      media = playing
                      return
                  }
                  val old = media
                  if (old != null && sessions.any { it.sessionToken == old.sessionToken }) return
                  media = sessions.firstOrNull()
              }

              // ---------------------------------------------------------------- torch

              private val torchCb = object : CameraManager.TorchCallback() {
                  override fun onTorchModeChanged(cameraId: String, enabled: Boolean) {
                      if (cameraId == torchId) {
                          torchOn = enabled
                          if (exp == Exp.QUICK) render()
                      }
                  }
              }

              private fun initTorch(c: Context) {
                  try {
                      val cm = c.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      for (id in cm.cameraIdList) {
                          val ch = cm.getCameraCharacteristics(id)
                          val flash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          val back = ch.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                          if (flash && back) {
                              torchId = id
                              break
                          }
                      }
                      if (!torchRegistered) {
                          cm.registerTorchCallback(torchCb, h)
                          torchRegistered = true
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun toggleTorch() {
                  val c = a11y ?: return
                  val id = torchId ?: return
                  try {
                      val cm = c.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      cm.setTorchMode(id, !torchOn)
                  } catch (e: Exception) {
                  }
              }

              // -------------------------------------------------------------- gestures

              private val collapseRun = Runnable {
                  exp = Exp.NONE
                  render()
              }

              private fun setExp(e: Exp) {
                  exp = e
                  h.removeCallbacks(collapseRun)
                  if (e != Exp.NONE) h.postDelayed(collapseRun, 8000L)
                  view?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                  render()
              }

              override fun onActive() {
                  if (exp != Exp.NONE) {
                      h.removeCallbacks(collapseRun)
                      h.postDelayed(collapseRun, 8000L)
                  }
              }

              override fun onTapEmpty() {
                  if (exp != Exp.NONE) return
                  if (trans != null || call != null || alarmRinging) return
                  val a = acts()
                  if (a.size >= 2) {
                      setExp(Exp.ACTS)
                  } else if (a.size == 1 && a[0].type == 0) {
                      setExp(Exp.MUSIC)
                  }
              }

              override fun onLongPress(left: Boolean) {
                  if (exp != Exp.NONE) return
                  setExp(if (left) Exp.NOTIFS else Exp.QUICK)
              }

              override fun onSwipe(dir: Int) {
                  if (exp != Exp.NONE) return
                  if (acts().size >= 2) {
                      shift += dir
                      view?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                      render()
                  }
              }

              override fun onClose() {
                  exp = Exp.NONE
                  trans = null
                  transOpen = null
                  h.removeCallbacks(collapseRun)
                  h.removeCallbacks(clearTransRun)
                  render()
              }

              private fun send(pi: PendingIntent?) {
                  try {
                      pi?.send()
                  } catch (e: Exception) {
                  }
              }

              private fun launch(action: String) {
                  val c = a11y ?: return
                  try {
                      val i = Intent(action)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      c.startActivity(i)
                  } catch (e: Exception) {
                  }
              }

              override fun onAction(id: String, frac: Float) {
                  val m = media
                  if (id == "prev") {
                      m?.transportControls?.skipToPrevious()
                  } else if (id == "next") {
                      m?.transportControls?.skipToNext()
                  } else if (id == "toggle") {
                      val tc = m?.transportControls
                      if (m?.playbackState?.state == PlaybackState.STATE_PLAYING) tc?.pause() else tc?.play()
                  } else if (id == "seek") {
                      val dur = m?.metadata?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                      if (dur > 0L) m?.transportControls?.seekTo((dur * frac).toLong())
                  } else if (id == "answer") {
                      send(call?.answer ?: call?.open)
                  } else if (id == "decline") {
                      send(call?.decline)
                  } else if (id == "notif") {
                      send(transOpen)
                      onClose()
                      return
                  } else if (id == "music") {
                      setExp(Exp.MUSIC)
                      return
                  } else if (id.startsWith("n:")) {
                      val idx = id.substring(2).toIntOrNull() ?: -1
                      if (idx >= 0 && idx < notifList.size) send(notifList[idx].notification.contentIntent)
                      onClose()
                      return
                  } else if (id == "wifi") {
                      launch(if (Build.VERSION.SDK_INT >= 29) Settings.Panel.ACTION_WIFI else Settings.ACTION_WIFI_SETTINGS)
                      onClose()
                      return
                  } else if (id == "data") {
                      launch(
                          if (Build.VERSION.SDK_INT >= 29) Settings.Panel.ACTION_INTERNET_CONNECTIVITY
                          else Settings.ACTION_DATA_ROAMING_SETTINGS
                      )
                      onClose()
                      return
                  } else if (id == "bt") {
                      launch(Settings.ACTION_BLUETOOTH_SETTINGS)
                      onClose()
                      return
                  } else if (id == "torch") {
                      toggleTorch()
                  } else if (id == "vol") {
                      val c = a11y
                      if (c != null) {
                          val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val mx = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, (frac * mx).roundToInt(), 0)
                      }
                  }
                  render()
              }
          }
