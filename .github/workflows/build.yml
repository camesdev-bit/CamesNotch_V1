          import android.view.View
          import android.view.ViewConfiguration
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin

          private val C_GRAY = Color.parseColor("#9A9A9F")
          private val C_ORANGE = Color.parseColor("#FF9F0A")
          private val C_AMBER = Color.parseColor("#FFD60A")
          private val C_GREEN = Color.parseColor("#30D158")
          private val C_RED = Color.parseColor("#FF453A")
          private val C_RED_TEXT = Color.parseColor("#FF6961")
          private val C_TEAL = Color.parseColor("#63E6BE")
          private val C_FILL = Color.argb(34, 255, 255, 255)
          private val C_TRACK = Color.argb(50, 255, 255, 255)
          private val C_LINE = Color.argb(28, 255, 255, 255)

          private const val ROW = 36f
          private const val TEXT_VP = 116f

          class NotchView(ctx: Context, private val host: Host) : View(ctx) {

           interface Host {
            fun onAction(id: String, frac: Float)
            fun onTapEmpty()
            fun onLongPress(left: Boolean)
            fun onSwipe(dir: Int)
            fun onSwipeDown()
            fun onClose()
            fun onActive()
            fun onSettled()
           }

           private class Hit(
            val id: String,
            val r: RectF,
            val tl: Float = 0f,
            val tw: Float = 0f,
            val scroll: Boolean = false
           )

           var outlineOn = true
           var haptics = true
           var jelly = true

           private var u = 2f
           private var collapsedW = 236f
           private var collapsedH = 52f
           private var panelW = 648f
           private var cameraW = 0f
           private var refPh = 100f

           private var state: UiState? = null
           private var prevState: UiState? = null
           private var prevAlpha = 0f

           private val cur = FloatArray(4)
           private val vel = FloatArray(4)
           private val tgt = FloatArray(4)
           private val kArr = floatArrayOf(300f, 240f, 400f, 380f)
           private val cArr = floatArrayOf(17f, 19f, 30f, 11f)

           private val accCur = floatArrayOf(255f, 255f, 255f)
           private val accTgt = floatArrayOf(255f, 255f, 255f)

           private var modeKey = -1
           private var contentAlpha = 1f
           private var contentDelay = 0f
           private var slide = 0f
           private var scrollY = 0f
           private var flingV = 0f

           private var tScroll = 0f
           private var tLayout: StaticLayout? = null
           private var tKey = ""
           private var tBody = 0
           private var tEndSent = false

           private var running = false
           private var lastFrame = 0L
           private var barsRunning = false
           private var noHits = false

           private val hits = ArrayList<Hit>()
           private val listClip = RectF()
           private val textClip = RectF()
           private val slop = ViewConfiguration.get(ctx).scaledTouchSlop

           private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
           private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
           private val glow = Paint(Paint.ANTI_ALIAS_FLAG)
           private val tp = TextPaint(Paint.ANTI_ALIAS_FLAG)
           private val bodyPaint = TextPaint(Paint.ANTI_ALIAS_FLAG)
           private val bmpPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
           private val path = Path()
           private val shape = Path()
           private val tmp = Path()
           private val rect = RectF()
           private val src = Rect()

           private val tfReg = Typeface.DEFAULT
           private val tfMed = Typeface.create("sans-serif-medium", Typeface.NORMAL)
           private val tfLight = Typeface.create("sans-serif-light", Typeface.NORMAL)

           private var downX = 0f
           private var downY = 0f
           private var moved = false
           private var longFired = false
           private var scrolling = false
           private var inList = false
           private var inText = false
           private var touching = false
           private var startScroll = 0f
           private var downHit: Hit? = null
           private var tracker: VelocityTracker? = null

           init {
            stroke.style = Paint.Style.STROKE
            stroke.strokeCap = Paint.Cap.ROUND
            stroke.strokeJoin = Paint.Join.ROUND
           }

           fun configure(unit: Float, nw: Float, nh: Float, pw: Float, camW: Float) {
            u = unit
            collapsedW = nw
            collapsedH = nh
            panelW = pw
            cameraW = camW
            tKey = ""
            val s = state
            if (s != null) {
             snapTo(s)
             invalidate()
            }
           }

           private fun pillW(): Float = min(150f * u, max(collapsedW + 16f * u, cameraW + 80f * u))

           private fun isPanel(s: UiState): Boolean = s.kind != Kind.IDLE && s.kind != Kind.PILL

           private fun viewportH(s: UiState): Float = min(s.rows.size.toFloat(), 4.5f) * ROW * u

           private fun panelH(s: UiState): Float = when (s.kind) {
            Kind.PANEL_NOTIF -> 58f * u
            Kind.PANEL_CALL -> 96f * u
            Kind.PANEL_MUSIC -> 126f * u
            Kind.PANEL_LIST, Kind.PANEL_NOTIFS ->
             if (s.rows.isEmpty()) 66f * u else 18f * u + viewportH(s) + 8f * u
            Kind.PANEL_QUICK -> 204f * u
            Kind.PANEL_INFO -> 86f * u
            Kind.PANEL_TIMER -> 126f * u
            Kind.PANEL_TEXT -> 176f * u
            Kind.PANEL_QR -> 68f * u
            else -> 0f
           }

           private fun maxScroll(): Float {
            val s = state ?: return 0f
            if (s.kind != Kind.PANEL_NOTIFS && s.kind != Kind.PANEL_LIST) return 0f
            return max(0f, s.rows.size * ROW * u - viewportH(s))
           }

           private fun textMax(): Float {
            val l = tLayout ?: return 0f
            return max(0f, l.height.toFloat() + 14f * u - TEXT_VP * u)
           }

           private fun targetsFor(s: UiState) {
            if (isPanel(s)) {
             tgt[0] = collapsedW
             tgt[1] = panelH(s)
             refPh = max(1f, tgt[1])
            } else {
             tgt[0] = if (s.kind == Kind.PILL) pillW() else collapsedW
             tgt[1] = 0f
            }
            val ac = accentOf(s)
            accTgt[0] = Color.red(ac).toFloat()
            accTgt[1] = Color.green(ac).toFloat()
            accTgt[2] = Color.blue(ac).toFloat()
           }

           private fun accentOf(s: UiState): Int = when (s.kind) {
            Kind.PILL -> s.left?.color ?: Color.WHITE
            Kind.PANEL_MUSIC -> s.color
            Kind.PANEL_NOTIF -> s.color
            Kind.PANEL_QR -> s.color
            Kind.PANEL_CALL -> C_GREEN
            Kind.PANEL_TIMER -> C_ORANGE
            else -> Color.WHITE
           }

           private fun snapTo(s: UiState) {
            state = s
            targetsFor(s)
            cur[0] = tgt[0]
            cur[1] = tgt[1]
            cur[3] = 0f
            vel[0] = 0f
            vel[1] = 0f
            vel[3] = 0f
            for (i in 0..2) accCur[i] = accTgt[i]
            contentAlpha = 1f
            contentDelay = 0f
            modeKey = keyOf(s)
            prevState = null
            if (s.kind == Kind.PANEL_TEXT) ensureTextLayout(s)
           }

           fun bigW(): Int = ceil(panelW + 30f * u).toInt()
           fun bigH(): Int = ceil(collapsedH + 240f * u).toInt()

           fun touchW(s: UiState): Int =
            if (isPanel(s)) ceil(panelW + 4f * u).toInt() else ceil(pillW() + 44f * u).toInt()

           fun touchH(s: UiState): Int =
            if (isPanel(s)) ceil(collapsedH + panelH(s) + 4f * u).toInt()
            else ceil(collapsedH + (if (s.dots > 1) 18f * u else 8f * u)).toInt()

           private fun keyOf(s: UiState): Int {
            return s.kind.ordinal * 10000 + (s.left?.type ?: 9) * 100 + (s.right?.type ?: 9) * 10
           }

           private fun needsAnim(s: UiState): Boolean {
            return s.left?.type == Mini.BARS || s.right?.type == Mini.BARS || s.left?.type == Mini.ALARM
           }

           private fun ensureTextLayout(s: UiState) {
            val w = max(1, (panelW - 40f * u).toInt())
            val key = s.body.hashCode().toString() + "|" + w + "|" + s.fontSize
            if (key == tKey && tLayout != null) return
            val old = tLayout
            val same = s.body.hashCode() == tBody
            val ratio = if (old != null && textMax() > 0f) tScroll / textMax() else 0f
            bodyPaint.color = Color.WHITE
            bodyPaint.typeface = tfMed
            bodyPaint.textSize = s.fontSize * u
            tLayout = StaticLayout.Builder.obtain(s.body, 0, s.body.length, bodyPaint, w)
             .setLineSpacing(0f, 1.2f)
             .build()
            tKey = key
            tBody = s.body.hashCode()
            tScroll = if (old != null && same) ratio * textMax() else 0f
           }

           fun nudge(dir: Int) {
            slide = dir * 16f * u
            startLoop()
           }

           fun setState(s: UiState) {
            val old = state
            val first = old == null
            state = s
            targetsFor(s)
            val ms = maxScroll()
            if (scrollY > ms) scrollY = ms
            if (first) {
             cur[0] = tgt[0]
             cur[1] = tgt[1]
             vel[0] = 0f
             vel[1] = 0f
             cur[2] = 0f
             for (i in 0..2) accCur[i] = accTgt[i]
            }
            if (s.kind == Kind.PANEL_TEXT) {
             if (old == null || old.kind != Kind.PANEL_TEXT) {
              tKey = ""
              tLayout = null
              tScroll = 0f
              tEndSent = false
             }
             ensureTextLayout(s)
            }
            val k = keyOf(s)
            if (k != modeKey) {
             modeKey = k
             if (!first && old != null) {
              if (isPanel(old)) {
               prevState = old
               prevAlpha = 1f
              }
              contentAlpha = 0f
              contentDelay = 0.04f
              scrollY = 0f
              flingV = 0f
              if (jelly) {
               val wasPanel = isPanel(old)
               val nowPanel = isPanel(s)
               if (wasPanel && !nowPanel) {
                vel[3] = 1.6f
               } else if (!wasPanel && nowPanel) {
                vel[3] = -1.0f
               } else if (wasPanel && nowPanel) {
                vel[3] = 0.6f
               }
              }
             }
            }
            startLoop()
            startBars()
            invalidate()
           }

           fun warmUp(list: List<UiState>) {
            val bw = bigW()
            val bh = bigH()
            if (bw <= 0 || bh <= 0) return
            try {
             layout(0, 0, bw, bh)
             val bmp = Bitmap.createBitmap(max(1, bw / 3), max(1, bh / 3), Bitmap.Config.ARGB_8888)
             val cv = Canvas(bmp)
             for (rep in 0..2) {
              for (s in list) {
               snapTo(s)
               val sv = cv.save()
               cv.scale(0.33f, 0.33f)
               draw(cv)
               cv.restoreToCount(sv)
              }
             }
             bmp.recycle()
            } catch (e: Exception) {
            }
            state = null
            prevState = null
            modeKey = -1
            scrollY = 0f
            tScroll = 0f
            tKey = ""
            tLayout = null
            hits.clear()
           }

           private fun startLoop() {
            if (!running) {
             running = true
             lastFrame = 0L
             Choreographer.getInstance().postFrameCallback(frame)
            }
           }

           private val frame = object : Choreographer.FrameCallback {
            override fun doFrame(frameTimeNanos: Long) {
             if (lastFrame == 0L) {
              lastFrame = frameTimeNanos
              Choreographer.getInstance().postFrameCallback(this)
              return
             }
             var dt = (frameTimeNanos - lastFrame) / 1_000_000_000f
             lastFrame = frameTimeNanos
             if (dt > 0.05f) dt = 0.05f
             if (dt < 0.001f) dt = 0.001f

             var moving = false
             val sub = 4
             val h = dt / sub
             for (i in 0..3) {
              for (n in 0 until sub) {
               val a = kArr[i] * (tgt[i] - cur[i]) - cArr[i] * vel[i]
               vel[i] += a * h
               cur[i] += vel[i] * h
              }
              if (i == 3) {
               if (cur[3] > 0.2f) cur[3] = 0.2f
               if (cur[3] < -0.2f) cur[3] = -0.2f
              }
              val small = i >= 2
              val eps = if (small) 0.003f else 0.35f
              val epsV = if (small) 0.02f else 1f
              if (abs(vel[i]) > epsV || abs(tgt[i] - cur[i]) > eps) {
               moving = true
              } else {
               cur[i] = tgt[i]
               vel[i] = 0f
              }
             }

             val k = min(1f, dt * 9f)
             for (i in 0..2) {
              val d = accTgt[i] - accCur[i]
              if (abs(d) > 0.8f) {
               accCur[i] += d * k
               moving = true
              } else {
               accCur[i] = accTgt[i]
              }
             }

             if (abs(flingV) > 25f) {
              scrollY += flingV * dt
              val ms = maxScroll()
              if (scrollY < 0f) {
               scrollY = 0f
               flingV = 0f
              } else if (scrollY > ms) {
               scrollY = ms
               flingV = 0f
              } else {
               flingV *= exp(-dt * 3.2f)
              }
              moving = true
             } else {
              flingV = 0f
             }

             val st = state
             if (st != null && st.kind == Kind.PANEL_TEXT && tLayout != null) {
              val tm = textMax()
              if (st.playing && !touching) {
               if (tScroll < tm) {
                tScroll = min(tm, tScroll + 24f * u * st.speed * dt)
                moving = true
               } else if (!tEndSent) {
                tEndSent = true
                host.onAction("tx_end", 0f)
               }
              }
              if (tScroll < tm - 1f) tEndSent = false
             }

             if (abs(slide) > 0.4f) {
              slide *= exp(-dt * 11f)
              moving = true
             } else {
              slide = 0f
             }

             if (prevAlpha > 0f) {
              prevAlpha -= dt / 0.16f
              if (prevAlpha <= 0f) {
               prevAlpha = 0f
               prevState = null
              }
              moving = true
             }

             if (contentDelay > 0f) {
              contentDelay -= dt
              moving = true
             } else if (contentAlpha < 1f) {
              contentAlpha = min(1f, contentAlpha + dt / 0.2f)
              moving = true
             }

             invalidate()
             if (moving) {
              Choreographer.getInstance().postFrameCallback(this)
             } else {
              running = false
              lastFrame = 0L
              host.onSettled()
             }
            }
           }

           private val barsRun = object : Runnable {
            override fun run() {
             val s = state
             if (s != null && needsAnim(s) && isAttachedToWindow) {
              invalidate()
              postDelayed(this, 50L)
             } else {
              barsRunning = false
             }
            }
           }

           private fun startBars() {
            val s = state ?: return
            if (needsAnim(s) && !barsRunning) {
             barsRunning = true
             postDelayed(barsRun, 50L)
            }
           }

           override fun onDetachedFromWindow() {
            Choreographer.getInstance().removeFrameCallback(frame)
            removeCallbacks(barsRun)
            removeCallbacks(longRun)
            running = false
            barsRunning = false
            super.onDetachedFromWindow()
           }

           private fun addHit(h: Hit) {
            if (!noHits) hits.add(h)
           }

           private fun alphaFor(s: UiState): Float {
            var a = contentAlpha
            if (isPanel(s)) {
             val t = tgt[1]
             val p = if (t > 0f) max(0f, min(1f, cur[1] / t)) else 1f
             val g = max(0f, min(1f, (p - 0.5f) / 0.4f))
             a = min(a, g)
            }
            return a
           }

           override fun onDraw(c: Canvas) {
            val s = state ?: return
            hits.clear()
            listClip.setEmpty()
            textClip.setEmpty()
            val cx = width / 2f
            val py = collapsedH
            val nw = max(0f, cur[0])
            val ph = max(0f, cur[1])
            val t = max(0f, min(1f, ph / refPh))
            val ease = 1f - (1f - t) * (1f - t)
            val pw = nw + (panelW - nw) * ease

            val outer = c.save()
            if (ph < 1f && cur[2] > 0.001f) {
             val sc = 1f + 0.04f * cur[2]
             c.scale(sc, sc, cx, 0f)
            }
            val j = cur[3]
            if (abs(j) > 0.001f) {
             c.scale(1f + j, 1f - j * 0.75f, cx, 0f)
            }
            if (s.left?.type == Mini.ALARM) {
             val tm = System.currentTimeMillis() / 1000f
             c.translate(sin(tm * 38f) * 1.4f * u, 0f)
            }

            fill.color = Color.BLACK
            val neckH = if (ph > 0.5f) py + min(ph, 14f * u) else py
            val nl = cx - nw / 2f
            val nr = cx + nw / 2f
            val r = min(14f * u, neckH / 2f)
            rect.set(nl, -neckH, nr, neckH)
            c.drawRoundRect(rect, r, r, fill)
            shape.reset()
            shape.addRoundRect(rect, r, r, Path.Direction.CW)

            if (ph > 0.5f) {
             val pl = cx - pw / 2f
             val pr = cx + pw / 2f
             val rp = min(22f * u, min(ph / 2f, pw / 2f))
             rect.set(pl, py, pr, py + ph)
             c.drawRoundRect(rect, rp, rp, fill)
             tmp.reset()
             tmp.addRoundRect(rect, rp, rp, Path.Direction.CW)
             shape.op(tmp, Path.Op.UNION)

             val f = min(20f * u, min(ph / 2.2f, (pw - nw) / 2f - 0.5f))
             if (f > 1f) {
              path.reset()
              path.moveTo(nl - f, py)
              path.lineTo(nl, py)
              path.lineTo(nl, py - f)
              rect.set(nl - 2f * f, py - 2f * f, nl, py)
              path.arcTo(rect, 0f, 90f)
              path.close()
              c.drawPath(path, fill)
              shape.op(path, Path.Op.UNION)

              path.reset()
              path.moveTo(nr + f, py)
              path.lineTo(nr, py)
              path.lineTo(nr, py - f)
              rect.set(nr, py - 2f * f, nr + 2f * f, py)
              path.arcTo(rect, 180f, -90f)
              path.close()
              c.drawPath(path, fill)
              shape.op(path, Path.Op.UNION)
             }

             if (ph > 10f * u) {
              val ar = accCur[0].roundToInt()
              val ag = accCur[1].roundToInt()
              val ab = accCur[2].roundToInt()
              val diff = max(ar, max(ag, ab)) - min(ar, min(ag, ab))
              val ga = ((if (diff < 30) 14f else 56f) * ease).roundToInt()
              val sv = c.save()
              c.clipPath(shape)
              glow.shader = RadialGradient(
               cx - pw * 0.26f, py + ph, pw * 0.8f,
               Color.argb(ga, ar, ag, ab), Color.argb(0, ar, ag, ab), Shader.TileMode.CLAMP
              )
              rect.set(cx - pw / 2f, py, cx + pw / 2f, py + ph)
              c.drawRect(rect, glow)
              c.restoreToCount(sv)
             }
            }

            if (outlineOn) {
             val mr = (255f + (accCur[0] - 255f) * 0.55f).roundToInt()
             val mg = (255f + (accCur[1] - 255f) * 0.55f).roundToInt()
             val mb = (255f + (accCur[2] - 255f) * 0.55f).roundToInt()
             stroke.color = Color.argb(92, mr, mg, mb)
             stroke.strokeWidth = 1.2f * u
             c.drawPath(shape, stroke)
            }

            val pv = prevState
            if (pv != null && prevAlpha > 0.01f) {
             val sv = c.save()
             c.clipPath(shape)
             val layer = c.saveLayerAlpha(
              cx - panelW / 2f - 4f * u, 0f, cx + panelW / 2f + 4f * u, py + panelH(pv) + 24f * u,
              (255f * prevAlpha).roundToInt()
             )
             noHits = true
             drawContent(c, pv, cx)
             noHits = false
             c.restoreToCount(layer)
             c.restoreToCount(sv)
            }

            val a = alphaFor(s)
            if (s.kind != Kind.IDLE && a > 0.01f) {
             var layer = -1
             if (a < 0.995f) {
              val bottom = py + ph + 24f * u
              layer = c.saveLayerAlpha(
               cx - panelW / 2f - 4f * u, 0f, cx + panelW / 2f + 4f * u, bottom,
               (255f * a).roundToInt()
              )
             }
             val sv = c.save()
             if (s.kind == Kind.PILL) c.translate(slide, 0f)
             drawContent(c, s, cx)
             if (isPanel(s) && s.kind != Kind.PANEL_NOTIF && s.kind != Kind.PANEL_CALL && s.kind != Kind.PANEL_QR) {
              drawPin(c, s, cx)
             }
             c.restoreToCount(sv)
             if (layer >= 0) c.restoreToCount(layer)
            }
            c.restoreToCount(outer)
           }

           private fun drawContent(c: Canvas, s: UiState, cx: Float) {
            when (s.kind) {
             Kind.PILL -> drawPill(c, s, cx)
             Kind.PANEL_NOTIF -> drawNotif(c, s, cx)
             Kind.PANEL_CALL -> drawCall(c, s, cx)
             Kind.PANEL_MUSIC -> drawMusic(c, s, cx)
             Kind.PANEL_LIST -> drawRows(c, s, cx, "Tidak ada aktivitas")
             Kind.PANEL_NOTIFS -> drawRows(c, s, cx, "Tidak ada notifikasi")
             Kind.PANEL_QUICK -> drawQuick(c, s, cx)
             Kind.PANEL_INFO -> drawInfo(c, s, cx)
             Kind.PANEL_TIMER -> drawTimer(c, s, cx)
             Kind.PANEL_TEXT -> drawText(c, s, cx)
             Kind.PANEL_QR -> drawQr(c, s, cx)
             else -> {
             }
            }
           }

           private fun text(
            c: Canvas, s: String, x: Float, y: Float, size: Float, color: Int,
            bold: Boolean = false, align: Paint.Align = Paint.Align.LEFT,
            maxW: Float = 0f, shrink: Boolean = false, light: Boolean = false
           ) {
            tp.color = color
            tp.textAlign = align
            tp.typeface = if (light) tfLight else if (bold) tfMed else tfReg
            tp.textSize = size * u
            var str = s
            if (maxW > 0f) {
             val w = tp.measureText(str)
             if (w > maxW) {
              if (shrink) {
               tp.textSize = max(size * u * maxW / w, 7f * u)
              }
              if (tp.measureText(str) > maxW) {
               str = TextUtils.ellipsize(str, tp, maxW, TextUtils.TruncateAt.END).toString()
              }
             }
            }
            c.drawText(str, x, y, tp)
           }

           private fun drawBmp(c: Canvas, bmp: Bitmap, l: Float, t: Float, r: Float, b: Float, rad: Float) {
            path.reset()
            rect.set(l, t, r, b)
            path.addRoundRect(rect, rad, rad, Path.Direction.CW)
            val sv = c.save()
            c.clipPath(path)
            src.set(0, 0, bmp.width, bmp.height)
            c.drawBitmap(bmp, src, rect, bmpPaint)
            c.restoreToCount(sv)
           }

           private fun art(c: Canvas, bmp: Bitmap?, color: Int, l: Float, t: Float, r: Float, b: Float, rad: Float) {
            if (bmp != null) {
             drawBmp(c, bmp, l, t, r, b, rad)
            } else {
             fill.color = color
             rect.set(l, t, r, b)
             c.drawRoundRect(rect, rad, rad, fill)
            }
            stroke.color = Color.argb(40, 255, 255, 255)
            stroke.strokeWidth = 0.8f * u
            rect.set(l, t, r, b)
            c.drawRoundRect(rect, rad, rad, stroke)
           }

           private fun avatar(c: Canvas, bmp: Bitmap?, color: Int, label: String, cx: Float, cy: Float, r: Float) {
            if (bmp != null) {
             drawBmp(c, bmp, cx - r, cy - r, cx + r, cy + r, r)
            } else {
             fill.color = color
             c.drawCircle(cx, cy, r, fill)
             val ch = if (label.isNotEmpty()) label.substring(0, 1).uppercase() else "?"
             text(c, ch, cx, cy + 4.5f * u, 12f, Color.WHITE, true, Paint.Align.CENTER)
            }
           }

           private fun button(c: Canvas, label: String, color: Int, l: Float, t: Float, r: Float, b: Float, id: String) {
            fill.color = color
            rect.set(l, t, r, b)
            c.drawRoundRect(rect, (b - t) / 2f, (b - t) / 2f, fill)
            text(c, label, (l + r) / 2f, (t + b) / 2f + 4.5f * u, 12.5f, Color.WHITE, true, Paint.Align.CENTER)
            addHit(Hit(id, RectF(l, t, r, b)))
           }

           private fun drawBt(c: Canvas, x: Float, y: Float, k: Float, color: Int, w: Float) {
            stroke.color = color
            stroke.strokeWidth = w
            path.reset()
            path.moveTo(x - 5f * k, y - 5f * k)
            path.lineTo(x + 5f * k, y + 5f * k)
            path.lineTo(x, y + 10f * k)
            path.lineTo(x, y - 10f * k)
            path.lineTo(x + 5f * k, y - 5f * k)
            path.lineTo(x - 5f * k, y + 5f * k)
            c.drawPath(path, stroke)
           }

           private fun drawPin(c: Canvas, s: UiState, cx: Float) {
            val x = cx + panelW / 2f - 24f * u
            val y = collapsedH + 10f * u
            val col = if (s.pinned) C_ORANGE else Color.argb(120, 255, 255, 255)
            stroke.color = col
            stroke.strokeWidth = 1.5f * u
            fill.color = col
            if (s.pinned) {
             c.drawCircle(x, y - 1.5f * u, 3.4f * u, fill)
            } else {
             c.drawCircle(x, y - 1.5f * u, 3.4f * u, stroke)
            }
            c.drawLine(x, y + 1.5f * u, x, y + 6f * u, stroke)
            addHit(Hit("pin", RectF(x - 14f * u, y - 10f * u, x + 14f * u, y + 8f * u)))
           }

           private fun drawLeft(c: Canvas, m: Mini, x: Float, cy: Float) {
            when (m.type) {
             Mini.ART -> art(c, m.bmp, m.color, x - 8f * u, cy - 8f * u, x + 8f * u, cy + 8f * u, 4f * u)
             Mini.BOLT -> {
              path.reset()
              path.moveTo(x + 2.5f * u, cy - 8f * u)
              path.lineTo(x - 6.5f * u, cy + 1f * u)
              path.lineTo(x - 1.5f * u, cy + 1f * u)
              path.lineTo(x - 3.5f * u, cy + 8f * u)
              path.lineTo(x + 6.5f * u, cy - 2f * u)
              path.lineTo(x + 1.5f * u, cy - 2f * u)
              path.close()
              fill.color = m.color
              c.drawPath(path, fill)
             }
             Mini.BT -> drawBt(c, x, cy, u, m.color, 1.5f * u)
             Mini.ALARM -> {
              stroke.color = m.color
              stroke.strokeWidth = 1.6f * u
              c.drawCircle(x, cy, 6.5f * u, stroke)
              path.reset()
              path.moveTo(x, cy - 3.5f * u)
              path.lineTo(x, cy)
              path.lineTo(x + 3f * u, cy)
              c.drawPath(path, stroke)
             }
             Mini.RING -> {
              stroke.color = Color.argb(70, Color.red(m.color), Color.green(m.color), Color.blue(m.color))
              stroke.strokeWidth = 2f * u
              c.drawCircle(x, cy, 6.5f * u, stroke)
              stroke.color = m.color
              rect.set(x - 6.5f * u, cy - 6.5f * u, x + 6.5f * u, cy + 6.5f * u)
              val sweep = if (m.frac >= 0f) 360f * max(0.02f, min(1f, m.frac)) else 250f
              c.drawArc(rect, -90f, sweep, false, stroke)
             }
             Mini.BATT -> {
              stroke.color = Color.WHITE
              stroke.strokeWidth = 1.4f * u
              rect.set(x - 9f * u, cy - 5f * u, x + 8f * u, cy + 5f * u)
              c.drawRoundRect(rect, 2.5f * u, 2.5f * u, stroke)
              fill.color = Color.WHITE
              rect.set(x + 9f * u, cy - 2f * u, x + 10.6f * u, cy + 2f * u)
              c.drawRect(rect, fill)
              fill.color = m.color
              rect.set(x - 7.2f * u, cy - 3.2f * u, x - 2f * u, cy + 3.2f * u)
              c.drawRoundRect(rect, 1f * u, 1f * u, fill)
             }
             Mini.BELL -> {
              stroke.color = m.color
              stroke.strokeWidth = 1.6f * u
              path.reset()
              path.moveTo(x - 5.5f * u, cy + 3.5f * u)
              path.lineTo(x + 5.5f * u, cy + 3.5f * u)
              path.moveTo(x - 4.2f * u, cy + 3.5f * u)
              path.cubicTo(x - 4.2f * u, cy - 1f * u, x - 3.5f * u, cy - 6f * u, x, cy - 6f * u)
              path.cubicTo(x + 3.5f * u, cy - 6f * u, x + 4.2f * u, cy - 1f * u, x + 4.2f * u, cy + 3.5f * u)
              c.drawPath(path, stroke)
              c.drawLine(x - 1.6f * u, cy + 6.5f * u, x + 1.6f * u, cy + 6.5f * u, stroke)
              if (m.text == "x") c.drawLine(x - 7f * u, cy - 7f * u, x + 7f * u, cy + 7f * u, stroke)
             }
             else -> text(c, m.text, x - 7f * u, cy + 4f * u, 11.5f, m.color, true)
            }
           }

           private fun drawRight(c: Canvas, m: Mini, xr: Float, cy: Float, maxW: Float) {
            when (m.type) {
             Mini.BARS -> {
              val t = System.currentTimeMillis() / 1000f
              for (i in 0..2) {
               val hh = (0.35f + 0.65f * abs(sin(t * 4.2f + i * 1.7f))) * 12f * u
               val bx = xr - 15f * u + i * 6f * u
               fill.color = C_TEAL
               rect.set(bx, cy - hh / 2f, bx + 3f * u, cy + hh / 2f)
               c.drawRoundRect(rect, 1.5f * u, 1.5f * u, fill)
              }
             }
             Mini.TEXT -> text(c, m.text, xr, cy + 4.2f * u, 11.5f, m.color, true, Paint.Align.RIGHT, maxW, true)
             else -> drawLeft(c, m, xr - 7f * u, cy)
            }
           }

           private fun drawPill(c: Canvas, s: UiState, cx: Float) {
            val w = tgt[0]
            val nl = cx - w / 2f
            val nr = cx + w / 2f
            val cy = collapsedH / 2f
            val l = s.left
            val r = s.right
            if (l != null) drawLeft(c, l, nl + 14f * u, cy)
            val zone = (nr - 11f * u) - (cx + cameraW / 2f + 3f * u)
            if (r != null) drawRight(c, r, nr - 11f * u, cy, max(zone, 26f * u))
            if (s.dots > 1) {
             for (i in 0 until s.dots) {
              fill.color = Color.WHITE
              fill.alpha = if (i == s.dotIdx) 255 else 90
              c.drawCircle(cx + (i - (s.dots - 1) / 2f) * 10f * u, collapsedH + 9f * u, 2.6f * u, fill)
             }
             fill.alpha = 255
            }
           }

           private fun drawNotif(c: Canvas, s: UiState, cx: Float) {
