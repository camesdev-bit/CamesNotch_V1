          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class LauncherActivity : Activity() {

           private class AppItem(
            val label: String,
            val comp: ComponentName,
            val icon: Bitmap?,
            val action: String?
           )

           private val letters = "#ABCDEFGHIJKLMNOPQRSTUVWXYZ"
           private val handler = Handler(Looper.getMainLooper())
           private var density = 1f
           private var all: List<AppItem> = ArrayList()
           private var shown: List<AppItem> = ArrayList()
           private var loadedMode = -1
           private var loading = false
           private lateinit var col: LinearLayout
           private lateinit var grid: GridView
           private lateinit var search: EditText
           private lateinit var clock: TextView
           private lateinit var dateTv: TextView
           private lateinit var dockBox: LinearLayout
           private val adapter = AppAdapter()
           private val clockFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
           private val dateFmt = SimpleDateFormat("EEEE, d MMMM", Locale("id", "ID"))

           private val pkgReceiver = object : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
             load()
            }
           }

           private val tick = object : Runnable {
            override fun run() {
             val now = Date()
             clock.text = clockFmt.format(now)
             dateTv.text = dateFmt.format(now)
             handler.postDelayed(this, 10000L)
            }
           }

           private fun dp(x: Int): Int = (x * density).toInt()

           override fun onCreate(b: Bundle?) {
            super.onCreate(b)
            density = resources.displayMetrics.density
            window.statusBarColor = Color.TRANSPARENT
            window.navigationBarColor = Color.TRANSPARENT
            window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_LAYOUT_STABLE or
              View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
              View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
            buildUi()
            val f = IntentFilter()
            f.addAction(Intent.ACTION_PACKAGE_ADDED)
            f.addAction(Intent.ACTION_PACKAGE_REMOVED)
            f.addAction(Intent.ACTION_PACKAGE_CHANGED)
            f.addDataScheme("package")
            registerReceiver(pkgReceiver, f)
            load()
           }

           override fun onResume() {
            super.onResume()
            handler.removeCallbacks(tick)
            handler.post(tick)
            if (loadedMode != Prefs.iconMode(this)) load()
            if (search.text.isNotEmpty()) search.setText("")
            grid.setSelection(0)
           }

           override fun onPause() {
            super.onPause()
            handler.removeCallbacks(tick)
           }

           override fun onDestroy() {
            super.onDestroy()
            try {
             unregisterReceiver(pkgReceiver)
            } catch (e: Exception) {
            }
           }

           override fun onBackPressed() {
            if (search.text.isNotEmpty()) search.setText("")
           }

           private fun buildUi() {
            val root = FrameLayout(this)
            root.background = GradientDrawable(
             GradientDrawable.Orientation.TOP_BOTTOM,
             intArrayOf(Color.argb(110, 0, 0, 0), Color.argb(40, 0, 0, 0), Color.argb(150, 0, 0, 0))
            )

            col = LinearLayout(this)
            col.orientation = LinearLayout.VERTICAL
            col.setPadding(dp(14), dp(34), dp(14), dp(16))

            clock = TextView(this)
            clock.textSize = 54f
            clock.setTextColor(Color.WHITE)
            clock.typeface = Typeface.create("sans-serif-light", Typeface.NORMAL)
            clock.setShadowLayer(8f, 0f, 2f, Color.argb(90, 0, 0, 0))
            dateTv = TextView(this)
            dateTv.textSize = 15f
            dateTv.setTextColor(Color.argb(225, 255, 255, 255))
            dateTv.setPadding(dp(4), 0, 0, dp(10))
            clock.setPadding(dp(2), 0, 0, 0)
            col.addView(clock)
            col.addView(dateTv)

            search = EditText(this)
            search.hint = "Cari aplikasi"
            search.setHintTextColor(Color.argb(170, 255, 255, 255))
            search.setTextColor(Color.WHITE)
            search.textSize = 15f
            search.setSingleLine(true)
            search.setPadding(dp(18), 0, dp(18), 0)
            val sbg = GradientDrawable()
            sbg.cornerRadius = dp(22).toFloat()
            sbg.setColor(Color.argb(55, 255, 255, 255))
            sbg.setStroke(dp(1), Color.argb(80, 255, 255, 255))
            search.background = sbg
            search.addTextChangedListener(object : TextWatcher {
             override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {
             }

             override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {
             }

             override fun afterTextChanged(s: Editable?) {
              applyFilter()
             }
            })
            col.addView(search, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(44)))

            grid = GridView(this)
            grid.numColumns = 4
            grid.stretchMode = GridView.STRETCH_COLUMN_WIDTH
            grid.verticalSpacing = dp(14)
            grid.isVerticalScrollBarEnabled = false
            grid.overScrollMode = View.OVER_SCROLL_NEVER
            grid.setSelector(ColorDrawable(Color.TRANSPARENT))
            grid.setPadding(0, dp(14), dp(14), dp(10))
            grid.clipToPadding = false
            grid.adapter = adapter
            grid.setOnItemClickListener { _, _, pos, _ ->
             if (pos >= 0 && pos < shown.size) launch(shown[pos])
            }
            grid.setOnItemLongClickListener { _, _, pos, _ ->
             if (pos >= 0 && pos < shown.size) options(shown[pos])
             true
            }

            val gridBox = FrameLayout(this)
            gridBox.addView(grid, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
            val index = LinearLayout(this)
            index.orientation = LinearLayout.VERTICAL
            index.gravity = Gravity.CENTER
            for (ch in letters) {
             val t = TextView(this)
             t.text = ch.toString()
             t.textSize = 9f
             t.gravity = Gravity.CENTER
             t.setTextColor(Color.argb(210, 255, 255, 255))
             index.addView(t, LinearLayout.LayoutParams(dp(14), 0, 1f))
            }
            index.setOnTouchListener { v, ev ->
             if (ev.action == MotionEvent.ACTION_DOWN || ev.action == MotionEvent.ACTION_MOVE) {
              val h = if (v.height > 0) v.height else 1
              var k = (ev.y / h * letters.length).toInt()
              if (k < 0) k = 0
              if (k >= letters.length) k = letters.length - 1
              jumpTo(letters[k])
             }
             true
            }
            val ilp = FrameLayout.LayoutParams(dp(16), ViewGroup.LayoutParams.MATCH_PARENT)
            ilp.gravity = Gravity.END
            ilp.topMargin = dp(18)
            ilp.bottomMargin = dp(12)
            gridBox.addView(index, ilp)
            col.addView(gridBox, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

            dockBox = LinearLayout(this)
            dockBox.orientation = LinearLayout.HORIZONTAL
            dockBox.gravity = Gravity.CENTER
            dockBox.setPadding(dp(10), dp(8), dp(10), dp(8))
            val dbg = GradientDrawable()
            dbg.cornerRadius = dp(32).toFloat()
            dbg.setColor(Color.argb(60, 255, 255, 255))
            dbg.setStroke(dp(1), Color.argb(90, 255, 255, 255))
            dockBox.background = dbg
            val dlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
            dlp.topMargin = dp(6)
            col.addView(dockBox, dlp)

            root.addView(col, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT))
            root.setOnApplyWindowInsetsListener { _, ins ->
             col.setPadding(
              dp(14), ins.systemWindowInsetTop + dp(10),
              dp(14), ins.systemWindowInsetBottom + dp(14)
             )
             ins
            }
            setContentView(root)
           }

           private fun keyOf(label: String): Char {
            val ch = label.trim().firstOrNull()?.uppercaseChar()
            return if (ch != null && ch >= 'A' && ch <= 'Z') ch else '#'
           }

           private fun jumpTo(letter: Char) {
            var pos = -1
            for (i in shown.indices) {
             val k = keyOf(shown[i].label)
             if (k == letter) {
              pos = i
              break
             }
             if (pos < 0 && k > letter && letter != '#') {
              pos = i
              break
             }
            }
            if (pos >= 0) grid.setSelection(pos)
           }

           private fun applyFilter() {
            val q = search.text.toString().trim().lowercase(Locale.getDefault())
            val out = ArrayList<AppItem>()
            for (a in all) {
             if (q.isEmpty() || a.label.lowercase(Locale.getDefault()).contains(q)) out.add(a)
            }
            shown = out
            adapter.notifyDataSetChanged()
           }

           private fun load() {
            if (loading) return
            loading = true
            val mode = Prefs.iconMode(this)
            val size = dp(64)
            Thread {
             val pm = packageManager
             val list = ArrayList<AppItem>()
             val dock = ArrayList<AppItem>()
             try {
              val q = Intent(Intent.ACTION_MAIN)
              q.addCategory(Intent.CATEGORY_LAUNCHER)
              for (ri in pm.queryIntentActivities(q, 0)) {
               val ai = ri.activityInfo ?: continue
               var bmp: Bitmap? = null
               try {
                bmp = GlassIcons.render(ri.loadIcon(pm), mode, size)
               } catch (e: Exception) {
               }
               list.add(AppItem(ri.loadLabel(pm).toString(), ComponentName(ai.packageName, ai.name), bmp, null))
              }
              list.sortBy { it.label.lowercase(Locale.getDefault()) }

              val specs = ArrayList<Intent>()
              specs.add(Intent(Intent.ACTION_DIAL))
              specs.add(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_MESSAGING))
              specs.add(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_APP_BROWSER))
              specs.add(Intent(MediaStore.ACTION_IMAGE_CAPTURE))
              for (si in specs) {
               val r = pm.queryIntentActivities(si, 0).firstOrNull() ?: continue
               val ai = r.activityInfo ?: continue
               var bmp: Bitmap? = null
               try {
                bmp = GlassIcons.render(r.loadIcon(pm), mode, size)
               } catch (e: Exception) {
               }
               dock.add(AppItem(r.loadLabel(pm).toString(), ComponentName(ai.packageName, ai.name), bmp, si.action))
              }
             } catch (e: Exception) {
             }
             runOnUiThread {
              all = list
              loadedMode = mode
              loading = false
              applyFilter()
              fillDock(dock)
             }
            }.start()
           }

           private fun fillDock(items: List<AppItem>) {
            dockBox.removeAllViews()
            for (a in items) {
             val iv = ImageView(this)
             iv.setImageBitmap(a.icon)
             iv.setOnClickListener { launch(a) }
             dockBox.addView(iv, LinearLayout.LayoutParams(0, dp(60), 1f))
            }
           }

           private fun launch(a: AppItem) {
            try {
             val i = Intent(a.action ?: Intent.ACTION_MAIN)
             if (a.action == null) i.addCategory(Intent.CATEGORY_LAUNCHER)
             i.component = a.comp
             i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED)
             startActivity(i)
            } catch (e: Exception) {
             Toast.makeText(this, "Tidak bisa membuka aplikasi ini.", Toast.LENGTH_SHORT).show()
            }
           }

           private fun options(a: AppItem) {
            val names = arrayOf("Info aplikasi", "Copot pemasangan")
            AlertDialog.Builder(this).setTitle(a.label).setItems(names) { _, which ->
             try {
              val uri = Uri.parse("package:" + a.comp.packageName)
              if (which == 0) {
               startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, uri))
              } else {
               startActivity(Intent(Intent.ACTION_DELETE, uri))
              }
             } catch (e: Exception) {
             }
            }.show()
           }

           private inner class AppAdapter : BaseAdapter() {

            override fun getCount(): Int = shown.size

            override fun getItem(position: Int): Any = shown[position]

            override fun getItemId(position: Int): Long = position.toLong()

            override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
             val cell: LinearLayout
             val iv: ImageView
             val tv: TextView
             if (convertView is LinearLayout) {
              cell = convertView
              iv = cell.getChildAt(0) as ImageView
              tv = cell.getChildAt(1) as TextView
             } else {
              cell = LinearLayout(this@LauncherActivity)
              cell.orientation = LinearLayout.VERTICAL
              cell.gravity = Gravity.CENTER_HORIZONTAL
              iv = ImageView(this@LauncherActivity)
              cell.addView(iv, LinearLayout.LayoutParams(dp(64), dp(64)))
              tv = TextView(this@LauncherActivity)
              tv.textSize = 11.5f
              tv.setTextColor(Color.WHITE)
              tv.maxLines = 1
              tv.ellipsize = android.text.TextUtils.TruncateAt.END
              tv.gravity = Gravity.CENTER
              tv.setShadowLayer(4f, 0f, 1f, Color.argb(140, 0, 0, 0))
              val tlp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
              tlp.topMargin = dp(2)
              cell.addView(tv, tlp)
             }
             val a = shown[position]
             iv.setImageBitmap(a.icon)
             tv.text = a.label
             return cell
            }
           }
          }
