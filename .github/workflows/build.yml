            c.drawRoundRect(rect, 14f * u, 14f * u, fill)
            text(c, swLabel, tl + 70f * u, top + 108f * u, 12f, Color.WHITE, true, Paint.Align.CENTER, 128f * u, true)
            addHit(Hit("sw", RectF(tl, top + 90f * u, tl + 140f * u, top + 118f * u)))
            fill.color = Color.argb(70, 255, 69, 58)
            rect.set(tl + 148f * u, top + 90f * u, tl + 288f * u, top + 118f * u)
            c.drawRoundRect(rect, 14f * u, 14f * u, fill)
            text(c, "Batalkan", tl + 218f * u, top + 108f * u, 12f, C_RED_TEXT, true, Paint.Align.CENTER)
            addHit(Hit("tcancel", RectF(tl + 148f * u, top + 90f * u, tl + 288f * u, top + 118f * u)))
           }

           private fun drawText(c: Canvas, s: UiState, cx: Float) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            val xr = x0 + panelW - 20f * u

            val pcx = xr - 12f * u
            val pcy = top + 33f * u
            fill.color = Color.WHITE
            c.drawCircle(pcx, pcy, 12f * u, fill)
            fill.color = Color.BLACK
            if (s.playing) {
             rect.set(pcx - 4.5f * u, pcy - 5.5f * u, pcx - 1.5f * u, pcy + 5.5f * u)
             c.drawRoundRect(rect, 1f * u, 1f * u, fill)
             rect.set(pcx + 1.5f * u, pcy - 5.5f * u, pcx + 4.5f * u, pcy + 5.5f * u)
             c.drawRoundRect(rect, 1f * u, 1f * u, fill)
            } else {
             path.reset()
             path.moveTo(pcx - 3.5f * u, pcy - 6f * u)
             path.lineTo(pcx - 3.5f * u, pcy + 6f * u)
             path.lineTo(pcx + 6f * u, pcy)
             path.close()
             c.drawPath(path, fill)
            }
            addHit(Hit("tx_play", RectF(pcx - 16f * u, pcy - 16f * u, pcx + 16f * u, pcy + 16f * u)))

            val sr = xr - 32f * u
            val sl = sr - 46f * u
            fill.color = C_FILL
            rect.set(sl, top + 22f * u, sr, top + 44f * u)
            c.drawRoundRect(rect, 11f * u, 11f * u, fill)
            val sp = (s.speed * 100f).roundToInt() / 100f
            text(c, sp.toString() + "x", (sl + sr) / 2f, top + 37f * u, 10.5f, Color.WHITE, true, Paint.Align.CENTER)
            addHit(Hit("tx_speed", RectF(sl - 4f * u, top + 18f * u, sr + 4f * u, top + 48f * u)))

            val fr = sl - 8f * u
            val fl = fr - 40f * u
            fill.color = C_FILL
            rect.set(fl, top + 22f * u, fr, top + 44f * u)
            c.drawRoundRect(rect, 11f * u, 11f * u, fill)
            text(c, "Aa", (fl + fr) / 2f, top + 37f * u, 11f, Color.WHITE, true, Paint.Align.CENTER)
            addHit(Hit("tx_font", RectF(fl - 4f * u, top + 18f * u, fr + 4f * u, top + 48f * u)))

            val head = if (s.sub.isNotEmpty()) s.title + "  " + s.sub else s.title
            text(c, head, x0 + 20f * u, top + 37f * u, 12.5f, C_GRAY, true, Paint.Align.LEFT, fl - (x0 + 20f * u) - 10f * u)
            addHit(Hit("tx_next", RectF(x0 + 12f * u, top + 18f * u, fl - 4f * u, top + 48f * u)))

            val tl = x0 + 20f * u
            val tw = panelW - 40f * u
            val ctop = top + 52f * u
            val cbottom = ctop + TEXT_VP * u
            textClip.set(tl, ctop, tl + tw, cbottom)
            ensureTextLayout(s)
            val lay = tLayout
            if (lay != null) {
             val sv = c.save()
             c.clipRect(tl, ctop, tl + tw, cbottom)
             c.translate(tl, ctop + 6f * u - tScroll)
             lay.draw(c)
             c.restoreToCount(sv)
            }
            fill.color = Color.BLACK
            for (i in 0..5) {
             fill.alpha = (255 * (6 - i) / 6)
             rect.set(tl, ctop + i * 2.6f * u, tl + tw, ctop + (i + 1) * 2.6f * u)
             c.drawRect(rect, fill)
             rect.set(tl, cbottom - (i + 1) * 2.6f * u, tl + tw, cbottom - i * 2.6f * u)
             c.drawRect(rect, fill)
            }
            fill.alpha = 255
            val tm = textMax()
            if (tm > 0f) {
             fill.color = C_ORANGE
             val pr = max(0f, min(1f, tScroll / tm))
             rect.set(tl, cbottom + 4f * u, tl + tw * pr, cbottom + 6f * u)
             c.drawRoundRect(rect, 1f * u, 1f * u, fill)
            }
           }

           private fun hitAt(x: Float, y: Float): Hit? {
            for (i in hits.indices.reversed()) {
             val h = hits[i]
             if (h.scroll && !listClip.contains(x, y)) continue
             if (h.r.contains(x, y)) return h
            }
            return null
           }

           private fun isSlider(h: Hit?): Boolean = h != null && h.tw > 0f

           private fun slider(x: Float, last: Boolean) {
            val h = downHit ?: return
            if (h.tw <= 0f) return
            val f = max(0f, min(1f, (x - h.tl) / h.tw))
            if (h.id == "vol" || h.id == "bright") {
             host.onAction(h.id, f)
            } else if (last) {
             host.onAction("seek", f)
            }
           }

           private fun press(on: Boolean) {
            val s = state ?: return
            if (s.kind != Kind.IDLE && s.kind != Kind.PILL) return
            tgt[2] = if (on) 1f else 0f
            startLoop()
           }

           private val longRun = Runnable {
            longFired = true
            press(false)
            if (haptics) performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
            host.onLongPress(downX < width / 2f)
           }

           override fun onTouchEvent(e: MotionEvent): Boolean = handleTouch(e)

           fun handleTouch(e: MotionEvent): Boolean {
            when (e.actionMasked) {
             MotionEvent.ACTION_DOWN -> {
              parent?.requestDisallowInterceptTouchEvent(true)
              host.onActive()
              downX = e.x
              downY = e.y
              moved = false
              longFired = false
              scrolling = false
              touching = true
              flingV = 0f
              startScroll = if (state?.kind == Kind.PANEL_TEXT) tScroll else scrollY
              inList = listClip.contains(e.x, e.y) && maxScroll() > 0f
              inText = textClip.contains(e.x, e.y)
              downHit = hitAt(e.x, e.y)
              tracker?.recycle()
              tracker = VelocityTracker.obtain()
              tracker?.addMovement(e)
              val s = state
              if (s != null && (s.kind == Kind.IDLE || s.kind == Kind.PILL)) {
               press(true)
               postDelayed(longRun, 450L)
              }
              if (isSlider(downHit)) slider(e.x, false)
             }
             MotionEvent.ACTION_MOVE -> {
              tracker?.addMovement(e)
              val dy = e.y - downY
              if (abs(e.x - downX) > slop || abs(dy) > slop) {
               moved = true
               removeCallbacks(longRun)
               press(false)
              }
              if (inList && abs(dy) > slop) {
               scrolling = true
               host.onActive()
               val ms = maxScroll()
               scrollY = max(0f, min(ms, startScroll - dy))
               invalidate()
              }
              if (inText && abs(dy) > slop) {
               scrolling = true
               host.onActive()
               tScroll = max(0f, min(textMax(), startScroll - dy))
               invalidate()
              }
              if (isSlider(downHit)) slider(e.x, false)
             }
             MotionEvent.ACTION_UP -> {
              touching = false
              removeCallbacks(longRun)
              press(false)
              tracker?.addMovement(e)
              if (scrolling) {
               if (inList) {
                tracker?.computeCurrentVelocity(1000)
                flingV = -(tracker?.yVelocity ?: 0f)
               }
               startLoop()
              } else if (!longFired) {
               val dx = e.x - downX
               val dy = e.y - downY
               val hit = downHit
               val s = state
               val collapsed = s != null && (s.kind == Kind.IDLE || s.kind == Kind.PILL)
               if (hit != null && isSlider(hit)) {
                slider(e.x, true)
               } else if (dy < -28f * u && abs(dy) > abs(dx) && !inList && !inText) {
                host.onClose()
               } else if (dy > 28f * u && abs(dy) > abs(dx) && collapsed) {
                host.onSwipeDown()
               } else if (abs(dx) > 28f * u && abs(dx) > abs(dy)) {
                host.onSwipe(if (dx < 0f) 1 else -1)
               } else if (!moved) {
                if (hit != null) host.onAction(hit.id, 0f) else host.onTapEmpty()
               }
              }
              tracker?.recycle()
              tracker = null
             }
             MotionEvent.ACTION_CANCEL -> {
              touching = false
              removeCallbacks(longRun)
              press(false)
              tracker?.recycle()
              tracker = null
             }
             else -> {
             }
            }
            return true
           }
          }
