             val l = tl + i * 59f * u
             fill.color = C_FILL
             rect.set(l, top + 44f * u, l + 52f * u, top + 78f * u)
             c.drawRoundRect(rect, 17f * u, 17f * u, fill)
             text(c, labels[i], l + 26f * u, top + 65f * u, 11f, Color.WHITE, true, Paint.Align.CENTER)
             addHit(Hit("t:" + secs[i], RectF(l, top + 44f * u, l + 52f * u, top + 78f * u)))
            }
