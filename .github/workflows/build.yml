name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Buat semua file proyek
        shell: bash
        run: |
          mkdir -p app app/src/main app/src/main/java/com/kamera/app app/src/main/res/drawable app/src/main/res/layout app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kamera.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.kamera.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("androidx.camera:camera-video:1.3.4")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_camera"
                  android:label="Kamera"
                  android:theme="@style/Theme.Kamera">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kamera/app/GridOverlay.kt <<'EOF'
          package com.kamera.app

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.util.AttributeSet
          import android.view.View

          class GridOverlay(context: Context, attrs: AttributeSet?) : View(context, attrs) {
              private val paint = Paint().apply { color = 0x99FFFFFF.toInt(); strokeWidth = 2f }

              override fun onDraw(canvas: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  for (i in 1..2) {
                      canvas.drawLine(w * i / 3, 0f, w * i / 3, h, paint)
                      canvas.drawLine(0f, h * i / 3, w, h * i / 3, paint)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/kamera/app/MainActivity.kt <<'EOF'
          package com.kamera.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.res.ColorStateList
          import android.net.Uri
          import android.net.wifi.WifiNetworkSuggestion
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.provider.Settings
          import android.util.Size
          import android.view.MotionEvent
          import android.view.View
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.AspectRatio
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.ImageProxy
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.FallbackStrategy
          import androidx.camera.video.MediaStoreOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import com.google.mlkit.vision.barcode.BarcodeScanning
          import com.google.mlkit.vision.barcode.common.Barcode
          import com.google.mlkit.vision.common.InputImage
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          class MainActivity : AppCompatActivity() {

              private val previewView by lazy { findViewById<PreviewView>(R.id.preview) }
              private val handler = Handler(Looper.getMainLooper())
              private val analysisExecutor = Executors.newSingleThreadExecutor()
              private val barcodeScanner = BarcodeScanning.getClient()

              private var cameraProvider: ProcessCameraProvider? = null
              private var camera: Camera? = null
              private var imageCapture: ImageCapture? = null
              private var videoCapture: VideoCapture<Recorder>? = null
              private var recording: Recording? = null

              private var lens = CameraSelector.LENS_FACING_BACK
              private var videoMode = false
              private var flashOn = false
              private var timerSec = 0
              private var ratio = AspectRatio.RATIO_4_3
              private var quality: Quality = Quality.FHD
              private var zoom2 = false
              private var lastUri: Uri? = null
              private var lastIsVideo = false

              private var lastQr = ""
              private var lastQrTime = 0L
              private val hideQrTask = Runnable { findViewById<View>(R.id.qrCard).visibility = View.GONE }

              private val permLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { _ ->
                  if (granted(Manifest.permission.CAMERA)) startCamera()
                  else toast("Izin kamera diperlukan agar aplikasi bisa berjalan")
              }

              private val wifiLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { _ -> toast("Permintaan WiFi sudah diproses sistem") }

              private fun granted(p: String): Boolean =
                  ContextCompat.checkSelfPermission(this, p) == PackageManager.PERMISSION_GRANTED

              private fun toast(t: String) {
                  Toast.makeText(this, t, Toast.LENGTH_LONG).show()
              }

              private fun tv(id: Int): TextView = findViewById(id)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  wireUi()
                  refreshUi()

                  val need = mutableListOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT <= 28) need.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  val allGranted = need.all { granted(it) }
                  if (allGranted) startCamera() else permLauncher.launch(need.toTypedArray())
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun wireUi() {
                  tv(R.id.btnFlash).setOnClickListener { flashOn = !flashOn; applyFlash(); refreshUi() }
                  tv(R.id.btnTimer).setOnClickListener {
                      timerSec = when (timerSec) { 0 -> 3; 3 -> 5; 5 -> 10; else -> 0 }
                      refreshUi()
                  }
                  tv(R.id.btnRatio).setOnClickListener {
                      if (recording != null) return@setOnClickListener
                      ratio = if (ratio == AspectRatio.RATIO_4_3) AspectRatio.RATIO_16_9 else AspectRatio.RATIO_4_3
                      refreshUi(); bindUseCases()
                  }
                  tv(R.id.btnRes).setOnClickListener {
                      if (recording != null) return@setOnClickListener
                      quality = if (quality == Quality.FHD) Quality.HD else Quality.FHD
                      refreshUi(); bindUseCases()
                  }
                  tv(R.id.btnGrid).setOnClickListener {
                      val g = findViewById<View>(R.id.grid)
                      g.visibility = if (g.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  }
                  tv(R.id.btnZoom).setOnClickListener { zoom2 = !zoom2; applyZoom(); refreshUi() }
                  tv(R.id.tabPhoto).setOnClickListener { setVideoMode(false) }
                  tv(R.id.tabVideo).setOnClickListener { setVideoMode(true) }
                  tv(R.id.flip).setOnClickListener {
                      if (recording != null) return@setOnClickListener
                      lens = if (lens == CameraSelector.LENS_FACING_BACK) CameraSelector.LENS_FACING_FRONT
                      else CameraSelector.LENS_FACING_BACK
                      bindUseCases()
                  }
                  findViewById<View>(R.id.shutter).setOnClickListener { onShutter() }
                  findViewById<ImageView>(R.id.thumb).setOnClickListener { openLast() }
                  tv(R.id.qrNo).setOnClickListener { dismissQr() }

                  previewView.setOnTouchListener { v, e ->
                      if (e.action == MotionEvent.ACTION_UP) {
                          val point = previewView.meteringPointFactory.createPoint(e.x, e.y)
                          val action = FocusMeteringAction.Builder(point)
                              .setAutoCancelDuration(3, TimeUnit.SECONDS).build()
                          camera?.cameraControl?.startFocusAndMetering(action)
                          v.performClick()
                      }
                      true
                  }
              }

              private fun refreshUi() {
                  val yellow = 0xFFF5D742.toInt()
                  val white = 0xFFFFFFFF.toInt()
                  val grey = 0xFFDDDDDD.toInt()
                  val red = 0xFFE53935.toInt()
                  tv(R.id.btnFlash).text = if (flashOn) "Kilat: Hidup" else "Kilat: Mati"
                  tv(R.id.btnFlash).setTextColor(if (flashOn) yellow else white)
                  tv(R.id.btnTimer).text = if (timerSec == 0) "Timer: Mati" else "Timer: $timerSec dtk"
                  tv(R.id.btnRatio).text = if (ratio == AspectRatio.RATIO_4_3) "4:3" else "16:9"
                  tv(R.id.btnRes).text = if (quality == Quality.FHD) "1080p" else "720p"
                  tv(R.id.btnRes).visibility = if (videoMode) View.VISIBLE else View.GONE
                  tv(R.id.btnZoom).text = if (zoom2) "2x" else "1x"
                  tv(R.id.tabPhoto).setTextColor(if (!videoMode) yellow else grey)
                  tv(R.id.tabVideo).setTextColor(if (videoMode) yellow else grey)
                  findViewById<View>(R.id.shutterDot).backgroundTintList =
                      ColorStateList.valueOf(if (videoMode) red else white)
              }

              private fun setVideoMode(v: Boolean) {
                  if (recording != null) return
                  videoMode = v
                  refreshUi()
                  bindUseCases()
              }

              // ---------------- Kamera ----------------

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      cameraProvider = future.get()
                      bindUseCases()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun bindUseCases() {
                  val provider = cameraProvider ?: return
                  provider.unbindAll()
                  val selector = CameraSelector.Builder().requireLensFacing(lens).build()
                  val preview = Preview.Builder().setTargetAspectRatio(ratio).build()
                  preview.setSurfaceProvider(previewView.surfaceProvider)
                  try {
                      if (videoMode) {
                          val recorder = Recorder.Builder()
                              .setQualitySelector(
                                  QualitySelector.from(quality, FallbackStrategy.lowerQualityOrHigherThan(quality))
                              )
                              .build()
                          val vc = VideoCapture.withOutput(recorder)
                          videoCapture = vc
                          camera = provider.bindToLifecycle(this, selector, preview, vc)
                      } else {
                          val ic = ImageCapture.Builder()
                              .setTargetAspectRatio(ratio)
                              .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                              .build()
                          imageCapture = ic
                          val analysis = ImageAnalysis.Builder()
                              .setTargetResolution(Size(720, 1280))
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()
                          analysis.setAnalyzer(analysisExecutor) { proxy -> analyzeFrame(proxy) }
                          camera = provider.bindToLifecycle(this, selector, preview, ic, analysis)
                      }
                      applyFlash()
                      applyZoom()
                  } catch (e: Exception) {
                      toast("Gagal membuka kamera: " + e.message)
                  }
              }

              private fun applyFlash() {
                  val cam = camera ?: return
                  if (videoMode) {
                      cam.cameraControl.enableTorch(flashOn)
                  } else {
                      cam.cameraControl.enableTorch(false)
                      imageCapture?.flashMode =
                          if (flashOn) ImageCapture.FLASH_MODE_ON else ImageCapture.FLASH_MODE_OFF
                  }
              }

              private fun applyZoom() {
                  camera?.cameraControl?.setZoomRatio(if (zoom2) 2f else 1f)
              }

              // ---------------- Rana ----------------

              private fun onShutter() {
                  val rec = recording
                  if (rec != null) {
                      rec.stop()
                      return
                  }
                  if (timerSec == 0) capture() else countdown(timerSec) { capture() }
              }

              private fun capture() {
                  if (videoMode) startRecording() else takePhoto()
              }

              private fun countdown(seconds: Int, done: () -> Unit) {
                  val label = tv(R.id.count)
                  label.visibility = View.VISIBLE
                  var left = seconds
                  handler.post(object : Runnable {
                      override fun run() {
                          if (left > 0) {
                              label.text = left.toString()
                              left--
                              handler.postDelayed(this, 1000)
                          } else {
                              label.visibility = View.GONE
                              done()
                          }
                      }
                  })
              }

              private fun stamp(): String =
                  SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())

              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  ic.flashMode = if (flashOn) ImageCapture.FLASH_MODE_ON else ImageCapture.FLASH_MODE_OFF
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, "IMG_" + stamp())
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "Pictures/Kamera")
                      }
                  }
                  val options = ImageCapture.OutputFileOptions.Builder(
                      contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values
                  ).build()
                  ic.takePicture(options, ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(output: ImageCapture.OutputFileResults) {
                              lastUri = output.savedUri
                              lastIsVideo = false
                              findViewById<ImageView>(R.id.thumb).setImageURI(lastUri)
                          }

                          override fun onError(exception: ImageCaptureException) {
                              toast("Gagal menyimpan foto: " + exception.message)
                          }
                      })
              }

              @SuppressLint("MissingPermission")
              private fun startRecording() {
                  val vc = videoCapture ?: return
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, "VID_" + stamp())
                      put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      if (Build.VERSION.SDK_INT >= 29) {
                          put(MediaStore.MediaColumns.RELATIVE_PATH, "Movies/Kamera")
                      }
                  }
                  val options = MediaStoreOutputOptions.Builder(
                      contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  ).setContentValues(values).build()
                  var pending = vc.output.prepareRecording(this, options)
                  if (granted(Manifest.permission.RECORD_AUDIO)) {
                      pending = pending.withAudioEnabled()
                  }
                  val dot = findViewById<View>(R.id.shutterDot)
                  recording = pending.start(ContextCompat.getMainExecutor(this)) { event ->
                      if (event is VideoRecordEvent.Finalize) {
                          recording = null
                          dot.scaleX = 1f
                          dot.scaleY = 1f
                          if (!event.hasError()) {
                              lastUri = event.outputResults.outputUri
                              lastIsVideo = true
                              findViewById<ImageView>(R.id.thumb)
                                  .setImageResource(android.R.drawable.ic_media_play)
                          } else {
                              toast("Video gagal disimpan")
                          }
                      }
                  }
                  dot.scaleX = 0.55f
                  dot.scaleY = 0.55f
              }

              private fun openLast() {
                  val uri = lastUri
                  if (uri == null) {
                      toast("Belum ada foto atau video")
                      return
                  }
                  try {
                      val intent = Intent(Intent.ACTION_VIEW)
                          .setDataAndType(uri, if (lastIsVideo) "video/*" else "image/*")
                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      startActivity(intent)
                  } catch (e: Exception) {
                      toast("Tidak ada aplikasi galeri")
                  }
              }

              // ---------------- Scan otomatis ----------------

              @SuppressLint("UnsafeOptInUsageError")
              private fun analyzeFrame(proxy: ImageProxy) {
                  val media = proxy.image
                  if (media == null) {
                      proxy.close()
                      return
                  }
                  val input = InputImage.fromMediaImage(media, proxy.imageInfo.rotationDegrees)
                  barcodeScanner.process(input)
                      .addOnSuccessListener { list ->
                          val first = list.firstOrNull()
                          if (first != null) onBarcode(first)
                      }
                      .addOnCompleteListener { proxy.close() }
              }

              private fun onBarcode(b: Barcode) {
                  val raw = b.rawValue ?: return
                  val now = SystemClock.elapsedRealtime()
                  val same = raw == lastQr && now - lastQrTime < 4000
                  lastQrTime = now
                  if (same) return
                  lastQr = raw

                  val type = b.valueType
                  if (type == Barcode.TYPE_WIFI) {
                      val w = b.wifi ?: return
                      val pass = w.password ?: ""
                      val info = (w.ssid ?: "-") + (if (pass.isEmpty()) "\nTanpa sandi" else "\nSandi: " + pass)
                      showQr("Terhubung dengan WiFi ini?", info, "Hubungkan") { connectWifi(w) }
                  } else if (type == Barcode.TYPE_URL) {
                      val u = b.url?.url ?: raw
                      showQr("Kunjungi barcode ini?", u, "Kunjungi") { openUrl(u) }
                  } else if (raw.startsWith("http://") || raw.startsWith("https://")) {
                      showQr("Kunjungi barcode ini?", raw, "Kunjungi") { openUrl(raw) }
                  } else {
                      showQr("Teks terdeteksi", raw, "Salin") { copyText(raw); toast("Tersalin") }
                  }
              }

              private fun showQr(title: String, body: String, action: String, onGo: () -> Unit) {
                  tv(R.id.qrTitle).text = title
                  tv(R.id.qrBody).text = body
                  tv(R.id.qrGo).text = action
                  tv(R.id.qrGo).setOnClickListener { dismissQr(); onGo() }
                  findViewById<View>(R.id.qrCard).visibility = View.VISIBLE
                  handler.removeCallbacks(hideQrTask)
                  handler.postDelayed(hideQrTask, 12000)
              }

              private fun dismissQr() {
                  handler.removeCallbacks(hideQrTask)
                  findViewById<View>(R.id.qrCard).visibility = View.GONE
              }

              private fun copyText(t: String) {
                  val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("kamera", t))
              }

              private fun openUrl(u: String) {
                  val full = if (u.contains("://")) u else "https://" + u
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(full)))
                  } catch (e: Exception) {
                      toast("Tidak bisa membuka link")
                  }
              }

              private fun connectWifi(w: Barcode.WiFi) {
                  val ssid = w.ssid
                  if (ssid == null) {
                      toast("Nama WiFi kosong")
                      return
                  }
                  val pass = w.password ?: ""
                  val enc = w.encryptionType

                  if (Build.VERSION.SDK_INT >= 30 && enc != Barcode.WiFi.TYPE_WEP) {
                      try {
                          val sb = WifiNetworkSuggestion.Builder().setSsid(ssid)
                          if (enc == Barcode.WiFi.TYPE_WPA && pass.isNotEmpty()) {
                              sb.setWpa2Passphrase(pass)
                          }
                          val list = ArrayList<WifiNetworkSuggestion>()
                          list.add(sb.build())
                          val intent = Intent(Settings.ACTION_WIFI_ADD_NETWORKS)
                          intent.putParcelableArrayListExtra(Settings.EXTRA_WIFI_NETWORK_LIST, list)
                          wifiLauncher.launch(intent)
                          return
                      } catch (e: Exception) {
                          // lanjut ke cara cadangan di bawah
                      }
                  }

                  if (pass.isNotEmpty()) copyText(pass)
                  val msg = "Pilih " + ssid + " di daftar WiFi" +
                      (if (pass.isNotEmpty()) ". Sandi sudah disalin, tinggal tempel." else "")
                  toast(msg)
                  try {
                      startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                  } catch (e: Exception) {
                      toast("Tidak bisa membuka pengaturan WiFi")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  barcodeScanner.close()
                  analysisExecutor.shutdown()
              }
          }
          EOF

          cat > app/src/main/res/drawable/card_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#FFFFFF" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/dot.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#FFFFFF" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/ring.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#00000000" />
              <stroke android:width="4dp" android:color="#DDDDDD" />
          </shape>
          EOF

          cat > app/src/main/res/drawable/thumb_bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#333333" />
              <stroke android:width="1dp" android:color="#555555" />
              <corners android:radius="8dp" />
          </shape>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000"
              android:fitsSystemWindows="true">

              <androidx.camera.view.PreviewView
                  android:id="@+id/preview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  app:scaleType="fitCenter" />

              <com.kamera.app.GridOverlay
                  android:id="@+id/grid"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="48dp"
                  android:layout_gravity="top"
                  android:background="#000000"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  android:paddingHorizontal="8dp">
                  <TextView android:id="@+id/btnFlash" style="@style/TopBtn" android:text="Kilat: Mati" />
                  <TextView android:id="@+id/btnTimer" style="@style/TopBtn" android:text="Timer: Mati" />
                  <TextView android:id="@+id/btnRatio" style="@style/TopBtn" android:text="4:3" />
                  <TextView android:id="@+id/btnRes" style="@style/TopBtn" android:text="1080p" android:visibility="gone" />
                  <TextView android:id="@+id/btnGrid" style="@style/TopBtn" android:text="Kisi" />
              </LinearLayout>

              <TextView
                  android:id="@+id/count"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:textColor="#FFFFFF"
                  android:textSize="110sp"
                  android:visibility="gone" />

              <LinearLayout
                  android:id="@+id/qrCard"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:layout_marginHorizontal="14dp"
                  android:layout_marginBottom="210dp"
                  android:background="@drawable/card_bg"
                  android:elevation="8dp"
                  android:orientation="vertical"
                  android:padding="16dp"
                  android:visibility="gone">
                  <TextView android:id="@+id/qrTitle" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:textColor="#111111" android:textSize="17sp" android:textStyle="bold" />
                  <TextView android:id="@+id/qrBody" android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:layout_marginTop="4dp" android:maxLines="4" android:ellipsize="end"
                      android:textColor="#444444" android:textSize="14sp" />
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                      android:layout_marginTop="12dp" android:gravity="end" android:orientation="horizontal">
                      <TextView android:id="@+id/qrNo" style="@style/CardBtn" android:text="Tutup" android:textColor="#111111" />
                      <TextView android:id="@+id/qrGo" style="@style/CardBtn" android:textColor="#1A6CF0" />
                  </LinearLayout>
              </LinearLayout>

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#000000"
                  android:orientation="vertical"
                  android:paddingBottom="12dp">

                  <TextView
                      android:id="@+id/btnZoom"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="8dp"
                      android:paddingHorizontal="16dp"
                      android:paddingVertical="6dp"
                      android:text="1x"
                      android:textColor="#F5D742"
                      android:textStyle="bold" />

                  <LinearLayout android:layout_width="match_parent" android:layout_height="40dp"
                      android:gravity="center" android:orientation="horizontal">
                      <TextView android:id="@+id/tabPhoto" style="@style/Tab" android:text="Foto" />
                      <TextView android:id="@+id/tabVideo" style="@style/Tab" android:text="Video" />
                  </LinearLayout>

                  <RelativeLayout android:layout_width="match_parent" android:layout_height="90dp"
                      android:paddingHorizontal="28dp">
                      <ImageView
                          android:id="@+id/thumb"
                          android:layout_width="46dp"
                          android:layout_height="46dp"
                          android:layout_alignParentStart="true"
                          android:layout_centerVertical="true"
                          android:background="@drawable/thumb_bg"
                          android:scaleType="centerCrop" />
                      <FrameLayout
                          android:id="@+id/shutter"
                          android:layout_width="76dp"
                          android:layout_height="76dp"
                          android:layout_centerInParent="true"
                          android:background="@drawable/ring">
                          <View
                              android:id="@+id/shutterDot"
                              android:layout_width="58dp"
                              android:layout_height="58dp"
                              android:layout_gravity="center"
                              android:background="@drawable/dot" />
                      </FrameLayout>
                      <TextView
                          android:id="@+id/flip"
                          android:layout_width="wrap_content"
                          android:layout_height="48dp"
                          android:layout_alignParentEnd="true"
                          android:layout_centerVertical="true"
                          android:gravity="center"
                          android:text="Putar"
                          android:textColor="#FFFFFF"
                          android:textSize="15sp"
                          android:textStyle="bold" />
                  </RelativeLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Kamera" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
              <style name="TopBtn">
                  <item name="android:layout_width">0dp</item>
                  <item name="android:layout_height">match_parent</item>
                  <item name="android:layout_weight">1</item>
                  <item name="android:gravity">center</item>
                  <item name="android:textColor">#FFFFFF</item>
                  <item name="android:textSize">13sp</item>
                  <item name="android:textStyle">bold</item>
              </style>
              <style name="Tab">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:layout_height">match_parent</item>
                  <item name="android:gravity">center</item>
                  <item name="android:paddingHorizontal">20dp</item>
                  <item name="android:textColor">#DDDDDD</item>
                  <item name="android:textSize">15sp</item>
              </style>
              <style name="CardBtn">
                  <item name="android:layout_width">wrap_content</item>
                  <item name="android:layout_height">wrap_content</item>
                  <item name="android:padding">10dp</item>
                  <item name="android:textSize">15sp</item>
                  <item name="android:textStyle">bold</item>
              </style>
          </resources>
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Kamera"
          include(":app")
          EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK (action)
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Android SDK (cadangan)
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Ringkasan error
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          PAT='^e: |error:|What went wrong|Could not|AAPT|Execution failed|Unresolved|not found'
          {
            echo "### Error build (kirim screenshot ini)"
            echo '```'
            grep -nE "$PAT" -A2 build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "$PAT" build.log | head -8 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Kamera-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
