              val cut = wm?.currentWindowMetrics?.windowInsets?.displayCutout
              val r = cut?.boundingRectTop
              if (r != null && !r.isEmpty) {
               cutB = r.bottom.toFloat()
               cutW = r.width().toFloat()
              }
             } catch (e: Exception) {
             }
            }

            val extra = Prefs.extraDp(s) * dm.density
            var nw = Prefs.widthPct(s) / 100f * 360f * u
            if (cutW > 0f) nw = max(nw, cutW + 24f * u)
            var nh = if (cutB > 0f) cutB + 2f * u else 26f * u
            nh = max(nh, 22f * u) + extra
            val pw = 324f * u

            val v = NotchView(s, this)
            v.outlineOn = Prefs.outline(s)
            v.haptics = Prefs.haptic(s)
            v.jelly = Prefs.on(s, "jelly")
            v.configure(u, nw, nh, pw, cutW)
            v.warmUp(warmStates())

            val drawFlags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
            val dl = WindowManager.LayoutParams(
             v.bigW(),
             v.bigH(),
             WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
             drawFlags,
             PixelFormat.TRANSLUCENT
            )
            dl.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
            dl.x = 0
            dl.y = 0

            val idle = UiState(Kind.IDLE)
            val touchFlags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
              WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
            val tl = WindowManager.LayoutParams(
             v.touchW(idle),
             v.touchH(idle),
             WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
             touchFlags,
             PixelFormat.TRANSLUCENT
            )
            tl.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
            tl.x = 0
            tl.y = 0

            if (Build.VERSION.SDK_INT >= 28) {
             dl.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
             tl.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
            }

            val tv = TouchView(s, v)
            TopBar.show(s)
            try {
             wm?.addView(v, dl)
             wm?.addView(tv, tl)
            } catch (e: Exception) {
             try {
              wm?.removeView(v)
             } catch (e2: Exception) {
             }
             return
            }
            view = v
            lp = dl
            touch = tv
            tlp = tl
            render()
           }

           private fun removeView() {
            TopBar.hide()
            h.removeCallbacks(tickRun)
            h.removeCallbacks(collapseRun)
            h.removeCallbacks(clearTransRun)
            h.removeCallbacks(singleTapRun)
            val v = view
            if (v != null) {
             try {
              wm?.removeView(v)
             } catch (e: Exception) {
             }
            }
            val t = touch
            if (t != null) {
             try {
              wm?.removeView(t)
             } catch (e: Exception) {
             }
            }
            view = null
            touch = null
            lp = null
            tlp = null
           }

           fun onConfig() {
            rebuild()
           }

           override fun onSettled() {
           }

           private fun updateTouch(v: NotchView, st: UiState) {
            val t = touch ?: return
            val l = tlp ?: return
            val w = v.touchW(st)
            val hh = v.touchH(st)
            if (l.width != w || l.height != hh) {
             l.width = w
             l.height = hh
             try {
              wm?.updateViewLayout(t, l)
             } catch (e: Exception) {
             }
            }
           }

           private fun render() {
            val v = view ?: return
            val ctxp = a11y
            val st = buildState().withPinned(ctxp != null && Prefs.on(ctxp, "keep", false))
            v.setState(st)
            updateTouch(v, st)
            scheduleTicks()
           }

           private val tickRun = Runnable {
            checkOwnTimer()
            render()
           }

           private fun scheduleTicks() {
            h.removeCallbacks(tickRun)
            val music = exp == Exp.MUSIC && media?.playbackState?.state == PlaybackState.STATE_PLAYING
            val timer = timerRemaining() > 0L || swRunning || exp == Exp.TIMER
            if (music) {
             h.postDelayed(tickRun, 500L)
            } else if (timer) {
             h.postDelayed(tickRun, 1000L)
            }
           }

           private fun hapticTick() {
            val c = a11y ?: return
            if (Prefs.haptic(c)) view?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
           }

           private fun buildState(): UiState {
            when (exp) {
             Exp.MUSIC -> return musicPanel()
             Exp.ACTS -> return UiState(Kind.PANEL_LIST, rows = acts().map { it.row })
             Exp.NOTIFS -> return UiState(Kind.PANEL_NOTIFS, rows = notifRowsNow())
             Exp.QUICK -> return quickPanel()
             Exp.INFO -> return infoPanel()
             Exp.TIMER -> return timerPanel()
             Exp.TEXT -> return textPanel()
             else -> {
             }
            }
            val t = trans
            if (t != null) return t
            val ci = call
            if (ci != null) return UiState(Kind.PANEL_CALL, title = ci.name)
            if (alarmRinging) {
             return UiState(
              Kind.PILL,
              left = Mini(Mini.ALARM, color = ORANGE),
              right = Mini(Mini.TEXT, nowText(), color = ORANGE)
             )
            }
            val a = acts()
            if (a.isNotEmpty()) {
             val k = Math.floorMod(actIdx, a.size)
             val cur = a[k]
             return UiState(
              Kind.PILL,
              left = cur.left,
              right = cur.right,
              dots = if (a.size > 1) a.size else 0,
              dotIdx = k
             )
            }
            return UiState(Kind.IDLE)
           }

           private fun acts(): List<Act> {
            val list = ArrayList<Act>()
            val m = media
            val cx0 = a11y
            val musicOk = cx0 == null || Prefs.on(cx0, "music")
            if (musicOk && m != null && m.playbackState?.state == PlaybackState.STATE_PLAYING) {
             val md = m.metadata
             val bmp = if (md != null) art(md) else null
             val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Musik"
             val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
             list.add(
              Act(
               0,
               Mini(Mini.ART, bmp = bmp, color = CORAL),
               Mini(Mini.BARS),
               Row(title, artist, CORAL, bmp, "", "music")
              )
             )
            }
            val rem = timerRemaining()
            if (rem > 0L) {
             val t = fmtSec(rem)
             val fr = if (ownTimerEnd > System.currentTimeMillis() && ownTimerTotal > 0L) rem.toFloat() / ownTimerTotal.toFloat() else -1f
             list.add(
              Act(
               1,
               Mini(Mini.RING, color = ORANGE, frac = fr),
               Mini(Mini.TEXT, t, color = ORANGE),
               Row("Timer", "Hitung mundur", ORANGE, null, t, "timer")
              )
             )
            }
            if (swRunning) {
             val t = fmtSec(swElapsed() / 1000L)
             list.add(
              Act(
               2,
               Mini(Mini.RING, color = TEAL, frac = 1f),
               Mini(Mini.TEXT, t, color = TEAL),
               Row("Stopwatch", "Berjalan", TEAL, null, t, "sw")
              )
             )
            }
            return list
           }

           private fun art(md: MediaMetadata): Bitmap? {
            return md.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
             ?: md.getBitmap(MediaMetadata.METADATA_KEY_ART)
             ?: md.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)
           }

           private fun musicPanel(): UiState {
            val m = media
            val md = m?.metadata
            val ps = m?.playbackState
            val dur = md?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
            val playing = ps?.state == PlaybackState.STATE_PLAYING
            var pos = ps?.position ?: 0L
            if (pos < 0L) pos = 0L
            if (ps != null && playing) {
             pos += ((SystemClock.elapsedRealtime() - ps.lastPositionUpdateTime) * ps.playbackSpeed).toLong()
            }
            if (dur > 0L && pos > dur) pos = dur
            val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Musik"
            val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
            val bmp = if (md != null) art(md) else null
            return UiState(
             Kind.PANEL_MUSIC,
             title = title,
             sub = artist,
             color = CORAL,
             bmp = bmp,
             progress = if (dur > 0L) pos.toFloat() / dur.toFloat() else 0f,
             posText = fmtMs(pos),
             durText = if (dur > 0L) fmtMs(dur) else "--:--",
             playing = playing
            )
           }

           private fun quickPanel(): UiState {
            val c = a11y ?: return UiState(Kind.IDLE)
            val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
            val mx = max(1, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC))
            val vol = am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / mx.toFloat()
            var br = -1f
            try {
             if (Settings.System.canWrite(c)) {
              val v = Settings.System.getInt(c.contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128)
              br = v / 255f
             }
            } catch (e: Exception) {
            }
            return UiState(Kind.PANEL_QUICK, torch = torchOn, volume = vol, brightness = br)
           }

           private fun infoPanel(): UiState {
            val c = a11y ?: return UiState(Kind.IDLE)
            val cal = Calendar.getInstance()
            val time = String.format("%02d.%02d", cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE))
            var date = ""
            try {
             date = SimpleDateFormat("EEEE, d MMM", Locale("id", "ID")).format(cal.time)
            } catch (e: Exception) {
            }
            var bat = -1
            var chg = false
            try {
             val b = c.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
             if (b != null) {
              val lv = b.getIntExtra("level", -1)
              val sc = b.getIntExtra("scale", 100)
              if (lv >= 0) bat = lv * 100 / max(1, sc)
              val st = b.getIntExtra("status", -1)
              chg = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
             }
            } catch (e: Exception) {
            }
            var note = ""
            try {
             val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
             val nx = am.nextAlarmClock
             if (nx != null) {
              val t = Calendar.getInstance()
              t.timeInMillis = nx.triggerTime
              note = "Alarm " + String.format("%02d.%02d", t.get(Calendar.HOUR_OF_DAY), t.get(Calendar.MINUTE))
             }
            } catch (e: Exception) {
            }
            return UiState(Kind.PANEL_INFO, title = time, sub = date, battery = bat, charging = chg, note = note)
           }

           private fun timerPanel(): UiState {
            val rem = timerRemaining()
            val sw = swElapsed()
            return UiState(
             Kind.PANEL_TIMER,
             time = if (rem > 0L) fmtSec(rem) else "",
             timerOn = rem > 0L,
             playing = swRunning,
             note = if (sw > 0L) fmtSec(sw / 1000L) else ""
            )
           }

