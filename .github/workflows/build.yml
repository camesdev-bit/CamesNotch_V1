              private fun isPanel(s: UiState): Boolean = s.kind != Kind.IDLE && s.kind != Kind.PILL

              private fun panelH(s: UiState): Float = when (s.kind) {
                  Kind.PANEL_NOTIF -> 58f * u
                  Kind.PANEL_CALL -> 96f * u
                  Kind.PANEL_MUSIC -> 124f * u
                  Kind.PANEL_LIST, Kind.PANEL_NOTIFS -> (24f + 36f * max(1, s.rows.size)) * u
                  Kind.PANEL_QUICK -> 134f * u
                  else -> 0f
              }

              private fun targetsFor(s: UiState) {
                  if (isPanel(s)) {
                      tgt[0] = collapsedW
                      tgt[1] = statusH + 14f * u
                      tgt[2] = panelH(s)
                  } else {
                      tgt[0] = if (s.kind == Kind.PILL) collapsedW + 10f * u else collapsedW
                      tgt[1] = collapsedH
                      tgt[2] = 0f
                  }
              }

              fun targetW(): Int {
                  val s = state ?: return ceil(collapsedW).toInt()
                  return ceil(if (isPanel(s)) panelW else tgt[0]).toInt()
              }

              fun targetH(): Int {
                  val s = state ?: return ceil(collapsedH).toInt()
                  if (isPanel(s)) return ceil(statusH + tgt[2]).toInt()
                  val dots = if (s.dots > 1) 16f * u else 0f
                  return ceil(tgt[1] + dots).toInt()
              }

              private fun keyOf(s: UiState): Int {
                  return s.kind.ordinal * 10000 + (s.left?.type ?: 9) * 100 + (s.right?.type ?: 9) * 10 + min(s.rows.size, 9)
              }

              private fun needsAnim(s: UiState): Boolean {
                  return s.left?.type == Mini.BARS || s.right?.type == Mini.BARS || s.left?.type == Mini.ALARM
              }

              fun setState(s: UiState): Boolean {
                  val first = state == null
                  val oldW = targetW()
                  val oldH = targetH()
                  state = s
                  targetsFor(s)
                  if (first) {
                      for (i in 0..2) {
                          cur[i] = tgt[i]
                          vel[i] = 0f
                      }
                  }
                  val k = keyOf(s)
                  if (k != modeKey) {
                      modeKey = k
                      if (!first) {
                          contentAlpha = 0f
                          contentDelay = 0.12f
                      }
                  }
                  startLoop()
                  startBars()
                  invalidate()
                  return first || oldW != targetW() || oldH != targetH()
              }

              private fun startLoop() {
                  if (!running) {
                      running = true
                      lastNs = System.nanoTime()
                      postOnAnimation(tick)
                  }
              }

              private val tick = object : Runnable {
                  override fun run() {
                      val now = System.nanoTime()
                      var dt = (now - lastNs) / 1_000_000_000f
                      lastNs = now
                      if (dt > 0.033f) dt = 0.033f
                      var moving = false
                      val sub = 2
                      val step = dt / sub
                      for (i in 0..2) {
                          for (n in 0 until sub) {
                              val a = springK * (tgt[i] - cur[i]) - springC * vel[i]
                              vel[i] += a * step
                              cur[i] += vel[i] * step
                          }
                          if (abs(vel[i]) > 1f || abs(tgt[i] - cur[i]) > 0.4f) {
                              moving = true
                          } else {
                              cur[i] = tgt[i]
                              vel[i] = 0f
                          }
                      }
                      if (contentDelay > 0f) {
                          contentDelay -= dt
                          moving = true
                      } else if (contentAlpha < 1f) {
                          contentAlpha = min(1f, contentAlpha + dt / 0.22f)
                          moving = true
                      }
                      invalidate()
                      if (moving) {
                          postOnAnimation(this)
                      } else {
                          running = false
                          host.onSettled()
                      }
                  }
              }

              private val barsRun = object : Runnable {
                  override fun run() {
                      val s = state
                      if (s != null && needsAnim(s) && isAttachedToWindow) {
                          invalidate()
                          postDelayed(this, 50L)
                      } else {
                          barsRunning = false
                      }
                  }
              }

              private fun startBars() {
                  val s = state ?: return
                  if (needsAnim(s) && !barsRunning) {
                      barsRunning = true
                      postDelayed(barsRun, 50L)
                  }
              }

              override fun onDetachedFromWindow() {
                  removeCallbacks(tick)
                  removeCallbacks(barsRun)
                  removeCallbacks(longRun)
                  running = false
                  barsRunning = false
                  super.onDetachedFromWindow()
              }

              // ---------------------------------------------------------------- drawing

              override fun onDraw(c: Canvas) {
                  val s = state ?: return
                  hits.clear()
                  val cx = width / 2f
                  val nw = max(0f, cur[0])
                  val nh = max(0f, cur[1])
                  val ph = max(0f, cur[2])
                  val py = statusH

                  val outer = c.save()
                  if (s.left?.type == Mini.ALARM) {
                      val t = System.currentTimeMillis() / 1000f
                      c.translate(sin(t * 38f) * 1.4f * u, 0f)
                  }

                  fill.color = Color.BLACK
                  val nl = cx - nw / 2f
                  val nr = cx + nw / 2f
                  val r = min(nh / 2f, 14f * u)
                  rect.set(nl, -nh, nr, nh)
                  c.drawRoundRect(rect, r, r, fill)

                  if (ph > 1f) {
                      val pl = cx - panelW / 2f
                      val pr = cx + panelW / 2f
                      val rp = min(22f * u, ph / 2f)
                      rect.set(pl, py, pr, py + ph)
                      c.drawRoundRect(rect, rp, rp, fill)

                      val f = min(20f * u, ph / 2.2f)
                      if (f > 1f) {
                          path.reset()
                          path.moveTo(nl - f, py)
                          path.lineTo(nl, py)
                          path.lineTo(nl, py - f)
                          rect.set(nl - 2f * f, py - 2f * f, nl, py)
                          path.arcTo(rect, 0f, 90f)
                          path.close()
                          c.drawPath(path, fill)

                          path.reset()
                          path.moveTo(nr + f, py)
                          path.lineTo(nr, py)
                          path.lineTo(nr, py - f)
                          rect.set(nr, py - 2f * f, nr + 2f * f, py)
                          path.arcTo(rect, 180f, -90f)
                          path.close()
                          c.drawPath(path, fill)
                      }
                  }

                  if (s.kind != Kind.IDLE) {
                      val a = (255f * contentAlpha).toInt()
                      val layer = c.saveLayerAlpha(0f, 0f, width.toFloat(), height.toFloat(), max(0, min(255, a)))
                      c.translate(0f, (contentAlpha - 1f) * 8f * u)
                      drawContent(c, s, cx)
                      c.restoreToCount(layer)
                  }
                  c.restoreToCount(outer)
              }

              private fun drawContent(c: Canvas, s: UiState, cx: Float) {
                  when (s.kind) {
                      Kind.PILL -> drawPill(c, s, cx)
                      Kind.PANEL_NOTIF -> drawNotif(c, s, cx)
                      Kind.PANEL_CALL -> drawCall(c, s, cx)
                      Kind.PANEL_MUSIC -> drawMusic(c, s, cx)
                      Kind.PANEL_LIST -> drawRows(c, s, cx, "Tidak ada aktivitas")
                      Kind.PANEL_NOTIFS -> drawRows(c, s, cx, "Tidak ada notifikasi")
                      Kind.PANEL_QUICK -> drawQuick(c, s, cx)
                      else -> {
                      }
                  }
              }

              private fun text(
                  c: Canvas, s: String, x: Float, y: Float, size: Float, color: Int,
                  bold: Boolean = false, align: Paint.Align = Paint.Align.LEFT,
                  maxW: Float = 0f, shrink: Boolean = false
              ) {
                  tp.color = color
                  tp.textAlign = align
                  tp.typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                  tp.textSize = size * u
                  var str = s
                  if (maxW > 0f) {
                      val w = tp.measureText(str)
                      if (w > maxW) {
                          if (shrink) {
                              tp.textSize = max(size * u * maxW / w, 7f * u)
                          }
                          if (tp.measureText(str) > maxW) {
                              str = TextUtils.ellipsize(str, tp, maxW, TextUtils.TruncateAt.END).toString()
                          }
                      }
                  }
                  c.drawText(str, x, y, tp)
              }

              private fun drawBmp(c: Canvas, bmp: Bitmap, l: Float, t: Float, r: Float, b: Float, rad: Float) {
                  path.reset()
                  rect.set(l, t, r, b)
                  path.addRoundRect(rect, rad, rad, Path.Direction.CW)
                  val sv = c.save()
                  c.clipPath(path)
                  src.set(0, 0, bmp.width, bmp.height)
                  c.drawBitmap(bmp, src, rect, bmpPaint)
                  c.restoreToCount(sv)
              }

              private fun avatar(c: Canvas, bmp: Bitmap?, color: Int, label: String, cx: Float, cy: Float, r: Float) {
                  if (bmp != null) {
                      drawBmp(c, bmp, cx - r, cy - r, cx + r, cy + r, r)
                  } else {
                      fill.color = color
                      c.drawCircle(cx, cy, r, fill)
                      val ch = if (label.isNotEmpty()) label.substring(0, 1).uppercase() else "?"
                      text(c, ch, cx, cy + 4.5f * u, 12f, Color.WHITE, true, Paint.Align.CENTER)
                  }
              }

              private fun button(c: Canvas, label: String, color: Int, l: Float, t: Float, r: Float, b: Float, id: String) {
                  fill.color = color
                  rect.set(l, t, r, b)
                  c.drawRoundRect(rect, (b - t) / 2f, (b - t) / 2f, fill)
                  text(c, label, (l + r) / 2f, (t + b) / 2f + 4.5f * u, 12f, Color.WHITE, true, Paint.Align.CENTER)
                  hits.add(Hit(id, RectF(l, t, r, b)))
              }

              private fun drawBt(c: Canvas, x: Float, y: Float, k: Float, color: Int, w: Float) {
                  stroke.color = color
                  stroke.strokeWidth = w
                  path.reset()
                  path.moveTo(x - 5f * k, y - 5f * k)
                  path.lineTo(x + 5f * k, y + 5f * k)
                  path.lineTo(x, y + 10f * k)
                  path.lineTo(x, y - 10f * k)
                  path.lineTo(x + 5f * k, y - 5f * k)
                  path.lineTo(x - 5f * k, y + 5f * k)
                  c.drawPath(path, stroke)
              }

              private fun drawMini(c: Canvas, m: Mini, x: Float, cy: Float, maxW: Float) {
                  when (m.type) {
                      Mini.ART -> {
                          val hh = 14f * u
                          val b = m.bmp
                          if (b != null) {
                              drawBmp(c, b, x - hh / 2f, cy - hh / 2f, x + hh / 2f, cy + hh / 2f, 3.5f * u)
                          } else {
                              fill.color = m.color
                              rect.set(x - hh / 2f, cy - hh / 2f, x + hh / 2f, cy + hh / 2f)
                              c.drawRoundRect(rect, 3.5f * u, 3.5f * u, fill)
                          }
                      }
                      Mini.BARS -> {
                          val t = System.currentTimeMillis() / 1000f
                          for (i in 0..2) {
                              val hh = (0.35f + 0.65f * abs(sin(t * 4.2f + i * 1.7f))) * 12f * u
                              val bx = x + 4f * u + i * 6f * u
                              fill.color = C_TEAL
                              rect.set(bx, cy - hh / 2f, bx + 3f * u, cy + hh / 2f)
                              c.drawRoundRect(rect, 1.5f * u, 1.5f * u, fill)
                          }
                      }
                      Mini.BOLT -> {
                          path.reset()
                          path.moveTo(x + 2.5f * u, cy - 8f * u)
                          path.lineTo(x - 6.5f * u, cy + 1f * u)
                          path.lineTo(x - 1.5f * u, cy + 1f * u)
                          path.lineTo(x - 3.5f * u, cy + 8f * u)
                          path.lineTo(x + 6.5f * u, cy - 2f * u)
                          path.lineTo(x + 1.5f * u, cy - 2f * u)
                          path.close()
                          fill.color = C_TEAL
                          c.drawPath(path, fill)
                      }
                      Mini.BT -> drawBt(c, x, cy, u, C_SKY, 1.5f * u)
                      Mini.ALARM -> {
                          stroke.color = C_ORANGE
                          stroke.strokeWidth = 1.5f * u
                          c.drawCircle(x, cy, 6f * u, stroke)
                          path.reset()
                          path.moveTo(x, cy - 3.5f * u)
                          path.lineTo(x, cy)
                          path.lineTo(x + 3f * u, cy)
                          c.drawPath(path, stroke)
                      }
                      Mini.RING -> {
                          stroke.color = C_ORANGE
                          stroke.strokeWidth = 2f * u
                          c.drawCircle(x, cy, 6f * u, stroke)
                      }
                      else -> text(c, m.text, x, cy + 4f * u, 11f, m.color, true, Paint.Align.LEFT, maxW, true)
                  }
              }

              private fun drawPill(c: Canvas, s: UiState, cx: Float) {
                  val w = tgt[0]
                  val cy = tgt[1] / 2f
                  val l = s.left
                  val r = s.right
                  if (l != null) drawMini(c, l, cx - w / 2f + 15f * u, cy, 0f)
                  if (r != null) drawMini(c, r, cx + 16f * u, cy, w / 2f - 16f * u - 7f * u)
                  if (s.dots > 1) {
                      for (i in 0 until s.dots) {
                          fill.color = Color.WHITE
                          fill.alpha = if (i == s.dotIdx) 255 else 100
                          c.drawCircle(cx + (i - (s.dots - 1) / 2f) * 10f * u, tgt[1] + 8f * u, 2.5f * u, fill)
                      }
                      fill.alpha = 255
                  }
              }

              private fun drawNotif(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = statusH
                  avatar(c, s.bmp, s.color, s.title, x0 + 26f * u, top + 29f * u, 14f * u)
                  text(c, s.title, x0 + 50f * u, top + 26f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 140f * u)
                  text(c, s.sub, x0 + 50f * u, top + 43f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 70f * u)
                  text(c, s.time, x0 + panelW - 18f * u, top + 26f * u, 11f, C_GRAY, false, Paint.Align.RIGHT)
                  hits.add(Hit("notif", RectF(x0, top, x0 + panelW, top + panelH(s))))
              }

              private fun drawCall(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = statusH
                  avatar(c, null, Color.parseColor("#7F77DD"), s.title, x0 + 26f * u, top + 30f * u, 16f * u)
                  text(c, s.title, x0 + 52f * u, top + 28f * u, 14f, Color.WHITE, true, Paint.Align.LEFT, panelW - 70f * u)
                  text(c, "Panggilan masuk", x0 + 52f * u, top + 44f * u, 11f, C_GRAY)
                  button(c, "Tolak", C_RED, x0 + 16f * u, top + 62f * u, x0 + 156f * u, top + 88f * u, "decline")
                  button(c, "Angkat", C_GREEN, x0 + 168f * u, top + 62f * u, x0 + 308f * u, top + 88f * u, "answer")
              }

              private fun drawMusic(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = statusH
                  val b = s.bmp
                  if (b != null) {
                      drawBmp(c, b, x0 + 18f * u, top + 22f * u, x0 + 58f * u, top + 62f * u, 8f * u)
                  } else {
                      fill.color = s.color
                      rect.set(x0 + 18f * u, top + 22f * u, x0 + 58f * u, top + 62f * u)
                      c.drawRoundRect(rect, 8f * u, 8f * u, fill)
                  }
                  text(c, s.title, x0 + 68f * u, top + 38f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 90f * u)
                  text(c, s.sub, x0 + 68f * u, top + 54f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 90f * u)

                  val tl = x0 + 18f * u
                  val tw = panelW - 36f * u
                  fill.color = C_TRACK
                  rect.set(tl, top + 72f * u, tl + tw, top + 76f * u)
                  c.drawRoundRect(rect, 2f * u, 2f * u, fill)
                  fill.color = Color.WHITE
                  rect.set(tl, top + 72f * u, tl + tw * max(0f, min(1f, s.progress)), top + 76f * u)
                  c.drawRoundRect(rect, 2f * u, 2f * u, fill)
                  hits.add(Hit("seek", RectF(tl, top + 62f * u, tl + tw, top + 86f * u), tl, tw))
                  text(c, s.posText, tl, top + 92f * u, 11f, C_GRAY)
                  text(c, s.durText, tl + tw, top + 92f * u, 11f, C_GRAY, false, Paint.Align.RIGHT)

                  val cy = top + 108f * u
                  fill.color = Color.WHITE

                  val px = cx - 38f * u
                  rect.set(px - 7f * u, cy - 7f * u, px - 4.5f * u, cy + 7f * u)
                  c.drawRect(rect, fill)
                  path.reset()
                  path.moveTo(px + 6f * u, cy - 7f * u)
                  path.lineTo(px + 6f * u, cy + 7f * u)
                  path.lineTo(px - 4f * u, cy)
                  path.close()
                  c.drawPath(path, fill)
                  hits.add(Hit("prev", RectF(px - 18f * u, cy - 18f * u, px + 18f * u, cy + 18f * u)))

                  if (s.playing) {
                      rect.set(cx - 6f * u, cy - 9f * u, cx - 2f * u, cy + 9f * u)
                      c.drawRect(rect, fill)
                      rect.set(cx + 2f * u, cy - 9f * u, cx + 6f * u, cy + 9f * u)
                      c.drawRect(rect, fill)
                  } else {
                      path.reset()
                      path.moveTo(cx - 6f * u, cy - 9f * u)
                      path.lineTo(cx - 6f * u, cy + 9f * u)
                      path.lineTo(cx + 8f * u, cy)
                      path.close()
                      c.drawPath(path, fill)
                  }
                  hits.add(Hit("toggle", RectF(cx - 20f * u, cy - 20f * u, cx + 20f * u, cy + 20f * u)))

                  val nx = cx + 38f * u
                  path.reset()
                  path.moveTo(nx - 6f * u, cy - 7f * u)
                  path.lineTo(nx - 6f * u, cy + 7f * u)
                  path.lineTo(nx + 4f * u, cy)
                  path.close()
                  c.drawPath(path, fill)
                  rect.set(nx + 4.5f * u, cy - 7f * u, nx + 7f * u, cy + 7f * u)
                  c.drawRect(rect, fill)
                  hits.add(Hit("next", RectF(nx - 18f * u, cy - 18f * u, nx + 18f * u, cy + 18f * u)))
              }

              private fun drawRows(c: Canvas, s: UiState, cx: Float, empty: String) {
                  val x0 = cx - panelW / 2f
                  val top = statusH
                  if (s.rows.isEmpty()) {
                      text(c, empty, cx, top + 52f * u, 12f, C_GRAY, false, Paint.Align.CENTER)
                      return
                  }
                  for (i in s.rows.indices) {
                      val row = s.rows[i]
                      val rt = top + 22f * u + i * 36f * u
                      if (i > 0) {
                          fill.color = C_DARK
                          rect.set(x0 + 18f * u, rt - 2f * u, x0 + panelW - 18f * u, rt - 1f * u)
                          c.drawRect(rect, fill)
                      }
                      avatar(c, row.bmp, row.color, row.title, x0 + 30f * u, rt + 15f * u, 12f * u)
                      val rightW = if (row.right.isNotEmpty()) 64f * u else 0f
                      text(c, row.title, x0 + 50f * u, rt + 13f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 68f * u - rightW)
                      text(c, row.sub, x0 + 50f * u, rt + 28f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 68f * u - rightW)
                      if (row.right.isNotEmpty()) {
                          text(c, row.right, x0 + panelW - 18f * u, rt + 20f * u, 14f, C_ORANGE, true, Paint.Align.RIGHT)
                      }
                      hits.add(Hit(row.id, RectF(x0, rt - 2f * u, x0 + panelW, rt + 34f * u)))
                  }
              }

              private fun drawQuick(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = statusH
                  val labels = arrayOf("Wifi", "Data", "Senter", "Bluetooth")
                  val ids = arrayOf("wifi", "data", "torch", "bt")
                  for (i in 0..3) {
                      val tx = cx + (i - 1.5f) * 79f * u
                      val on = s.tiles[i]
                      fill.color = if (on) C_BLUE else C_DARK
                      rect.set(tx - 25f * u, top + 22f * u, tx + 25f * u, top + 72f * u)
                      c.drawRoundRect(rect, 15f * u, 15f * u, fill)
                      val col = if (on) Color.WHITE else C_GRAY
                      val ty = top + 47f * u
                      when (i) {
                          0 -> {
                              stroke.color = col
                              stroke.strokeWidth = 2f * u
                              val wy = ty + 8f * u
                              val radii = floatArrayOf(6f, 11f, 16f)
                              for (rr in radii) {
                                  rect.set(tx - rr * u, wy - rr * u, tx + rr * u, wy + rr * u)
                                  c.drawArc(rect, 225f, 90f, false, stroke)
                              }
                              fill.color = col
                              c.drawCircle(tx, wy, 2f * u, fill)
                          }
                          1 -> {
                              fill.color = col
                              for (k in 0..3) {
                                  val bh = (5f + 4f * k) * u
                                  val bx = tx - 11f * u + k * 6f * u
                                  rect.set(bx, ty + 8f * u - bh, bx + 4f * u, ty + 8f * u)
                                  c.drawRoundRect(rect, 1f * u, 1f * u, fill)
                              }
                          }
                          2 -> {
                              stroke.color = col
                              stroke.strokeWidth = 2f * u
                              c.drawCircle(tx, ty - 3f * u, 6f * u, stroke)
                              fill.color = col
                              rect.set(tx - 3f * u, ty + 4f * u, tx + 3f * u, ty + 10f * u)
                              c.drawRect(rect, fill)
                          }
                          else -> drawBt(c, tx, ty, 1.2f * u, col, 1.9f * u)
                      }
                      text(c, labels[i], tx, top + 86f * u, 11f, C_GRAY, false, Paint.Align.CENTER)
                      hits.add(Hit(ids[i], RectF(tx - 28f * u, top + 20f * u, tx + 28f * u, top + 92f * u)))
                  }
                  text(c, "Volume", x0 + 18f * u, top + 104f * u, 11f, C_GRAY)
                  val tl = x0 + 18f * u
                  val tw = panelW - 36f * u
                  fill.color = C_TRACK
                  rect.set(tl, top + 112f * u, tl + tw, top + 120f * u)
                  c.drawRoundRect(rect, 4f * u, 4f * u, fill)
                  fill.color = Color.WHITE
                  rect.set(tl, top + 112f * u, tl + tw * max(0f, min(1f, s.volume)), top + 120f * u)
                  c.drawRoundRect(rect, 4f * u, 4f * u, fill)
                  hits.add(Hit("vol", RectF(tl - 8f * u, top + 104f * u, tl + tw + 8f * u, top + 130f * u), tl, tw))
              }

              // ------------------------------------------------------------------ touch

              private fun hitAt(x: Float, y: Float): Hit? {
                  for (i in hits.indices.reversed()) {
                      if (hits[i].r.contains(x, y)) return hits[i]
                  }
                  return null
              }

              private fun isSlider(h: Hit?): Boolean = h != null && h.tw > 0f

              private fun slider(x: Float, last: Boolean) {
                  val h = downHit ?: return
                  if (h.tw <= 0f) return
                  val f = max(0f, min(1f, (x - h.tl) / h.tw))
                  if (h.id == "vol") {
                      host.onAction("vol", f)
                  } else if (last) {
                      host.onAction("seek", f)
                  }
              }

              private val longRun = Runnable {
                  longFired = true
                  performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                  host.onLongPress(downX < width / 2f)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          host.onActive()
                          downX = e.x
                          downY = e.y
                          moved = false
                          longFired = false
                          downHit = hitAt(e.x, e.y)
                          val s = state
                          if (s != null && (s.kind == Kind.IDLE || s.kind == Kind.PILL)) {
                              postDelayed(longRun, 450L)
                          }
                          if (isSlider(downHit)) slider(e.x, false)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (abs(e.x - downX) > slop || abs(e.y - downY) > slop) {
                              moved = true
                              removeCallbacks(longRun)
                          }
                          if (isSlider(downHit)) slider(e.x, false)
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          if (!longFired) {
                              val dx = e.x - downX
                              val dy = e.y - downY
                              val hit = downHit
                              if (hit != null && isSlider(hit)) {
                                  slider(e.x, true)
                              } else if (dy < -28f * u && abs(dy) > abs(dx)) {
                                  host.onClose()
                              } else if (abs(dx) > 28f * u && abs(dx) > abs(dy)) {
                                  host.onSwipe(if (dx < 0f) 1 else -1)
                              } else if (!moved) {
                                  if (hit != null) host.onAction(hit.id, 0f) else host.onTapEmpty()
                              }
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          removeCallbacks(longRun)
                      }
                      else -> {
                      }
                  }
                  return true
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/Prefs.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.content.Context

          object Prefs {

              val APPS: List<Pair<String, String>> = listOf(
                  Pair("WhatsApp", "com.whatsapp"),
                  Pair("WhatsApp Business", "com.whatsapp.w4b"),
                  Pair("Telegram", "org.telegram.messenger"),
                  Pair("Instagram", "com.instagram.android"),
                  Pair("Messenger", "com.facebook.orca"),
                  Pair("Line", "jp.naver.line.android"),
                  Pair("TikTok", "com.zhiliaoapp.musically"),
                  Pair("Gmail", "com.google.android.gm"),
                  Pair("Pesan (SMS)", "com.google.android.apps.messaging")
              )

              private fun sp(c: Context) = c.getSharedPreferences("notch", Context.MODE_PRIVATE)

              fun enabled(c: Context): Boolean = sp(c).getBoolean("enabled", true)

              fun setEnabled(c: Context, v: Boolean) {
                  sp(c).edit().putBoolean("enabled", v).apply()
              }

              fun widthPct(c: Context): Int = sp(c).getInt("w", 33)

              fun setWidthPct(c: Context, v: Int) {
                  sp(c).edit().putInt("w", v).apply()
              }

              fun extraDp(c: Context): Int = sp(c).getInt("h", 0)

              fun setExtraDp(c: Context, v: Int) {
                  sp(c).edit().putInt("h", v).apply()
              }

              fun offsetDp(c: Context): Int = sp(c).getInt("x", 0)

              fun setOffsetDp(c: Context, v: Int) {
                  sp(c).edit().putInt("x", v).apply()
              }

              fun apps(c: Context): Set<String> {
                  val def = setOf("com.whatsapp", "com.whatsapp.w4b")
                  val s = sp(c).getStringSet("apps", def) ?: def
                  return HashSet(s)
              }

              fun setApps(c: Context, v: Set<String>) {
                  sp(c).edit().putStringSet("apps", HashSet(v)).apply()
              }
          }
          CAMES_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CamesNotch.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamesNotch-APK
          path: CamesNotch.apk

      - name: Publikasikan di Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CamesNotch build ${{ github.run_number }}
          files: CamesNotch.apk
