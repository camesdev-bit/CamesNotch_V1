           private fun notifRowsNow(): List<Row> {
            val l = listener ?: return emptyList()
            val ctx = a11y ?: return emptyList()
            val apps = Prefs.apps(ctx)
            val all = try {
             l.activeNotifications
            } catch (e: Exception) {
             null
            }
            if (all == null) return emptyList()

            val mine = all.filter { apps.contains(it.packageName) }
            val kids = mine.filter { (it.notification.flags and Notification.FLAG_GROUP_SUMMARY) == 0 }
            val use = (if (kids.isNotEmpty()) kids else mine).sortedByDescending { it.postTime }

            val items = ArrayList<Item>()
            val seen = HashSet<String>()
            for (sbn in use) {
             for (item in itemsOf(sbn)) {
              val key = item.title + "|" + item.sub
              if (seen.add(key)) items.add(item)
             }
             if (items.size >= 40) break
            }
            itemList = items
            val rows = ArrayList<Row>()
            for (i in items.indices) {
             val item = items[i]
             rows.add(Row(item.title, item.sub, colorFor(item.sbn.packageName), iconOf(item.sbn), "", "n:" + i))
            }
            return rows
           }

           private fun itemsOf(sbn: StatusBarNotification): List<Item> {
            val n = sbn.notification
            val ex = n.extras
            val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
            val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
            val out = ArrayList<Item>()
            try {
             val msgs = ex.getParcelableArray(Notification.EXTRA_MESSAGES)
             if (msgs != null && msgs.isNotEmpty()) {
              for (i in msgs.indices.reversed()) {
               val b = msgs[i] as? Bundle ?: continue
               val t = b.getCharSequence("text")?.toString() ?: continue
               var who = b.getCharSequence("sender")?.toString()
               if (who == null) {
                val pb = b.getBundle("sender_person")
                who = pb?.getCharSequence("name")?.toString()
               }
               val head = if (title.isNotEmpty() && (who == null || who == title)) title
               else if (who != null) who else title
               out.add(Item(head, t, sbn.postTime, n.contentIntent, sbn))
               if (out.size >= 8) break
              }
             }
            } catch (e: Exception) {
            }
            if (out.isEmpty()) {
             try {
              val lines = ex.getCharSequenceArray(Notification.EXTRA_TEXT_LINES)
              if (lines != null && lines.isNotEmpty()) {
               for (i in lines.indices.reversed()) {
                val ln = lines[i].toString()
                val k = ln.indexOf(": ")
                if (k > 0) {
                 out.add(Item(ln.substring(0, k), ln.substring(k + 2), sbn.postTime, n.contentIntent, sbn))
                } else {
                 out.add(Item(title, ln, sbn.postTime, n.contentIntent, sbn))
                }
                if (out.size >= 8) break
               }
              }
             } catch (e: Exception) {
             }
            }
            if (out.isEmpty() && (title.isNotEmpty() || text.isNotEmpty())) {
             out.add(Item(title, text, sbn.postTime, n.contentIntent, sbn))
            }
            return out
           }

           private fun colorFor(pkg: String): Int {
            return when {
             pkg.startsWith("com.whatsapp") -> Color.parseColor("#30D158")
             pkg.contains("telegram") -> Color.parseColor("#64D2FF")
             pkg.contains("instagram") -> Color.parseColor("#FF6482")
             else -> Color.parseColor("#7F77DD")
            }
           }

           private fun iconOf(sbn: StatusBarNotification): Bitmap? {
            val ctx = a11y ?: return null
            try {
             val ic = sbn.notification.getLargeIcon() ?: return null
             val d = ic.loadDrawable(ctx) ?: return null
             val b = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
             val cv = Canvas(b)
             d.setBounds(0, 0, 96, 96)
             d.draw(cv)
             return b
            } catch (e: Exception) {
             return null
            }
           }

           private fun swElapsed(): Long {
            return swAccum + (if (swRunning) SystemClock.elapsedRealtime() - swStart else 0L)
           }

           private fun timerRemaining(): Long {
            val now = System.currentTimeMillis()
            val end = if (ownTimerEnd > now) ownTimerEnd else timerEnd
            if (end <= 0L) return 0L
            val r = (end - now + 500L) / 1000L
            return if (r > 0L) r else 0L
           }

           private fun fmtSec(s: Long): String {
            val hh = s / 3600L
            val mm = (s % 3600L) / 60L
            val ss = s % 60L
            return if (hh > 0L) String.format("%d.%02d.%02d", hh, mm, ss) else String.format("%02d.%02d", mm, ss)
           }

           private fun fmtMs(ms: Long): String {
            val t = ms / 1000L
            return String.format("%d:%02d", t / 60L, t % 60L)
           }

           private fun nowText(): String {
            val c = Calendar.getInstance()
            return String.format("%02d.%02d", c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE))
           }

           private fun checkOwnTimer() {
            if (ownTimerEnd > 0L && System.currentTimeMillis() >= ownTimerEnd) {
             ownTimerEnd = 0L
             timerDone()
            }
           }

           private fun timerDone() {
            val c = a11y
            if (c != null) {
             try {
              val vb = c.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator?
              vb?.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 300, 150, 300, 150, 500), -1))
             } catch (e: Exception) {
             }
             try {
              val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
              RingtoneManager.getRingtone(c, uri)?.play()
             } catch (e: Exception) {
             }
            }
            exp = Exp.NONE
            h.removeCallbacks(collapseRun)
            showTransient(
             UiState(
              Kind.PILL,
              left = Mini(Mini.ALARM, color = ORANGE),
              right = Mini(Mini.TEXT, "Selesai", color = ORANGE)
             ), 8000L, null
            )
           }

           fun onPosted(sbn: StatusBarNotification) {
            scanNotifs()
            val ctx = a11y
            if (ctx != null) {
             val n = sbn.notification
             val isGroup = (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0
             if (Prefs.on(ctx, "notif") && Prefs.apps(ctx).contains(sbn.packageName) && !isGroup && !sbn.isOngoing &&
              n.category != Notification.CATEGORY_CALL
             ) {
              val its = itemsOf(sbn)
              if (its.isNotEmpty()) {
               val first = its[0]
               showTransient(
                UiState(
                 Kind.PANEL_NOTIF,
                 title = first.title,
                 sub = first.sub,
                 time = "sekarang",
                 color = colorFor(sbn.packageName),
                 bmp = iconOf(sbn)
                ), 5000L, n.contentIntent
               )
               return
              }
             }
            }
            render()
           }

           fun onRemoved(sbn: StatusBarNotification) {
            scanNotifs()
            render()
           }

           private fun isClock(p: String): Boolean {
            val s = p.lowercase()
            return s.contains("deskclock") || s.contains("clock") || s.contains("alarm") || s.contains("timer")
           }

           private fun textOf(n: Notification): String {
            val ex = n.extras
            val sb = StringBuilder()
            val keys = listOf(
             Notification.EXTRA_TITLE, Notification.EXTRA_TEXT, Notification.EXTRA_SUB_TEXT,
             Notification.EXTRA_BIG_TEXT, Notification.EXTRA_INFO_TEXT
            )
            for (k in keys) {
             val v = ex.getCharSequence(k)
             if (v != null) sb.append(v.toString()).append(' ')
            }
            val lines = ex.getCharSequenceArray(Notification.EXTRA_TEXT_LINES)
            if (lines != null) {
             for (ln in lines) sb.append(ln.toString()).append(' ')
            }
            return sb.toString()
           }

           private fun collectTexts(v: View, sb: StringBuilder) {
            if (v is TextView) {
             val t = v.text
             if (t != null && t.isNotEmpty()) sb.append(t.toString()).append(' ')
            } else if (v is ViewGroup) {
             for (i in 0 until v.childCount) collectTexts(v.getChildAt(i), sb)
            }
           }

           private fun viewTexts(n: Notification): String {
            val ctx = a11y ?: return ""
            val sb = StringBuilder()
            val list = ArrayList<android.widget.RemoteViews?>()
            try {
             list.add(n.contentView)
             list.add(n.bigContentView)
             list.add(n.headsUpContentView)
            } catch (e: Exception) {
            }
            for (rv in list) {
             if (rv == null) continue
             try {
              val parent = FrameLayout(ctx)
              val v = rv.apply(ctx, parent)
              collectTexts(v, sb)
             } catch (e: Exception) {
             }
            }
            return sb.toString()
           }

           private fun secsFrom(txt: String): Long {
            val m = timeRe.find(txt) ?: return 0L
            val a = m.groupValues[1].toLong()
            val b = m.groupValues[2].toLong()
            val c = m.groupValues[3]
            return if (c.isEmpty()) a * 60L + b else a * 3600L + b * 60L + c.toLong()
           }

           private fun parseTimerEnd(n: Notification): Long {
            val ex = n.extras
            if (ex.getBoolean(Notification.EXTRA_SHOW_CHRONOMETER) &&
             ex.getBoolean(Notification.EXTRA_CHRONOMETER_COUNT_DOWN)
            ) {
             return n.`when`
            }
            var secs = secsFrom(textOf(n))
            if (secs <= 0L) secs = secsFrom(viewTexts(n))
            return if (secs > 0L) System.currentTimeMillis() + secs * 1000L else 0L
           }

           private fun looksLikeTimer(sbn: StatusBarNotification): Boolean {
            val n = sbn.notification
            val txt = (textOf(n) + " " + (n.channelId ?: "")).lowercase()
            if (txt.contains("timer") || txt.contains("pengatur waktu") || txt.contains("hitung mundur") ||
             txt.contains("countdown")
            ) {
             return true
            }
            if (txt.contains("alarm") || txt.contains("stopwatch")) return false
            return sbn.isOngoing
           }

           private fun scanNotifs() {
            val l = listener ?: return
            val all = try {
             l.activeNotifications
            } catch (e: Exception) {
             null
            }
            if (all == null) return
            var tEnd = 0L
            var seenTimer = false
            var ring = false
            var ci: CallInfo? = null
            for (sbn in all) {
             val n = sbn.notification
             val cat = n.category
             if (cat == Notification.CATEGORY_CALL) {
              val c = parseCall(sbn)
              if (c != null) ci = c
             } else if (isClock(sbn.packageName) || cat == Notification.CATEGORY_ALARM) {
              if (n.fullScreenIntent != null) {
               ring = true
              } else if (looksLikeTimer(sbn)) {
               seenTimer = true
               val e = parseTimerEnd(n)
               if (e > 0L) tEnd = e
              }
             }
            }
            val cs = a11y
            if (cs != null && !Prefs.on(cs, "timer")) {
             tEnd = 0L
             seenTimer = false
             ring = false
            }
            if (cs != null && !Prefs.on(cs, "call")) ci = null
            if (tEnd > 0L) {
             timerEnd = tEnd
            } else if (!seenTimer) {
             timerEnd = 0L
            }
            alarmRinging = ring
            call = ci
           }

           fun dump(): String {
            val l = listener ?: return "Akses notifikasi belum aktif."
            val all = (try {
             l.activeNotifications
            } catch (e: Exception) {
             null
            }) ?: return "Tidak bisa membaca notifikasi."
            val sb = StringBuilder()
            for (sbn in all) {
             val n = sbn.notification
             val clock = isClock(sbn.packageName)
             if (!(clock || sbn.isOngoing || n.category == Notification.CATEGORY_ALARM)) continue
             sb.append(sbn.packageName).append('\n')
             sb.append("  kat=").append(n.category).append("  ongoing=").append(sbn.isOngoing)
              .append("  kanal=").append(n.channelId).append('\n')
             sb.append("  teks=").append(textOf(n).trim()).append('\n')
             sb.append("  chrono=").append(n.extras.getBoolean(Notification.EXTRA_SHOW_CHRONOMETER))
              .append("/").append(n.extras.getBoolean(Notification.EXTRA_CHRONOMETER_COUNT_DOWN))
              .append("  layarpenuh=").append(n.fullScreenIntent != null).append('\n')
             val vt = viewTexts(n).trim()
             if (vt.isNotEmpty()) sb.append("  tampilan=").append(vt).append('\n')
             sb.append('\n')
            }
            if (sb.isEmpty()) return "Tidak ada notifikasi jam atau ongoing saat ini. Nyalakan timer dulu, lalu ulangi."
            return sb.toString()
           }

           private fun parseCall(sbn: StatusBarNotification): CallInfo? {
            val n = sbn.notification
            val answerWords = listOf("angkat", "jawab", "answer", "accept", "terima")
            val declineWords = listOf("tolak", "decline", "reject", "abaikan", "dismiss")
            var ans: PendingIntent? = null
            var dec: PendingIntent? = null
            val actions = n.actions
            if (actions != null) {
             for (a in actions) {
              val t = (a.title?.toString() ?: "").lowercase()
              if (answerWords.any { t.contains(it) }) {
               ans = a.actionIntent
              } else if (declineWords.any { t.contains(it) }) {
               dec = a.actionIntent
              }
             }
            }
            val incoming = ans != null || n.fullScreenIntent != null
            if (!incoming) return null
            val name = n.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: "Panggilan masuk"
            val open = n.contentIntent ?: n.fullScreenIntent
            return CallInfo(name, ans, dec, open)
           }

