          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object TopBar {

           private var view: TopBarView? = null
           private var wm: WindowManager? = null

           fun show(s: AccessibilityService) {
            hide()
            if (!Prefs.on(s, "topbar", false)) return
            val m = s.getSystemService(Context.WINDOW_SERVICE) as WindowManager
            val v = TopBarView(s)
            val lp = WindowManager.LayoutParams(
             WindowManager.LayoutParams.MATCH_PARENT,
             v.barHeight(),
             WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
             WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
               WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
               WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
               WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
             PixelFormat.TRANSLUCENT
            )
            lp.gravity = Gravity.TOP
            if (Build.VERSION.SDK_INT >= 28) {
             lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
            }
            try {
             m.addView(v, lp)
             view = v
             wm = m
             v.start()
            } catch (e: Exception) {
             view = null
            }
           }

           fun hide() {
            val v = view
            if (v != null) {
             v.stop()
             try {
              wm?.removeView(v)
             } catch (e: Exception) {
             }
            }
            view = null
           }
          }

          class TopBarView(ctx: Context) : View(ctx) {

           private val d = ctx.resources.displayMetrics.density
           private val h = Handler(Looper.getMainLooper())
           private val timeFmt = SimpleDateFormat("HH:mm", Locale.getDefault())
           private val p = Paint(Paint.ANTI_ALIAS_FLAG)
           private var seenInset = false
           private var pct = 100
           private var charging = false
           private var wifi = false
           private var cell = false

           private val tick = object : Runnable {
            override fun run() {
             refresh()
             h.postDelayed(this, 5000L)
            }
           }

           init {
            setOnApplyWindowInsetsListener { _, ins ->
             val t = ins.systemWindowInsetTop
             if (t > 0) seenInset = true
             visibility = if (seenInset && t == 0) View.INVISIBLE else View.VISIBLE
             ins
            }
           }

           fun barHeight(): Int {
            val id = resources.getIdentifier("status_bar_height", "dimen", "android")
            return if (id > 0) resources.getDimensionPixelSize(id) else (24f * d).toInt()
           }

           fun start() {
            h.post(tick)
           }

           fun stop() {
            h.removeCallbacks(tick)
           }

           private fun refresh() {
            val i = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
            if (i != null) {
             val lv = i.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
             val sc = i.getIntExtra(BatteryManager.EXTRA_SCALE, 100)
             if (lv >= 0 && sc > 0) pct = lv * 100 / sc
             val st = i.getIntExtra(BatteryManager.EXTRA_STATUS, -1)
             charging = st == BatteryManager.BATTERY_STATUS_CHARGING || st == BatteryManager.BATTERY_STATUS_FULL
            }
            try {
             val cm = context.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
             val cap = cm.getNetworkCapabilities(cm.activeNetwork)
             wifi = cap != null && cap.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)
             cell = cap != null && cap.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)
            } catch (e: Exception) {
            }
            invalidate()
           }

           override fun onDraw(c: Canvas) {
            c.drawColor(Color.BLACK)
            val hh = height.toFloat()
            p.reset()
            p.isAntiAlias = true
            p.style = Paint.Style.FILL
            p.color = Color.WHITE
            p.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
            p.textSize = 14f * d
            p.textAlign = Paint.Align.LEFT
            val base = hh / 2f - (p.ascent() + p.descent()) / 2f
            c.drawText(timeFmt.format(Date()), 18f * d, base, p)

            var x = width - 16f * d
            val bw = 24f * d
            val bh = 12f * d
            val top = hh / 2f - bh / 2f
            val body = RectF(x - bw, top, x, top + bh)
            p.style = Paint.Style.STROKE
            p.strokeWidth = 1.2f * d
            p.color = Color.argb(150, 255, 255, 255)
            c.drawRoundRect(body, 3.5f * d, 3.5f * d, p)
            p.style = Paint.Style.FILL
            val inset = 2f * d
            val fw = (bw - inset * 2f) * pct / 100f
            val fillRect = RectF(body.left + inset, top + inset, body.left + inset + fw, top + bh - inset)
            p.color = if (charging) Color.rgb(52, 211, 120) else if (pct <= 20) Color.rgb(255, 69, 58) else Color.WHITE
            c.drawRoundRect(fillRect, 2f * d, 2f * d, p)
            p.color = Color.argb(150, 255, 255, 255)
            c.drawRoundRect(RectF(x + 1.2f * d, hh / 2f - 2.5f * d, x + 3f * d, hh / 2f + 2.5f * d), 1f * d, 1f * d, p)

            x = body.left - 7f * d
            p.color = Color.WHITE
            p.textSize = 12f * d
            p.textAlign = Paint.Align.RIGHT
            val label = pct.toString() + "%"
            c.drawText(label, x, base - 0.5f * d, p)
            x -= p.measureText(label) + 10f * d

            if (wifi) {
             val cx = x - 8f * d
             val cy = hh / 2f + 5f * d
             p.style = Paint.Style.STROKE
             p.strokeCap = Paint.Cap.ROUND
             p.strokeWidth = 1.8f * d
             p.color = Color.WHITE
             val radii = floatArrayOf(4f * d, 8f * d, 12f * d)
             for (r in radii) {
              c.drawArc(RectF(cx - r, cy - r, cx + r, cy + r), 225f, 90f, false, p)
             }
             p.style = Paint.Style.FILL
             c.drawCircle(cx, cy, 1.6f * d, p)
            } else if (cell) {
             val bwid = 3f * d
             val gap = 1.5f * d
             val heights = floatArrayOf(4f * d, 7f * d, 10f * d, 13f * d)
             val total = bwid * 4f + gap * 3f
             var bx = x - total
             val bottom = hh / 2f + 6.5f * d
             p.style = Paint.Style.FILL
             p.color = Color.WHITE
             for (bhh in heights) {
              c.drawRoundRect(RectF(bx, bottom - bhh, bx + bwid, bottom), 1f * d, 1f * d, p)
              bx += bwid + gap
             }
            }
           }
          }
