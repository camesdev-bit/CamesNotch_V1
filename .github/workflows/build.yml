name: Build CamesNotch APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tulis file proyek
        run: |
          cat > 'settings.gradle.kts' <<'CAMES_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CamesNotch"
          include(":app")
          CAMES_EOF
          cat > 'build.gradle.kts' <<'CAMES_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          CAMES_EOF
          cat > 'gradle.properties' <<'CAMES_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          CAMES_EOF
          cat > '.gitignore' <<'CAMES_EOF'
          .gradle/
          build/
          local.properties
          *.iml
          .idea/
          CAMES_EOF
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'CAMES_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "id.cames.notch"
              compileSdk = 34

              defaultConfig {
                  applicationId = "id.cames.notch"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NotchAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/a11y_config" />
                  </service>

                  <service
                      android:name=".NotchListener"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          CAMES_EOF
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/strings.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CamesNotch</string>
              <string name="a11y_desc">Menampilkan notch di atas layar supaya bisa diketuk, digeser, dan ditekan lama.</string>
          </resources>
          CAMES_EOF
          mkdir -p 'app/src/main/res/xml'
          cat > 'app/src/main/res/xml/a11y_config.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:description="@string/a11y_desc"
              android:notificationTimeout="200" />
          CAMES_EOF
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#185FA5"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#000000"
                  android:pathData="M26,18 h56 v16 a16,16 0 0 1 -16,16 h-24 a16,16 0 0 1 -16,-16 z" />
              <path
                  android:fillColor="#5DCAA5"
                  android:pathData="M54,70 m-6,0 a6,6 0 1 0 12,0 a6,6 0 1 0 -12,0" />
          </vector>
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/Demo.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast

          class DemoController : NotchView.Host {

              lateinit var v: NotchView

              private class DAct(val type: Int, val left: Mini, val right: Mini, val row: Row)

              private val h = Handler(Looper.getMainLooper())
              private val coral = Color.parseColor("#D85A30")
              private val orange = Color.parseColor("#EF9F27")
              private val teal = Color.parseColor("#5DCAA5")
              private val green = Color.parseColor("#1D9E75")

              private var musicOn = false
              private var timerOn = false
              private var playing = true
              private var posSec = 53
              private var timerLeft = 300
              private var exp = 0
              private var idx = 0
              private var trans: UiState? = null
              private var torch = false
              private var volume = 0.55f
              private val total = 212

              private val tick = object : Runnable {
                  override fun run() {
                      if (musicOn && playing) posSec = (posSec + 1) % total
                      if (timerOn && timerLeft > 0) timerLeft -= 1
                      if (timerOn && timerLeft == 0) timerOn = false
                      render()
                      h.postDelayed(this, 1000L)
                  }
              }

              private val clearTrans = Runnable {
                  trans = null
                  render()
              }

              private val collapse = Runnable {
                  exp = 0
                  render()
              }

              fun start() {
                  render()
                  h.postDelayed(tick, 1000L)
              }

              fun stop() {
                  h.removeCallbacksAndMessages(null)
              }

              fun toggleMusic() {
                  musicOn = !musicOn
                  if (!musicOn && exp == 1) exp = 0
                  render()
              }

              fun toggleTimer() {
                  timerOn = !timerOn
                  if (timerOn) timerLeft = 300
                  render()
              }

              fun showNotif() {
                  showTransient(
                      UiState(Kind.PANEL_NOTIF, title = "Budi", sub = "Bro, jadi bikin appnya?", time = "sekarang", color = green),
                      4500L
                  )
              }

              fun showCall() {
                  showTransient(UiState(Kind.PANEL_CALL, title = "Mama"), 6000L)
              }

              fun showCharge() {
                  showTransient(
                      UiState(Kind.PILL, left = Mini(Mini.BOLT), right = Mini(Mini.TEXT, "82%", color = teal)),
                      3500L
                  )
              }

              fun showBt() {
                  showTransient(
                      UiState(Kind.PILL, left = Mini(Mini.BT), right = Mini(Mini.TEXT, "Buds Pro", color = Color.WHITE)),
                      3500L
                  )
              }

              fun showAlarm() {
                  showTransient(
                      UiState(Kind.PILL, left = Mini(Mini.ALARM, color = orange), right = Mini(Mini.TEXT, "06.00", color = orange)),
                      4000L
                  )
              }

              private fun showTransient(st: UiState, ms: Long) {
                  exp = 0
                  h.removeCallbacks(collapse)
                  trans = st
                  h.removeCallbacks(clearTrans)
                  h.postDelayed(clearTrans, ms)
                  render()
              }

              private fun fmt(s: Int): String = String.format("%d:%02d", s / 60, s % 60)

              private fun fmtT(s: Int): String = String.format("%02d.%02d", s / 60, s % 60)

              private fun acts(): List<DAct> {
                  val l = ArrayList<DAct>()
                  if (musicOn) {
                      l.add(
                          DAct(
                              0, Mini(Mini.ART, color = coral), Mini(Mini.BARS),
                              Row("Teh Hijau", "Tulus", coral, null, "", "music")
                          )
                      )
                  }
                  if (timerOn) {
                      val t = fmtT(timerLeft)
                      l.add(
                          DAct(
                              1, Mini(Mini.RING, color = orange), Mini(Mini.TEXT, t, color = orange),
                              Row("Timer", "Hitung mundur", orange, null, t, "timer")
                          )
                      )
                  }
                  return l
              }

              private fun demoRows(): List<Row> {
                  val g = Color.parseColor("#1D9E75")
                  val b = Color.parseColor("#378ADD")
                  val p = Color.parseColor("#7F77DD")
                  return listOf(
                      Row("Budi", "Bro, jadi bikin appnya?", g, null, "", "n:0"),
                      Row("Grup Dev", "Update terbaru sudah rilis", b, null, "", "n:1"),
                      Row("Mama", "Jangan lupa makan ya", g, null, "", "n:2"),
                      Row("Kak Rina", "Filenya sudah aku kirim", p, null, "", "n:3"),
                      Row("Pak Ahmad", "Besok jadi rapat jam 9", b, null, "", "n:4"),
                      Row("Tim Cames", "Desain notch keren banget", g, null, "", "n:5")
                  )
              }

              private fun build(): UiState {
                  when (exp) {
                      1 -> return UiState(
                          Kind.PANEL_MUSIC, title = "Teh Hijau", sub = "Tulus", color = coral,
                          progress = posSec.toFloat() / total.toFloat(), posText = fmt(posSec), durText = fmt(total),
                          playing = playing
                      )
                      2 -> return UiState(Kind.PANEL_LIST, rows = acts().map { it.row })
                      3 -> return UiState(Kind.PANEL_NOTIFS, rows = demoRows())
                      4 -> return UiState(Kind.PANEL_QUICK, torch = torch, volume = volume)
                      else -> {
                      }
                  }
                  val t = trans
                  if (t != null) return t
                  val a = acts()
                  if (a.isNotEmpty()) {
                      val k = Math.floorMod(idx, a.size)
                      val c = a[k]
                      return UiState(
                          Kind.PILL, left = c.left, right = c.right,
                          dots = if (a.size > 1) a.size else 0, dotIdx = k
                      )
                  }
                  return UiState(Kind.IDLE)
              }

              private fun render() {
                  v.setState(build())
              }

              private fun setExp(e: Int) {
                  exp = e
                  h.removeCallbacks(collapse)
                  if (e != 0) h.postDelayed(collapse, 8000L)
                  render()
              }

              private fun close() {
                  exp = 0
                  trans = null
                  h.removeCallbacks(collapse)
                  h.removeCallbacks(clearTrans)
                  render()
              }

              override fun onAction(id: String, frac: Float) {
                  if (id == "toggle") {
                      playing = !playing
                  } else if (id == "prev" || id == "next") {
                      posSec = 0
                  } else if (id == "seek") {
                      posSec = (frac * total).toInt()
                  } else if (id == "vol") {
                      volume = frac
                  } else if (id == "torch") {
                      torch = !torch
                  } else if (id == "power") {
                      Toast.makeText(v.context, "Di HP asli, ini membuka menu matikan HP.", Toast.LENGTH_SHORT).show()
                      close()
                      return
                  } else if (id == "music") {
                      setExp(1)
                      return
                  } else if (id == "answer" || id == "decline" || id == "notif" || id.startsWith("n:")) {
                      close()
                      return
                  }
                  render()
              }

              override fun onTapEmpty() {
                  if (exp != 0 || trans != null) return
                  val a = acts()
                  if (a.size >= 2) {
                      setExp(2)
                  } else if (a.size == 1 && a[0].type == 0) {
                      setExp(1)
                  }
              }

              override fun onLongPress(left: Boolean) {
                  if (exp != 0) return
                  setExp(if (left) 3 else 4)
              }

              override fun onSwipe(dir: Int) {
                  if (exp != 0) return
                  if (acts().size >= 2) {
                      idx += dir
                      v.nudge(dir)
                      render()
                  }
              }

              override fun onClose() {
                  close()
              }

              override fun onActive() {
                  if (exp != 0) {
                      h.removeCallbacks(collapse)
                      h.postDelayed(collapse, 8000L)
                  }
              }

              override fun onSettled() {
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/MainActivity.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private var st1: TextView? = null
              private var st2: TextView? = null
              private var density = 1f
              private var demo: DemoController? = null

              private fun dp(x: Int): Int = (x * density).toInt()

              private fun label(text: String, size: Float, bold: Boolean, color: Int): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.textSize = size
                  t.setTextColor(color)
                  if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
                  t.setPadding(0, dp(6), 0, dp(2))
                  return t
              }

              private fun button(text: String, onClick: () -> Unit): Button {
                  val b = Button(this)
                  b.text = text
                  b.isAllCaps = false
                  b.setOnClickListener { onClick() }
                  return b
              }

              private fun chipRow(vararg items: Pair<String, () -> Unit>): LinearLayout {
                  val r = LinearLayout(this)
                  r.orientation = LinearLayout.HORIZONTAL
                  for (p in items) {
                      val b = Button(this)
                      b.text = p.first
                      b.textSize = 12f
                      b.isAllCaps = false
                      b.setPadding(0, 0, 0, 0)
                      val action = p.second
                      b.setOnClickListener { action() }
                      r.addView(b, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  return r
              }

              private fun slider(
                  title: String, min: Int, max: Int, value: Int, onSet: (Int) -> Unit
              ): View {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(0, dp(8), 0, 0)
                  val t = TextView(this)
                  t.text = title + ": " + value
                  t.setTextColor(Color.parseColor("#222222"))
                  val sb = SeekBar(this)
                  sb.max = max - min
                  sb.progress = value - min
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          t.text = title + ": " + (p + min)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {
                      }

                      override fun onStopTrackingTouch(s: SeekBar?) {
                          val p = s?.progress ?: 0
                          onSet(p + min)
                      }
                  })
                  box.addView(t)
                  box.addView(sb)
                  return box
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  density = resources.displayMetrics.density

                  val dark = Color.parseColor("#111111")
                  val grey = Color.parseColor("#555555")

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(20), dp(28), dp(20), dp(28))
                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)

                  root.addView(label("CamesNotch", 28f, true, dark))
                  root.addView(label("Notch ala iPhone untuk Android, tanpa iklan.", 14f, false, grey))

                  // ------------------------------------------------------------ demo
                  root.addView(label("Coba langsung", 16f, true, dark))
                  val frameW = resources.displayMetrics.widthPixels - dp(40)
                  val du = frameW / 360f
                  val frame = FrameLayout(this)
                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor("#185FA5"))
                  bg.cornerRadius = dp(20).toFloat()
                  frame.background = bg
                  root.addView(frame, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, (234f * du).toInt()))

                  val clock = TextView(this)
                  clock.text = "09.41"
                  clock.setTextColor(Color.WHITE)
                  clock.textSize = 12f
                  clock.setTypeface(clock.typeface, Typeface.BOLD)
                  val clockLp = FrameLayout.LayoutParams(FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT)
                  clockLp.leftMargin = (26f * du).toInt()
                  clockLp.topMargin = (4f * du).toInt()
                  frame.addView(clock, clockLp)

                  val ctl = DemoController()
                  val nv = NotchView(this, ctl)
                  ctl.v = nv
                  demo = ctl
                  frame.addView(
                      nv,
                      FrameLayout.LayoutParams(FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT)
                  )
                  var configured = false
                  frame.addOnLayoutChangeListener { _, l, _, r, _, _, _, _, _ ->
                      val w = r - l
                      if (w > 0 && !configured) {
                          configured = true
                          val uu = w / 360f
                          nv.configure(uu, 0.33f * 360f * uu, 26f * uu, 324f * uu)
                          ctl.start()
                      }
                  }

                  root.addView(
                      chipRow(
                          Pair("Musik", { ctl.toggleMusic() }),
                          Pair("Timer", { ctl.toggleTimer() }),
                          Pair("Notif WA", { ctl.showNotif() }),
                          Pair("Telepon", { ctl.showCall() })
                      )
                  )
                  root.addView(
                      chipRow(
                          Pair("Daya", { ctl.showCharge() }),
                          Pair("Bluetooth", { ctl.showBt() }),
                          Pair("Alarm", { ctl.showAlarm() })
                      )
                  )
                  root.addView(
                      label(
                          "Nyalakan Musik dan Timer, lalu ketuk notch (buka musik atau daftar), geser kiri/kanan " +
                                  "(pindah mode), tekan lama sisi kiri (notifikasi), tekan lama sisi kanan " +
                                  "(senter, volume, matikan HP).",
                          12f, false, grey
                      )
                  )

                  // ----------------------------------------------------- permissions
                  root.addView(label("1. Akses notifikasi", 16f, true, dark))
                  val s1 = label("", 14f, false, grey)
                  st1 = s1
                  root.addView(s1)
                  root.addView(button("Buka pengaturan akses notifikasi") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  })

                  root.addView(label("2. Aksesibilitas", 16f, true, dark))
                  val s2 = label("", 14f, false, grey)
                  st2 = s2
                  root.addView(s2)
                  root.addView(button("Buka pengaturan aksesibilitas") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  root.addView(
                      label(
                          "Kalau pilihannya abu-abu (Android 13 ke atas): buka Info Aplikasi CamesNotch, " +
                                  "ketuk titik tiga di kanan atas, pilih Izinkan setelan terbatas, lalu ulangi.",
                          12f, false, grey
                      )
                  )

                  // ---------------------------------------------------------- settings
                  root.addView(label("Pengaturan", 16f, true, dark))
                  val sw = Switch(this)
                  sw.text = "Notch aktif"
                  sw.isChecked = Prefs.enabled(this)
                  sw.setOnCheckedChangeListener { _, checked ->
                      Prefs.setEnabled(this, checked)
                      NotchController.rebuild()
                  }
                  root.addView(sw)

                  root.addView(slider("Lebar notch (% layar)", 20, 45, Prefs.widthPct(this)) {
                      Prefs.setWidthPct(this, it)
                      NotchController.rebuild()
                  })
                  root.addView(slider("Tinggi tambahan (dp)", 0, 20, Prefs.extraDp(this)) {
                      Prefs.setExtraDp(this, it)
                      NotchController.rebuild()
                  })
                  root.addView(slider("Geser horizontal (dp)", -30, 30, Prefs.offsetDp(this)) {
                      Prefs.setOffsetDp(this, it)
                      NotchController.rebuild()
                  })

                  root.addView(label("Aplikasi yang tampil di notch", 16f, true, dark))
                  val chosen = HashSet<String>(Prefs.apps(this))
                  for (app in Prefs.APPS) {
                      val cb = CheckBox(this)
                      cb.text = app.first
                      cb.isChecked = chosen.contains(app.second)
                      cb.setOnCheckedChangeListener { _, checked ->
                          if (checked) chosen.add(app.second) else chosen.remove(app.second)
                          Prefs.setApps(this, chosen)
                      }
                      root.addView(cb)
                  }

                  root.addView(label("Coba di notch asli", 16f, true, dark))
                  root.addView(button("Tes notifikasi di notch") {
                      if (NotchController.isReady()) {
                          NotchController.demo()
                      } else {
                          Toast.makeText(this, "Aktifkan Aksesibilitas dulu.", Toast.LENGTH_SHORT).show()
                      }
                  })

                  if (Build.VERSION.SDK_INT >= 31 &&
                      checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 1)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val l = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  val a = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  st1?.text = if (l.contains(packageName)) "Aktif" else "Belum aktif"
                  st2?.text = if (a.contains(packageName)) "Aktif" else "Belum aktif"
              }

              override fun onDestroy() {
                  demo?.stop()
                  super.onDestroy()
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/Model.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.graphics.Bitmap
          import android.graphics.Color

          enum class Kind {
              IDLE, PILL, PANEL_NOTIF, PANEL_CALL, PANEL_MUSIC, PANEL_LIST, PANEL_NOTIFS, PANEL_QUICK
          }

          class Mini(
              val type: Int,
              val text: String = "",
              val bmp: Bitmap? = null,
              val color: Int = Color.WHITE
          ) {
              companion object {
                  const val ART = 0
                  const val BARS = 1
                  const val BOLT = 2
                  const val BT = 3
                  const val ALARM = 4
                  const val RING = 5
                  const val TEXT = 6
              }
          }

          class Row(
              val title: String,
              val sub: String,
              val color: Int,
              val bmp: Bitmap? = null,
              val right: String = "",
              val id: String = ""
          )

          class UiState(
              val kind: Kind,
              val left: Mini? = null,
              val right: Mini? = null,
              val dots: Int = 0,
              val dotIdx: Int = 0,
              val title: String = "",
              val sub: String = "",
              val time: String = "",
              val color: Int = Color.GRAY,
              val bmp: Bitmap? = null,
