            text(c, s.sub, x0 + 64f * u, top + 49f * u, 11.5f, C_GRAY, false, Paint.Align.LEFT, panelW - 64f * u - 112f * u)
            val bl = x0 + panelW - 18f * u - 70f * u
            fill.color = s.color
            rect.set(bl, top + 20f * u, bl + 70f * u, top + 48f * u)
            c.drawRoundRect(rect, 14f * u, 14f * u, fill)
            text(c, s.note, bl + 35f * u, top + 38.5f * u, 12.5f, Color.parseColor("#04120A"), true, Paint.Align.CENTER)
