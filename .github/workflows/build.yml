          import android.content.Context

          object Prefs {

           val APPS: List<Pair<String, String>> = listOf(
            Pair("WhatsApp", "com.whatsapp"),
            Pair("WhatsApp Business", "com.whatsapp.w4b"),
            Pair("Telegram", "org.telegram.messenger"),
            Pair("Instagram", "com.instagram.android"),
            Pair("Messenger", "com.facebook.orca"),
            Pair("Line", "jp.naver.line.android"),
            Pair("TikTok", "com.zhiliaoapp.musically"),
            Pair("Gmail", "com.google.android.gm"),
            Pair("Pesan (SMS)", "com.google.android.apps.messaging")
           )

           private fun sp(c: Context) = c.getSharedPreferences("notch", Context.MODE_PRIVATE)

           fun enabled(c: Context): Boolean = sp(c).getBoolean("enabled", true)

           fun setEnabled(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("enabled", v).apply()
           }

           fun widthPct(c: Context): Int = sp(c).getInt("w", 33)

           fun setWidthPct(c: Context, v: Int) {
            sp(c).edit().putInt("w", v).apply()
           }

           fun extraDp(c: Context): Int = sp(c).getInt("h", 0)

           fun setExtraDp(c: Context, v: Int) {
            sp(c).edit().putInt("h", v).apply()
           }

           fun outline(c: Context): Boolean = sp(c).getBoolean("outline", true)

           fun setOutline(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("outline", v).apply()
           }

           fun haptic(c: Context): Boolean = sp(c).getBoolean("haptic", true)

           fun setHaptic(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("haptic", v).apply()
           }

           fun dtap(c: Context): Boolean = sp(c).getBoolean("dtap", false)

           fun setDtap(c: Context, v: Boolean) {
            sp(c).edit().putBoolean("dtap", v).apply()
           }

           fun apps(c: Context): Set<String> {
            val def = setOf("com.whatsapp", "com.whatsapp.w4b")
            val s = sp(c).getStringSet("apps", def) ?: def
            return HashSet(s)
           }

           fun setApps(c: Context, v: Set<String>) {
            sp(c).edit().putStringSet("apps", HashSet(v)).apply()
           }

           const val DEFAULT_NOTE = "Halo semuanya, selamat datang di videoku. Teks ini bisa kamu ganti di pengaturan " +
             "CamesNotch, bagian Teks baca. Buka lewat gestur Teks baca (atur di pengaturan), lalu tekan tombol putar " +
             "supaya teks bergulir sendiri sementara kamu tetap menatap kamera."

           fun on(c: Context, key: String, def: Boolean = true): Boolean = sp(c).getBoolean("f_" + key, def)

           fun setOn(c: Context, key: String, v: Boolean) {
            sp(c).edit().putBoolean("f_" + key, v).apply()
           }

           fun noteTitle(c: Context, i: Int): String =
            sp(c).getString("nt" + i, if (i == 0) "Contoh" else "") ?: ""

           fun noteBody(c: Context, i: Int): String =
            sp(c).getString("nb" + i, if (i == 0) DEFAULT_NOTE else "") ?: ""

           fun setNote(c: Context, i: Int, title: String, body: String) {
            sp(c).edit().putString("nt" + i, title).putString("nb" + i, body).apply()
           }

           fun textFont(c: Context): Int = sp(c).getInt("tf", 2)

           fun setTextFont(c: Context, v: Int) {
            sp(c).edit().putInt("tf", v).apply()
           }

           fun textSpeed(c: Context): Int = sp(c).getInt("ts", 2)

           fun setTextSpeed(c: Context, v: Int) {
            sp(c).edit().putInt("ts", v).apply()
           }

           val GESTURE_NAMES: Array<String> = arrayOf("Daftar notifikasi", "Pengaturan cepat", "Teks baca")

           private val GESTURE_SLOTS: Array<String> = arrayOf("gl", "gr", "gd")

           fun gesture(c: Context, slot: String): Int {
            val def = when (slot) {
             "gl" -> 0
             "gr" -> 1
             else -> 2
            }
            return sp(c).getInt("g_" + slot, def)
           }

           fun setGesture(c: Context, slot: String, v: Int) {
            val old = gesture(c, slot)
            val e = sp(c).edit()
            for (o in GESTURE_SLOTS) {
             if (o != slot && gesture(c, o) == v) e.putInt("g_" + o, old)
            }
            e.putInt("g_" + slot, v)
            e.apply()
           }

           val ICON_NAMES: Array<String> = arrayOf("Kaca bening", "Kaca berwarna (otomatis)", "Satu warna (seperti Vivo)")

           fun iconMode(c: Context): Int = sp(c).getInt("icm", 1)

           fun setIconMode(c: Context, v: Int) {
            sp(c).edit().putInt("icm", v).apply()
           }
          }
