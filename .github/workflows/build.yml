           private fun drawQr(c: Canvas, s: UiState, cx: Float) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            val ar = Color.red(s.color)
            val ag = Color.green(s.color)
            val ab = Color.blue(s.color)
