          package id.cames.notch

          import android.graphics.Bitmap
          import android.net.Uri
          import com.google.zxing.BarcodeFormat
          import com.google.zxing.BinaryBitmap
          import com.google.zxing.DecodeHintType
          import com.google.zxing.MultiFormatReader
          import com.google.zxing.RGBLuminanceSource
          import com.google.zxing.common.HybridBinarizer

          class Scan(
           val type: Int,
           val title: String,
           val sub: String,
           val button: String,
           val data: String,
           val ssid: String = "",
           val pass: String = "",
           val sec: String = "",
           val hidden: Boolean = false
          ) {
           companion object {
            const val WIFI = 0
            const val URL = 1
            const val TEXT = 2
            const val SEARCH = 3
           }
          }

          object QrScanner {

           private val reader = MultiFormatReader()

           init {
            val hints = HashMap<DecodeHintType, Any>()
            hints[DecodeHintType.POSSIBLE_FORMATS] = listOf(
             BarcodeFormat.QR_CODE, BarcodeFormat.EAN_13, BarcodeFormat.EAN_8,
             BarcodeFormat.UPC_A, BarcodeFormat.CODE_128, BarcodeFormat.CODE_39
            )
            hints[DecodeHintType.TRY_HARDER] = true
            reader.setHints(hints)
           }

           fun decode(bmp: Bitmap): String? {
            val w = bmp.width
            val h = bmp.height
            val px = IntArray(w * h)
            bmp.getPixels(px, 0, w, 0, 0, w, h)
            val src = RGBLuminanceSource(w, h, px)
            return try {
             reader.decodeWithState(BinaryBitmap(HybridBinarizer(src))).text
            } catch (e: Exception) {
             null
            } finally {
             reader.reset()
            }
           }

           private fun wifiField(raw: String, key: String): String {
            val body = raw.substring(5)
            val parts = ArrayList<String>()
            val sb = StringBuilder()
            var i = 0
            while (i < body.length) {
             val ch = body[i]
             if (ch == '\\' && i + 1 < body.length) {
              sb.append(body[i + 1])
              i += 2
              continue
             }
             if (ch == ';') {
              parts.add(sb.toString())
              sb.setLength(0)
             } else {
              sb.append(ch)
             }
             i += 1
            }
            if (sb.isNotEmpty()) parts.add(sb.toString())
            for (p in parts) {
             if (p.length >= key.length + 1 && p.startsWith(key + ":")) return p.substring(key.length + 1)
            }
            return ""
           }

           fun classify(rawIn: String): Scan {
            val raw = rawIn.trim()
            if (raw.startsWith("WIFI:", true)) {
             val ssid = wifiField(raw, "S")
             val pass = wifiField(raw, "P")
             val sec = wifiField(raw, "T")
             val hid = wifiField(raw, "H").equals("true", true)
             return Scan(Scan.WIFI, "Sambung ke WiFi ini?", ssid, "Sambung", raw, ssid, pass, sec, hid)
            }
            val low = raw.lowercase()
            if (low.startsWith("http://") || low.startsWith("https://") || low.startsWith("www.")) {
             val url = if (low.startsWith("www.")) "https://" + raw else raw
             var host = ""
             try {
              host = Uri.parse(url).host ?: ""
             } catch (e: Exception) {
             }
             val sub = if (host.isNotEmpty()) host else raw
             return Scan(Scan.URL, "Masuk ke URL ini?", sub, "Buka", url)
            }
            if (low.startsWith("tel:") || low.startsWith("mailto:") || low.startsWith("geo:") ||
             low.startsWith("sms:") || low.startsWith("smsto:")
            ) {
             return Scan(Scan.URL, "Buka tautan ini?", raw, "Buka", raw)
            }
            var digits = raw.length >= 8
            for (ch in raw) {
             if (!ch.isDigit()) digits = false
            }
            if (digits) return Scan(Scan.SEARCH, "Cari kode ini?", raw, "Cari", raw)
            return Scan(Scan.TEXT, "Salin teks ini?", raw, "Salin", raw)
           }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/TouchView.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.content.Context
          import android.view.MotionEvent
          import android.view.View

          class TouchView(ctx: Context, private val target: NotchView) : View(ctx) {

           override fun onTouchEvent(e: MotionEvent): Boolean {
            val dx = (target.width - width) / 2f
            val m = MotionEvent.obtain(e)
            m.offsetLocation(dx, 0f)
            val r = target.handleTouch(m)
            m.recycle()
            return r
           }
          }
          CAMES_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon --stacktrace > build.log 2>&1 && ok=1 && break
            echo "Percobaan $i gagal, ulang 30 dtk"
            sleep 30
          done
          tail -n 60 build.log | grep -E "error:|e: |FAILED|What went wrong|Could not" || true
          [ "${ok:-0}" = 1 ]

      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CamesNotch.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamesNotch-APK
          path: CamesNotch.apk

      - name: Publikasikan di Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CamesNotch build ${{ github.run_number }}
          files: CamesNotch.apk
