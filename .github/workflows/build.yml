             Color.argb(0, 0, 0, 0), Color.argb(45, 0, 0, 0), Shader.TileMode.CLAMP
            )
            c.drawRect(rect.left, rect.bottom - lowH, rect.right, rect.bottom, low)
            c.restore()

            val rim = Paint(Paint.ANTI_ALIAS_FLAG)
            rim.style = Paint.Style.STROKE
            rim.strokeWidth = s * 0.022f
            rim.shader = LinearGradient(
             rect.left, rect.top, rect.right, rect.bottom,
