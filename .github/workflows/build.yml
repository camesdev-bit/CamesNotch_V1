          package id.cames.notch

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffColorFilter
          import android.graphics.PorterDuffXfermode
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.drawable.AdaptiveIconDrawable
          import android.graphics.drawable.Drawable
          import android.os.Build

          object GlassIcons {

           const val CLEAR = 0
           const val COLOR = 1
           const val SOLID = 2

           fun avgColor(d: Drawable): Int {
            val n = 12
            val b = Bitmap.createBitmap(n, n, Bitmap.Config.ARGB_8888)
            val c = Canvas(b)
            d.setBounds(0, 0, n, n)
            d.draw(c)
            val px = IntArray(n * n)
            b.getPixels(px, 0, n, 0, 0, n, n)
            b.recycle()
            val hsv = FloatArray(3)
            var r = 0f
            var g = 0f
            var bl = 0f
            var w = 0f
            for (p in px) {
             val a = Color.alpha(p)
             if (a < 40) continue
             Color.colorToHSV(p, hsv)
             val wt = (a / 255f) * (0.2f + hsv[1])
             r += Color.red(p) * wt
             g += Color.green(p) * wt
             bl += Color.blue(p) * wt
             w += wt
            }
            if (w <= 0f) return Color.rgb(150, 160, 185)
            return Color.rgb((r / w).toInt(), (g / w).toInt(), (bl / w).toInt())
           }

           private fun vivid(color: Int): Int {
            val h = FloatArray(3)
            Color.colorToHSV(color, h)
            if (h[1] > 0.12f) h[1] = Math.min(1f, h[1] * 1.15f)
            h[2] = Math.max(0.55f, Math.min(0.95f, h[2]))
            return Color.HSVToColor(h)
           }

           private fun lighten(c: Int, t: Float): Int {
            val r = Color.red(c) + ((255 - Color.red(c)) * t).toInt()
            val g = Color.green(c) + ((255 - Color.green(c)) * t).toInt()
            val b = Color.blue(c) + ((255 - Color.blue(c)) * t).toInt()
            return Color.rgb(r, g, b)
           }

           private fun darken(c: Int, t: Float): Int {
            val r = (Color.red(c) * (1f - t)).toInt()
            val g = (Color.green(c) * (1f - t)).toInt()
            val b = (Color.blue(c) * (1f - t)).toInt()
            return Color.rgb(r, g, b)
           }

           private fun alpha(c: Int, a: Int): Int = Color.argb(a, Color.red(c), Color.green(c), Color.blue(c))

           fun render(d: Drawable, mode: Int, s: Int): Bitmap {
            val out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
            val c = Canvas(out)
            val pad = s * 0.07f
            val rect = RectF(pad, pad * 0.7f, s - pad, s - pad * 1.3f)
            val rad = rect.width() * 0.28f
            val path = Path()
            path.addRoundRect(rect, rad, rad, Path.Direction.CW)

            val tint = vivid(avgColor(d))

            var glyph: Drawable = d
            var big = false
            if (d is AdaptiveIconDrawable) {
             val f: Drawable? = d.foreground
             if (f != null) {
              glyph = f
              big = true
             }
             if (mode == SOLID && Build.VERSION.SDK_INT >= 33) {
              val mono: Drawable? = d.monochrome
              if (mono != null) {
               glyph = mono
               big = true
              }
             }
            }

            val shadow = Paint(Paint.ANTI_ALIAS_FLAG)
            shadow.color = Color.BLACK
            shadow.setShadowLayer(s * 0.05f, 0f, s * 0.03f, Color.argb(90, 0, 0, 0))
            c.drawPath(path, shadow)
            val clear = Paint(Paint.ANTI_ALIAS_FLAG)
            clear.xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
            c.drawPath(path, clear)

            val top: Int
            val bot: Int
            if (mode == SOLID) {
             top = Color.rgb(228, 235, 255)
             bot = Color.rgb(205, 216, 250)
            } else if (mode == COLOR) {
             top = alpha(lighten(tint, 0.30f), 215)
             bot = alpha(darken(tint, 0.12f), 235)
            } else {
             top = alpha(lighten(tint, 0.55f), 120)
             bot = alpha(tint, 70)
            }
            val fill = Paint(Paint.ANTI_ALIAS_FLAG)
            fill.style = Paint.Style.FILL
            fill.shader = LinearGradient(0f, rect.top, 0f, rect.bottom, top, bot, Shader.TileMode.CLAMP)
            c.drawPath(path, fill)

            c.save()
            c.clipPath(path)
            val scale = if (big) 1.38f else 0.74f
            val half = rect.width() * scale / 2f
            glyph.setBounds(
             (rect.centerX() - half).toInt(),
             (rect.centerY() - half).toInt(),
             (rect.centerX() + half).toInt(),
             (rect.centerY() + half).toInt()
            )
            if (mode == SOLID) {
             glyph.colorFilter = PorterDuffColorFilter(Color.rgb(42, 47, 60), PorterDuff.Mode.SRC_IN)
            } else {
             glyph.colorFilter = null
            }
            glyph.draw(c)
            glyph.colorFilter = null

            val sheenH = rect.height() * 0.55f
            val sheen = Paint(Paint.ANTI_ALIAS_FLAG)
            sheen.shader = LinearGradient(
