                      </intent-filter>
                  </service>

              </application>
          </manifest>
          CAMES_EOF
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/strings.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CamesNotch</string>
              <string name="a11y_desc">Menampilkan notch di atas layar supaya bisa diketuk, digeser, dan ditekan lama.</string>
          </resources>
          CAMES_EOF
          mkdir -p 'app/src/main/res/xml'
          cat > 'app/src/main/res/xml/a11y_config.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
