              fun configure(unit: Float, nw: Float, nh: Float, sb: Float, pw: Float) {
                  u = unit
                  collapsedW = nw
                  collapsedH = nh
                  statusH = sb
                  panelW = pw
                  val s = state
                  if (s != null) {
                      targetsFor(s)
                      for (i in 0..2) {
                          cur[i] = tgt[i]
                          vel[i] = 0f
                      }
