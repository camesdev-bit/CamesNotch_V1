             floatArrayOf(0f, 0.55f, 1f),
             Shader.TileMode.CLAMP
            )
            val hw = rim.strokeWidth / 2f
            val rr = RectF(rect.left + hw, rect.top + hw, rect.right - hw, rect.bottom - hw)
            c.drawRoundRect(rr, rad - hw, rad - hw, rim)
