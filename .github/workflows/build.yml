            avatar(c, s.bmp, s.color, s.title, x0 + 28f * u, top + 30f * u, 14f * u)
            text(c, s.title, x0 + 52f * u, top + 27f * u, 13.5f, Color.WHITE, true, Paint.Align.LEFT, panelW - 140f * u)
            text(c, s.sub, x0 + 52f * u, top + 43f * u, 11.5f, C_GRAY, false, Paint.Align.LEFT, panelW - 74f * u)
            text(c, s.time, x0 + panelW - 20f * u, top + 27f * u, 11f, C_GRAY, false, Paint.Align.RIGHT)
            addHit(Hit("notif", RectF(x0, top, x0 + panelW, top + panelH(s))))
