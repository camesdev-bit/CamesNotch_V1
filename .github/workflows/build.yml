          cat > 'app/src/main/java/id/cames/notch/NotchController.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.accessibilityservice.AccessibilityService
          import android.app.Notification
          import android.app.PendingIntent
          import android.bluetooth.BluetoothDevice
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.media.MediaMetadata
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.provider.Settings
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.WindowManager
          import java.util.Calendar
          import kotlin.math.max
          import kotlin.math.roundToInt

          object NotchController : NotchView.Host {

              private enum class Exp { NONE, MUSIC, ACTS, NOTIFS, QUICK }

              private class CallInfo(
                  val name: String,
                  val answer: PendingIntent?,
                  val decline: PendingIntent?,
                  val open: PendingIntent?
              )

              private class Act(val type: Int, val left: Mini, val right: Mini, val row: Row)

              private class Item(val title: String, val sub: String, val time: Long, val pi: PendingIntent?, val sbn: StatusBarNotification)

              private val ORANGE = Color.parseColor("#EF9F27")
              private val TEAL = Color.parseColor("#5DCAA5")
              private val CORAL = Color.parseColor("#D85A30")

              private val h = Handler(Looper.getMainLooper())

              private var a11y: AccessibilityService? = null
              private var listener: NotificationListenerService? = null
              private var wm: WindowManager? = null
              private var view: NotchView? = null
              private var lp: WindowManager.LayoutParams? = null

              private var mgr: MediaSessionManager? = null
              private var sessions: List<MediaController> = emptyList()
              private var media: MediaController? = null

              private var timerEnd = 0L
              private var alarmRinging = false
              private var call: CallInfo? = null

              private var trans: UiState? = null
              private var transOpen: PendingIntent? = null
              private var exp = Exp.NONE
              private var actIdx = 0
              private var itemList: List<Item> = emptyList()

              private var torchId: String? = null
              private var torchOn = false
              private var torchRegistered = false

              private val timeRe = Regex("(\\d{1,2}):(\\d{2})(?::(\\d{2}))?")

              // ------------------------------------------------------------ lifecycle

              fun attachA11y(s: AccessibilityService) {
                  a11y = s
                  wm = s.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val f = IntentFilter()
                  f.addAction(Intent.ACTION_POWER_CONNECTED)
                  f.addAction(BluetoothDevice.ACTION_ACL_CONNECTED)
                  try {
                      s.registerReceiver(receiver, f)
                  } catch (e: Exception) {
                  }
                  initTorch(s)
                  rebuild()
              }

              fun detachA11y() {
                  val s = a11y
                  removeView()
                  if (s != null) {
                      try {
                          s.unregisterReceiver(receiver)
                      } catch (e: Exception) {
                      }
                      try {
                          if (torchRegistered) {
                              val cm = s.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                              cm.unregisterTorchCallback(torchCb)
                              torchRegistered = false
                          }
                      } catch (e: Exception) {
                      }
                  }
                  a11y = null
              }

              fun attachListener(s: NotificationListenerService) {
                  listener = s
                  mgr = s.getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                  val cn = ComponentName(s, NotchListener::class.java)
                  try {
                      mgr?.addOnActiveSessionsChangedListener(sessionsListener, cn)
                  } catch (e: Exception) {
                  }
                  updateSessions()
                  scanNotifs()
                  render()
              }

              fun detachListener() {
                  for (c in sessions) {
                      try {
                          c.unregisterCallback(mediaCb)
                      } catch (e: Exception) {
                      }
                  }
                  try {
                      mgr?.removeOnActiveSessionsChangedListener(sessionsListener)
                  } catch (e: Exception) {
                  }
                  sessions = emptyList()
                  media = null
                  listener = null
                  render()
              }

              fun isReady(): Boolean = view != null

              fun demo() {
                  showTransient(
                      UiState(
                          Kind.PANEL_NOTIF,
                          title = "Budi",
                          sub = "Bro, jadi bikin appnya?",
                          time = "sekarang",
                          color = Color.parseColor("#1D9E75")
                      ), 5000L, null
                  )
              }

              fun rebuild() {
                  val s = a11y ?: return
                  removeView()
                  if (!Prefs.enabled(s)) return
                  val dm = s.resources.displayMetrics
                  if (dm.widthPixels > dm.heightPixels) return
                  val u = dm.widthPixels / 360f

                  var cutB = 0f
                  var cutW = 0f
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          val cut = wm?.currentWindowMetrics?.windowInsets?.displayCutout
                          val r = cut?.boundingRectTop
                          if (r != null && !r.isEmpty) {
                              cutB = r.bottom.toFloat()
                              cutW = r.width().toFloat()
                          }
                      } catch (e: Exception) {
                      }
                  }

                  val extra = Prefs.extraDp(s) * dm.density
                  var nw = Prefs.widthPct(s) / 100f * 360f * u
                  if (cutW > 0f) nw = max(nw, cutW + 24f * u)
                  var nh = if (cutB > 0f) cutB + 2f * u else 26f * u
                  nh = max(nh, 22f * u) + extra
                  val pw = 324f * u

                  val v = NotchView(s, this)
                  v.configure(u, nw, nh, pw)

                  val flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                          WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED
                  val l = WindowManager.LayoutParams(
                      v.smallW(),
                      v.smallH(),
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  l.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  l.x = (Prefs.offsetDp(s) * dm.density).toInt()
                  l.y = 0
                  if (Build.VERSION.SDK_INT >= 28) {
                      l.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                  }
                  try {
                      wm?.addView(v, l)
                  } catch (e: Exception) {
                      return
                  }
                  view = v
                  lp = l
                  render()
              }

              private fun removeView() {
                  h.removeCallbacks(tickRun)
                  h.removeCallbacks(collapseRun)
                  h.removeCallbacks(clearTransRun)
                  val v = view
                  if (v != null) {
                      try {
                          wm?.removeView(v)
                      } catch (e: Exception) {
                      }
                  }
                  view = null
                  lp = null
              }

              fun onConfig() {
                  rebuild()
              }

              // --------------------------------------------------------------- window

              private fun setWin(w: Int, hh: Int, touchable: Boolean) {
                  val v = view ?: return
                  val l = lp ?: return
                  l.width = w
                  l.height = hh
                  l.flags = if (touchable) {
                      l.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                  } else {
                      l.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  }
                  try {
                      wm?.updateViewLayout(v, l)
                  } catch (e: Exception) {
                  }
              }

              override fun onSettled() {
                  val v = view ?: return
                  val l = lp ?: return
                  val w = v.restW()
                  val hh = v.restH()
                  val locked = (l.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE) != 0
                  if (l.width != w || l.height != hh || locked) setWin(w, hh, true)
              }

              private fun render() {
                  val v = view ?: return
                  val l = lp ?: return
                  val st = buildState()
                  val needW = v.tightW(st)
                  val needH = v.tightH(st)
                  if (needW > l.width || needH > l.height) {
                      v.hold(needW, needH)
                      setWin(v.bigW(), v.bigH(), false)
                  }
                  v.setState(st)
                  scheduleTicks()
              }

              private val tickRun = Runnable { render() }

              private fun scheduleTicks() {
                  h.removeCallbacks(tickRun)
                  val music = exp == Exp.MUSIC && media?.playbackState?.state == PlaybackState.STATE_PLAYING
                  val timer = timerRemaining() > 0L
                  if (music) {
                      h.postDelayed(tickRun, 500L)
                  } else if (timer) {
                      h.postDelayed(tickRun, 1000L)
                  }
              }

              // ---------------------------------------------------------------- state

              private fun buildState(): UiState {
                  when (exp) {
                      Exp.MUSIC -> return musicPanel()
                      Exp.ACTS -> return UiState(Kind.PANEL_LIST, rows = acts().map { it.row })
                      Exp.NOTIFS -> return UiState(Kind.PANEL_NOTIFS, rows = notifRowsNow())
                      Exp.QUICK -> return quickPanel()
                      else -> {
                      }
                  }
                  val t = trans
                  if (t != null) return t
                  val ci = call
                  if (ci != null) return UiState(Kind.PANEL_CALL, title = ci.name)
                  if (alarmRinging) {
                      return UiState(
                          Kind.PILL,
                          left = Mini(Mini.ALARM, color = ORANGE),
                          right = Mini(Mini.TEXT, nowText(), color = ORANGE)
                      )
                  }
                  val a = acts()
                  if (a.isNotEmpty()) {
                      val k = Math.floorMod(actIdx, a.size)
                      val cur = a[k]
                      return UiState(
                          Kind.PILL,
                          left = cur.left,
                          right = cur.right,
                          dots = if (a.size > 1) a.size else 0,
                          dotIdx = k
                      )
                  }
                  return UiState(Kind.IDLE)
              }

              private fun acts(): List<Act> {
                  val list = ArrayList<Act>()
                  val m = media
                  if (m != null && m.playbackState?.state == PlaybackState.STATE_PLAYING) {
                      val md = m.metadata
                      val bmp = if (md != null) art(md) else null
                      val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Musik"
                      val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                      list.add(
                          Act(
                              0,
                              Mini(Mini.ART, bmp = bmp, color = CORAL),
                              Mini(Mini.BARS),
                              Row(title, artist, CORAL, bmp, "", "music")
                          )
                      )
                  }
                  val rem = timerRemaining()
                  if (rem > 0L) {
                      val t = fmtSec(rem)
                      list.add(
                          Act(
                              1,
                              Mini(Mini.RING, color = ORANGE),
                              Mini(Mini.TEXT, t, color = ORANGE),
                              Row("Timer", "Hitung mundur", ORANGE, null, t, "timer")
                          )
                      )
                  }
                  return list
              }

              private fun art(md: MediaMetadata): Bitmap? {
                  return md.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART)
                      ?: md.getBitmap(MediaMetadata.METADATA_KEY_ART)
                      ?: md.getBitmap(MediaMetadata.METADATA_KEY_DISPLAY_ICON)
              }

              private fun musicPanel(): UiState {
                  val m = media
                  val md = m?.metadata
                  val ps = m?.playbackState
                  val dur = md?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                  val playing = ps?.state == PlaybackState.STATE_PLAYING
                  var pos = ps?.position ?: 0L
                  if (pos < 0L) pos = 0L
                  if (ps != null && playing) {
                      pos += ((SystemClock.elapsedRealtime() - ps.lastPositionUpdateTime) * ps.playbackSpeed).toLong()
                  }
                  if (dur > 0L && pos > dur) pos = dur
                  val title = md?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Musik"
                  val artist = md?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: ""
                  val bmp = if (md != null) art(md) else null
                  return UiState(
                      Kind.PANEL_MUSIC,
                      title = title,
                      sub = artist,
                      color = CORAL,
                      bmp = bmp,
                      progress = if (dur > 0L) pos.toFloat() / dur.toFloat() else 0f,
                      posText = fmtMs(pos),
                      durText = if (dur > 0L) fmtMs(dur) else "--:--",
                      playing = playing
                  )
              }

              private fun quickPanel(): UiState {
                  val c = a11y ?: return UiState(Kind.IDLE)
                  val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val mx = max(1, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC))
                  val vol = am.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / mx.toFloat()
                  return UiState(Kind.PANEL_QUICK, torch = torchOn, volume = vol)
              }

              // -------------------------------------------------- notification rows

              private fun notifRowsNow(): List<Row> {
                  val l = listener ?: return emptyList()
                  val ctx = a11y ?: return emptyList()
                  val apps = Prefs.apps(ctx)
                  val all = try {
                      l.activeNotifications
                  } catch (e: Exception) {
                      null
                  }
                  if (all == null) return emptyList()

                  val mine = all.filter { apps.contains(it.packageName) }
                  val kids = mine.filter { (it.notification.flags and Notification.FLAG_GROUP_SUMMARY) == 0 }
                  val use = (if (kids.isNotEmpty()) kids else mine).sortedByDescending { it.postTime }

                  val items = ArrayList<Item>()
                  val seen = HashSet<String>()
                  for (sbn in use) {
                      for (item in itemsOf(sbn)) {
                          val key = item.title + "|" + item.sub
                          if (seen.add(key)) items.add(item)
                      }
                      if (items.size >= 40) break
                  }
                  itemList = items
                  val rows = ArrayList<Row>()
                  for (i in items.indices) {
                      val item = items[i]
                      rows.add(Row(item.title, item.sub, colorFor(item.sbn.packageName), iconOf(item.sbn), "", "n:" + i))
                  }
                  return rows
              }

              private fun itemsOf(sbn: StatusBarNotification): List<Item> {
                  val n = sbn.notification
                  val ex = n.extras
                  val title = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val text = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val out = ArrayList<Item>()
                  try {
                      val msgs = ex.getParcelableArray(Notification.EXTRA_MESSAGES)
                      if (msgs != null && msgs.isNotEmpty()) {
                          for (i in msgs.indices.reversed()) {
                              val b = msgs[i] as? Bundle ?: continue
                              val t = b.getCharSequence("text")?.toString() ?: continue
                              var who = b.getCharSequence("sender")?.toString()
                              if (who == null) {
                                  val pb = b.getBundle("sender_person")
                                  who = pb?.getCharSequence("name")?.toString()
                              }
                              val head = if (title.isNotEmpty() && (who == null || who == title)) title
                              else if (who != null) who else title
                              out.add(Item(head, t, sbn.postTime, n.contentIntent, sbn))
                              if (out.size >= 8) break
                          }
                      }
                  } catch (e: Exception) {
                  }
                  if (out.isEmpty()) {
                      try {
                          val lines = ex.getCharSequenceArray(Notification.EXTRA_TEXT_LINES)
                          if (lines != null && lines.isNotEmpty()) {
                              for (i in lines.indices.reversed()) {
                                  val ln = lines[i].toString()
                                  val k = ln.indexOf(": ")
                                  if (k > 0) {
                                      out.add(Item(ln.substring(0, k), ln.substring(k + 2), sbn.postTime, n.contentIntent, sbn))
                                  } else {
                                      out.add(Item(title, ln, sbn.postTime, n.contentIntent, sbn))
                                  }
                                  if (out.size >= 8) break
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
                  if (out.isEmpty() && (title.isNotEmpty() || text.isNotEmpty())) {
                      out.add(Item(title, text, sbn.postTime, n.contentIntent, sbn))
                  }
                  return out
              }

              private fun rowOf(sbn: StatusBarNotification, id: String): Row {
                  val ex = sbn.notification.extras
                  val t = ex.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val x = ex.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  return Row(t, x, colorFor(sbn.packageName), iconOf(sbn), "", id)
              }

              private fun colorFor(pkg: String): Int {
                  return when {
                      pkg.startsWith("com.whatsapp") -> Color.parseColor("#1D9E75")
                      pkg.contains("telegram") -> Color.parseColor("#378ADD")
                      pkg.contains("instagram") -> Color.parseColor("#D4537E")
                      else -> Color.parseColor("#7F77DD")
                  }
              }

              private fun iconOf(sbn: StatusBarNotification): Bitmap? {
                  val ctx = a11y ?: return null
                  try {
                      val ic = sbn.notification.getLargeIcon() ?: return null
                      val d = ic.loadDrawable(ctx) ?: return null
                      val b = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)
                      val cv = Canvas(b)
                      d.setBounds(0, 0, 96, 96)
                      d.draw(cv)
                      return b
                  } catch (e: Exception) {
                      return null
                  }
              }

              // ----------------------------------------------------------- formatting

              private fun timerRemaining(): Long {
                  if (timerEnd <= 0L) return 0L
                  val r = (timerEnd - System.currentTimeMillis() + 500L) / 1000L
                  return if (r > 0L) r else 0L
              }

              private fun fmtSec(s: Long): String {
                  val hh = s / 3600L
                  val mm = (s % 3600L) / 60L
                  val ss = s % 60L
                  return if (hh > 0L) String.format("%d.%02d.%02d", hh, mm, ss) else String.format("%02d.%02d", mm, ss)
              }

              private fun fmtMs(ms: Long): String {
                  val t = ms / 1000L
                  return String.format("%d:%02d", t / 60L, t % 60L)
              }

              private fun nowText(): String {
                  val c = Calendar.getInstance()
                  return String.format("%02d.%02d", c.get(Calendar.HOUR_OF_DAY), c.get(Calendar.MINUTE))
              }

              // --------------------------------------------------------- notifications

              fun onPosted(sbn: StatusBarNotification) {
                  scanNotifs()
                  val ctx = a11y
                  if (ctx != null) {
                      val n = sbn.notification
                      val isGroup = (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0
                      if (Prefs.apps(ctx).contains(sbn.packageName) && !isGroup && !sbn.isOngoing &&
                          n.category != Notification.CATEGORY_CALL
                      ) {
                          val its = itemsOf(sbn)
                          if (its.isNotEmpty()) {
                              val first = its[0]
                              showTransient(
                                  UiState(
                                      Kind.PANEL_NOTIF,
                                      title = first.title,
                                      sub = first.sub,
                                      time = "sekarang",
                                      color = colorFor(sbn.packageName),
                                      bmp = iconOf(sbn)
                                  ), 5000L, n.contentIntent
                              )
                              return
                          }
                      }
                  }
                  render()
              }

              fun onRemoved(sbn: StatusBarNotification) {
                  scanNotifs()
                  render()
              }

              private fun isClock(p: String): Boolean {
                  val s = p.lowercase()
                  return s.contains("deskclock") || s.contains("clock") || s.contains("alarm")
              }

              private fun textOf(n: Notification): String {
                  val ex = n.extras
                  val sb = StringBuilder()
                  val keys = listOf(
                      Notification.EXTRA_TITLE, Notification.EXTRA_TEXT, Notification.EXTRA_SUB_TEXT,
                      Notification.EXTRA_BIG_TEXT, Notification.EXTRA_INFO_TEXT
                  )
                  for (k in keys) {
                      val v = ex.getCharSequence(k)
                      if (v != null) sb.append(v.toString()).append(' ')
                  }
                  return sb.toString()
              }

              private fun parseTimerEnd(n: Notification): Long {
                  val ex = n.extras
                  if (ex.getBoolean(Notification.EXTRA_SHOW_CHRONOMETER) &&
                      ex.getBoolean(Notification.EXTRA_CHRONOMETER_COUNT_DOWN)
                  ) {
                      return n.`when`
                  }
                  val m = timeRe.find(textOf(n)) ?: return 0L
                  val a = m.groupValues[1].toLong()
                  val b = m.groupValues[2].toLong()
                  val c = m.groupValues[3]
                  val secs = if (c.isEmpty()) a * 60L + b else a * 3600L + b * 60L + c.toLong()
                  return if (secs > 0L) System.currentTimeMillis() + secs * 1000L else 0L
              }

              private fun looksLikeTimer(sbn: StatusBarNotification): Boolean {
                  val n = sbn.notification
                  val txt = textOf(n).lowercase()
                  val chan = (n.channelId ?: "").lowercase()
                  if (txt.contains("timer") || txt.contains("pengatur waktu") || txt.contains("hitung mundur") ||
                      txt.contains("countdown") || chan.contains("timer")
                  ) {
                      return true
                  }
                  if (txt.contains("alarm") || chan.contains("alarm")) return false
                  return sbn.isOngoing
              }

              private fun scanNotifs() {
                  val l = listener ?: return
                  val all = try {
                      l.activeNotifications
                  } catch (e: Exception) {
                      null
                  }
                  if (all == null) return
                  var tEnd = 0L
                  var seenTimer = false
                  var ring = false
                  var ci: CallInfo? = null
                  for (sbn in all) {
                      val n = sbn.notification
                      val cat = n.category
                      if (cat == Notification.CATEGORY_CALL) {
                          val c = parseCall(sbn)
                          if (c != null) ci = c
                      } else if (isClock(sbn.packageName) || cat == Notification.CATEGORY_ALARM) {
                          if (n.fullScreenIntent != null) {
                              ring = true
                          } else if (looksLikeTimer(sbn)) {
                              seenTimer = true
                              val e = parseTimerEnd(n)
                              if (e > 0L) tEnd = e
                          }
                      }
                  }
                  if (tEnd > 0L) {
                      timerEnd = tEnd
                  } else if (!seenTimer) {
                      timerEnd = 0L
                  }
                  alarmRinging = ring
                  call = ci
              }

              private fun parseCall(sbn: StatusBarNotification): CallInfo? {
                  val n = sbn.notification
                  val answerWords = listOf("angkat", "jawab", "answer", "accept", "terima")
                  val declineWords = listOf("tolak", "decline", "reject", "abaikan", "dismiss")
                  var ans: PendingIntent? = null
                  var dec: PendingIntent? = null
                  val actions = n.actions
                  if (actions != null) {
                      for (a in actions) {
                          val t = (a.title?.toString() ?: "").lowercase()
                          if (answerWords.any { t.contains(it) }) {
                              ans = a.actionIntent
                          } else if (declineWords.any { t.contains(it) }) {
                              dec = a.actionIntent
                          }
                      }
                  }
                  val incoming = ans != null || n.fullScreenIntent != null
                  if (!incoming) return null
                  val name = n.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: "Panggilan masuk"
                  val open = n.contentIntent ?: n.fullScreenIntent
                  return CallInfo(name, ans, dec, open)
              }

              // ------------------------------------------------------------ transient

              private val clearTransRun = Runnable {
                  trans = null
                  transOpen = null
                  render()
              }

              private fun showTransient(st: UiState, ms: Long, open: PendingIntent?) {
                  if (exp != Exp.NONE) {
                      render()
                      return
                  }
                  trans = st
                  transOpen = open
                  h.removeCallbacks(clearTransRun)
                  h.postDelayed(clearTransRun, ms)
                  render()
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      val act = i.action
                      if (act == Intent.ACTION_POWER_CONNECTED) {
                          val b = c.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          var pct = 0
                          if (b != null) {
                              val lv = b.getIntExtra("level", 0)
                              val sc = b.getIntExtra("scale", 100)
                              pct = lv * 100 / max(1, sc)
                          }
                          showTransient(
                              UiState(
                                  Kind.PILL,
                                  left = Mini(Mini.BOLT),
                                  right = Mini(Mini.TEXT, pct.toString() + "%", color = TEAL)
                              ), 3500L, null
                          )
                      } else if (act == BluetoothDevice.ACTION_ACL_CONNECTED) {
                          var name = "Bluetooth"
                          try {
                              val d = i.getParcelableExtra<BluetoothDevice>(BluetoothDevice.EXTRA_DEVICE)
                              val n = d?.name
                              if (n != null) name = n
                          } catch (e: Exception) {
                          }
                          showTransient(
                              UiState(
                                  Kind.PILL,
                                  left = Mini(Mini.BT),
                                  right = Mini(Mini.TEXT, name, color = Color.WHITE)
                              ), 4000L, null
                          )
                      }
                  }
              }

              // ---------------------------------------------------------------- media

              private fun isBlockedPkg(p: String): Boolean {
                  val s = p.lowercase()
                  return s == "id.cames.notch" || s.contains("record") || s.contains("screen") ||
                          s.contains("capture") || s.contains("smartshot")
              }

              private val mediaCb = object : MediaController.Callback() {
                  override fun onPlaybackStateChanged(state: PlaybackState?) {
                      pickMedia()
                      render()
                  }

                  override fun onMetadataChanged(metadata: MediaMetadata?) {
                      render()
                  }

                  override fun onSessionDestroyed() {
                      updateSessions()
                  }
              }

              private val sessionsListener = MediaSessionManager.OnActiveSessionsChangedListener { list ->
                  applySessions(list ?: emptyList<MediaController>())
              }

              private fun applySessions(list: List<MediaController>) {
                  for (c in sessions) {
                      try {
                          c.unregisterCallback(mediaCb)
                      } catch (e: Exception) {
                      }
                  }
                  sessions = list.filter { !isBlockedPkg(it.packageName) }
                  for (c in sessions) {
                      try {
                          c.registerCallback(mediaCb, h)
                      } catch (e: Exception) {
                      }
                  }
                  pickMedia()
                  render()
              }

              private fun updateSessions() {
                  val m = mgr ?: return
                  val l = listener ?: return
                  val cn = ComponentName(l, NotchListener::class.java)
                  val list = try {
                      m.getActiveSessions(cn)
                  } catch (e: Exception) {
                      emptyList<MediaController>()
                  }
                  applySessions(list)
              }

              private fun pickMedia() {
                  val playing = sessions.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                  if (playing != null) {
                      media = playing
                      return
                  }
                  val old = media
                  if (old != null && sessions.any { it.sessionToken == old.sessionToken }) return
                  media = sessions.firstOrNull()
              }

              // ---------------------------------------------------------------- torch

              private val torchCb = object : CameraManager.TorchCallback() {
                  override fun onTorchModeChanged(cameraId: String, enabled: Boolean) {
                      if (cameraId == torchId) {
                          torchOn = enabled
                          if (exp == Exp.QUICK) render()
                      }
                  }
              }

              private fun initTorch(c: Context) {
                  try {
                      val cm = c.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      for (id in cm.cameraIdList) {
                          val ch = cm.getCameraCharacteristics(id)
                          val flash = ch.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          val back = ch.get(CameraCharacteristics.LENS_FACING) == CameraCharacteristics.LENS_FACING_BACK
                          if (flash && back) {
                              torchId = id
                              break
                          }
                      }
                      if (!torchRegistered) {
                          cm.registerTorchCallback(torchCb, h)
                          torchRegistered = true
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun toggleTorch() {
                  val c = a11y ?: return
                  val id = torchId ?: return
                  try {
                      val cm = c.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      cm.setTorchMode(id, !torchOn)
                  } catch (e: Exception) {
                  }
              }

              // -------------------------------------------------------------- gestures

              private val collapseRun = Runnable {
                  exp = Exp.NONE
                  render()
              }

              private fun setExp(e: Exp) {
                  exp = e
                  h.removeCallbacks(collapseRun)
                  if (e != Exp.NONE) h.postDelayed(collapseRun, 8000L)
                  view?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                  render()
              }

              override fun onActive() {
                  if (exp != Exp.NONE) {
                      h.removeCallbacks(collapseRun)
                      h.postDelayed(collapseRun, 8000L)
                  }
              }

              override fun onTapEmpty() {
                  if (exp != Exp.NONE) return
                  if (trans != null || call != null || alarmRinging) return
                  val a = acts()
                  if (a.size >= 2) {
                      setExp(Exp.ACTS)
                  } else if (a.size == 1 && a[0].type == 0) {
                      setExp(Exp.MUSIC)
                  }
              }

              override fun onLongPress(left: Boolean) {
                  if (exp != Exp.NONE) return
                  setExp(if (left) Exp.NOTIFS else Exp.QUICK)
              }

              override fun onSwipe(dir: Int) {
                  if (exp != Exp.NONE) return
                  if (acts().size >= 2) {
                      actIdx += dir
                      view?.nudge(dir)
                      view?.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                      render()
                  }
              }

              override fun onClose() {
                  exp = Exp.NONE
                  trans = null
                  transOpen = null
                  h.removeCallbacks(collapseRun)
                  h.removeCallbacks(clearTransRun)
                  render()
              }

              private fun send(pi: PendingIntent?) {
                  try {
                      pi?.send()
                  } catch (e: Exception) {
                  }
              }

              override fun onAction(id: String, frac: Float) {
                  val m = media
                  if (id == "prev") {
                      m?.transportControls?.skipToPrevious()
                  } else if (id == "next") {
                      m?.transportControls?.skipToNext()
                  } else if (id == "toggle") {
                      val tc = m?.transportControls
                      if (m?.playbackState?.state == PlaybackState.STATE_PLAYING) tc?.pause() else tc?.play()
                  } else if (id == "seek") {
                      val dur = m?.metadata?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
                      if (dur > 0L) m?.transportControls?.seekTo((dur * frac).toLong())
                  } else if (id == "answer") {
                      send(call?.answer ?: call?.open)
                  } else if (id == "decline") {
                      send(call?.decline)
                  } else if (id == "notif") {
                      send(transOpen)
                      onClose()
                      return
                  } else if (id == "music") {
                      setExp(Exp.MUSIC)
                      return
                  } else if (id.startsWith("n:")) {
                      val idx = id.substring(2).toIntOrNull() ?: -1
                      if (idx >= 0 && idx < itemList.size) send(itemList[idx].pi)
                      onClose()
                      return
                  } else if (id == "torch") {
                      toggleTorch()
                  } else if (id == "power") {
                      try {
                          a11y?.performGlobalAction(AccessibilityService.GLOBAL_ACTION_POWER_DIALOG)
                      } catch (e: Exception) {
                      }
                      onClose()
                      return
                  } else if (id == "vol") {
                      val c = a11y
                      if (c != null) {
                          val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          val mx = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, (frac * mx).roundToInt(), 0)
                      }
                  }
                  render()
              }
          }
