          cat > 'app/src/main/java/id/cames/notch/NotchView.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.text.TextPaint
          import android.text.TextUtils
          import android.view.Choreographer
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.VelocityTracker
          import android.view.View
          import android.view.ViewConfiguration
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.exp
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          import kotlin.math.sin

          private val C_GRAY = Color.parseColor("#B4B2A9")
          private val C_DARK = Color.parseColor("#2C2C2A")
          private val C_TRACK = Color.parseColor("#444441")
          private val C_ORANGE = Color.parseColor("#EF9F27")
          private val C_AMBER = Color.parseColor("#FFC94D")
          private val C_GREEN = Color.parseColor("#1D9E75")
          private val C_RED = Color.parseColor("#E24B4A")
          private val C_RED_DARK = Color.parseColor("#4A2321")
          private val C_RED_TEXT = Color.parseColor("#FF8F89")
          private val C_TEAL = Color.parseColor("#5DCAA5")
          private val C_SKY = Color.parseColor("#85B7EB")

          private const val ROW = 36f

          class NotchView(ctx: Context, private val host: Host) : View(ctx) {

              interface Host {
                  fun onAction(id: String, frac: Float)
                  fun onTapEmpty()
                  fun onLongPress(left: Boolean)
                  fun onSwipe(dir: Int)
                  fun onClose()
                  fun onActive()
                  fun onSettled()
              }

              private class Hit(
                  val id: String,
                  val r: RectF,
                  val tl: Float = 0f,
                  val tw: Float = 0f,
                  val scroll: Boolean = false
              )

              private var u = 2f
              private var collapsedW = 236f
              private var collapsedH = 52f
              private var panelW = 648f

              private var state: UiState? = null

              // springs: 0 = lebar leher/pil, 1 = tinggi panel, 2 = lebar panel, 3 = efek tekan
              private val cur = FloatArray(4)
              private val vel = FloatArray(4)
              private val tgt = FloatArray(4)

              private var modeKey = -1
              private var contentAlpha = 1f
              private var contentDelay = 0f
              private var slide = 0f
              private var scrollY = 0f
              private var flingV = 0f

              private var running = false
              private var holding = false
              private var pendingStart = false
              private var holdW = 0
              private var holdH = 0
              private var lastFrame = 0L
              private var barsRunning = false

              private val hits = ArrayList<Hit>()
              private val listClip = RectF()
              private val slop = ViewConfiguration.get(ctx).scaledTouchSlop

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG)
              private val tp = TextPaint(Paint.ANTI_ALIAS_FLAG)
              private val bmpPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val path = Path()
              private val rect = RectF()
              private val src = Rect()

              private var downX = 0f
              private var downY = 0f
              private var moved = false
              private var longFired = false
              private var scrolling = false
              private var inList = false
              private var startScroll = 0f
              private var downHit: Hit? = null
              private var tracker: VelocityTracker? = null

              private val springK = 240f
              private val springC = 24f

              init {
                  stroke.style = Paint.Style.STROKE
                  stroke.strokeCap = Paint.Cap.ROUND
                  stroke.strokeJoin = Paint.Join.ROUND
              }

              // ------------------------------------------------------------ geometry

              fun configure(unit: Float, nw: Float, nh: Float, pw: Float) {
                  u = unit
                  collapsedW = nw
                  collapsedH = nh
                  panelW = pw
                  val s = state
                  if (s != null) {
                      targetsFor(s)
                      for (i in 0..2) {
                          cur[i] = tgt[i]
                          vel[i] = 0f
                      }
                      invalidate()
                  }
              }

              private fun isPanel(s: UiState): Boolean = s.kind != Kind.IDLE && s.kind != Kind.PILL

              private fun viewportH(s: UiState): Float = min(s.rows.size.toFloat(), 4.5f) * ROW * u

              private fun panelH(s: UiState): Float = when (s.kind) {
                  Kind.PANEL_NOTIF -> 58f * u
                  Kind.PANEL_CALL -> 96f * u
                  Kind.PANEL_MUSIC -> 126f * u
                  Kind.PANEL_LIST, Kind.PANEL_NOTIFS ->
                      if (s.rows.isEmpty()) 66f * u else 18f * u + viewportH(s) + 8f * u
                  Kind.PANEL_QUICK -> 124f * u
                  else -> 0f
              }

              private fun maxScroll(): Float {
                  val s = state ?: return 0f
                  if (s.kind != Kind.PANEL_NOTIFS && s.kind != Kind.PANEL_LIST) return 0f
                  return max(0f, s.rows.size * ROW * u - viewportH(s))
              }

              private fun targetsFor(s: UiState) {
                  if (isPanel(s)) {
                      tgt[0] = collapsedW
                      tgt[1] = panelH(s)
                      tgt[2] = panelW
                  } else {
                      tgt[0] = if (s.kind == Kind.PILL) collapsedW + 10f * u else collapsedW
                      tgt[1] = 0f
                      tgt[2] = collapsedW
                  }
              }

              fun smallW(): Int = ceil(collapsedW + 10f * u + 44f * u).toInt()
              fun smallH(): Int = ceil(collapsedH + 24f * u).toInt()
              fun bigW(): Int = ceil(panelW + 12f * u).toInt()
              fun bigH(): Int = ceil(collapsedH + 200f * u + 12f * u).toInt()

              fun tightW(s: UiState): Int = if (isPanel(s)) ceil(panelW + 8f * u).toInt() else smallW()
              fun tightH(s: UiState): Int =
                  if (isPanel(s)) ceil(collapsedH + panelH(s) + 8f * u).toInt() else smallH()

              fun restW(): Int {
                  val s = state ?: return smallW()
                  return tightW(s)
              }

              fun restH(): Int {
                  val s = state ?: return smallH()
                  return tightH(s)
              }

              private fun keyOf(s: UiState): Int {
                  return s.kind.ordinal * 10000 + (s.left?.type ?: 9) * 100 + (s.right?.type ?: 9) * 10
              }

              private fun needsAnim(s: UiState): Boolean {
                  return s.left?.type == Mini.BARS || s.right?.type == Mini.BARS || s.left?.type == Mini.ALARM
              }

              // --------------------------------------------------------------- state

              fun hold(w: Int, h: Int) {
                  holding = true
                  holdW = w
                  holdH = h
                  removeCallbacks(releaseRun)
                  postDelayed(releaseRun, 140L)
              }

              private val releaseRun = Runnable { release() }

              private fun release() {
                  if (holding) {
                      holding = false
                      removeCallbacks(releaseRun)
                      if (pendingStart) {
                          pendingStart = false
                          startLoop()
                      }
                  }
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  if (holding && w >= holdW && h >= holdH) {
                      postOnAnimation { release() }
                  }
              }

              fun nudge(dir: Int) {
                  slide = dir * 16f * u
                  startLoop()
              }

              fun setState(s: UiState) {
                  val first = state == null
                  state = s
                  targetsFor(s)
                  val ms = maxScroll()
                  if (scrollY > ms) scrollY = ms
                  if (first) {
                      for (i in 0..2) {
                          cur[i] = tgt[i]
                          vel[i] = 0f
                      }
                      cur[3] = 0f
                  }
                  val k = keyOf(s)
                  if (k != modeKey) {
                      modeKey = k
                      if (!first) {
                          contentAlpha = 0f
                          contentDelay = 0.05f
                          scrollY = 0f
                          flingV = 0f
                      }
                  }
                  startLoop()
                  startBars()
                  invalidate()
              }

              // ----------------------------------------------------------- animation

              private fun startLoop() {
                  if (holding) {
                      pendingStart = true
                      return
                  }
                  if (!running) {
                      running = true
                      lastFrame = 0L
                      Choreographer.getInstance().postFrameCallback(frame)
                  }
              }

              private val frame = object : Choreographer.FrameCallback {
                  override fun doFrame(frameTimeNanos: Long) {
                      if (lastFrame == 0L) {
                          lastFrame = frameTimeNanos
                          Choreographer.getInstance().postFrameCallback(this)
                          return
                      }
                      var dt = (frameTimeNanos - lastFrame) / 1_000_000_000f
                      lastFrame = frameTimeNanos
                      if (dt > 0.05f) dt = 0.05f
                      if (dt < 0.001f) dt = 0.001f

                      var moving = false
                      val sub = 4
                      val h = dt / sub
                      for (i in 0..3) {
                          for (n in 0 until sub) {
                              val a = springK * (tgt[i] - cur[i]) - springC * vel[i]
                              vel[i] += a * h
                              cur[i] += vel[i] * h
                          }
                          val eps = if (i == 3) 0.003f else 0.35f
                          val epsV = if (i == 3) 0.02f else 1f
                          if (abs(vel[i]) > epsV || abs(tgt[i] - cur[i]) > eps) {
                              moving = true
                          } else {
                              cur[i] = tgt[i]
                              vel[i] = 0f
                          }
                      }

                      if (abs(flingV) > 25f) {
                          scrollY += flingV * dt
                          val ms = maxScroll()
                          if (scrollY < 0f) {
                              scrollY = 0f
                              flingV = 0f
                          } else if (scrollY > ms) {
                              scrollY = ms
                              flingV = 0f
                          } else {
                              flingV *= exp(-dt * 3.2f)
                          }
                          moving = true
                      } else {
                          flingV = 0f
                      }

                      if (abs(slide) > 0.4f) {
                          slide *= exp(-dt * 11f)
                          moving = true
                      } else {
                          slide = 0f
                      }

                      if (contentDelay > 0f) {
                          contentDelay -= dt
                          moving = true
                      } else if (contentAlpha < 1f) {
                          contentAlpha = min(1f, contentAlpha + dt / 0.2f)
                          moving = true
                      }

                      invalidate()
                      if (moving) {
                          Choreographer.getInstance().postFrameCallback(this)
                      } else {
                          running = false
                          lastFrame = 0L
                          host.onSettled()
                      }
                  }
              }

              private val barsRun = object : Runnable {
                  override fun run() {
                      val s = state
                      if (s != null && needsAnim(s) && isAttachedToWindow) {
                          invalidate()
                          postDelayed(this, 50L)
                      } else {
                          barsRunning = false
                      }
                  }
              }

              private fun startBars() {
                  val s = state ?: return
                  if (needsAnim(s) && !barsRunning) {
                      barsRunning = true
                      postDelayed(barsRun, 50L)
                  }
              }

              override fun onDetachedFromWindow() {
                  Choreographer.getInstance().removeFrameCallback(frame)
                  removeCallbacks(barsRun)
                  removeCallbacks(longRun)
                  removeCallbacks(releaseRun)
                  running = false
                  barsRunning = false
                  holding = false
                  super.onDetachedFromWindow()
              }

              // ------------------------------------------------------------- drawing

              private fun alphaFor(s: UiState): Float {
                  var a = contentAlpha
                  if (isPanel(s)) {
                      val t = tgt[1]
                      val p = if (t > 0f) max(0f, min(1f, cur[1] / t)) else 1f
                      val g = max(0f, min(1f, (p - 0.5f) / 0.4f))
                      a = min(a, g)
                  }
                  return a
              }

              override fun onDraw(c: Canvas) {
                  val s = state ?: return
                  hits.clear()
                  listClip.setEmpty()
                  val cx = width / 2f
                  val py = collapsedH
                  val nw = max(0f, cur[0])
                  val ph = max(0f, cur[1])
                  val pw = max(nw, cur[2])

                  val outer = c.save()
                  if (ph < 1f && cur[3] > 0.001f) {
                      val sc = 1f + 0.04f * cur[3]
                      c.scale(sc, sc, cx, 0f)
                  }
                  if (s.left?.type == Mini.ALARM) {
                      val t = System.currentTimeMillis() / 1000f
                      c.translate(sin(t * 38f) * 1.4f * u, 0f)
                  }

                  fill.color = Color.BLACK
                  val neckH = if (ph > 0.5f) py + min(ph, 14f * u) else py
                  val nl = cx - nw / 2f
                  val nr = cx + nw / 2f
                  val r = min(14f * u, neckH / 2f)
                  rect.set(nl, -neckH, nr, neckH)
                  c.drawRoundRect(rect, r, r, fill)

                  if (ph > 0.5f) {
                      val pl = cx - pw / 2f
                      val pr = cx + pw / 2f
                      val rp = min(22f * u, min(ph / 2f, pw / 2f))
                      rect.set(pl, py, pr, py + ph)
                      c.drawRoundRect(rect, rp, rp, fill)

                      val f = min(20f * u, min(ph / 2.2f, (pw - nw) / 2f - 0.5f))
                      if (f > 1f) {
                          path.reset()
                          path.moveTo(nl - f, py)
                          path.lineTo(nl, py)
                          path.lineTo(nl, py - f)
                          rect.set(nl - 2f * f, py - 2f * f, nl, py)
                          path.arcTo(rect, 0f, 90f)
                          path.close()
                          c.drawPath(path, fill)

                          path.reset()
                          path.moveTo(nr + f, py)
                          path.lineTo(nr, py)
                          path.lineTo(nr, py - f)
                          rect.set(nr, py - 2f * f, nr + 2f * f, py)
                          path.arcTo(rect, 180f, -90f)
                          path.close()
                          c.drawPath(path, fill)
                      }
                  }

                  val a = alphaFor(s)
                  if (s.kind != Kind.IDLE && a > 0.01f) {
                      var layer = -1
                      if (a < 0.995f) {
                          layer = c.saveLayerAlpha(0f, 0f, width.toFloat(), height.toFloat(), (255f * a).roundToInt())
                      }
                      val sv = c.save()
                      if (s.kind == Kind.PILL) c.translate(slide, 0f)
                      drawContent(c, s, cx)
                      c.restoreToCount(sv)
                      if (layer >= 0) c.restoreToCount(layer)
                  }
                  c.restoreToCount(outer)
              }

              private fun drawContent(c: Canvas, s: UiState, cx: Float) {
                  when (s.kind) {
                      Kind.PILL -> drawPill(c, s, cx)
                      Kind.PANEL_NOTIF -> drawNotif(c, s, cx)
                      Kind.PANEL_CALL -> drawCall(c, s, cx)
                      Kind.PANEL_MUSIC -> drawMusic(c, s, cx)
                      Kind.PANEL_LIST -> drawRows(c, s, cx, "Tidak ada aktivitas")
                      Kind.PANEL_NOTIFS -> drawRows(c, s, cx, "Tidak ada notifikasi")
                      Kind.PANEL_QUICK -> drawQuick(c, s, cx)
                      else -> {
                      }
                  }
              }

              private fun text(
                  c: Canvas, s: String, x: Float, y: Float, size: Float, color: Int,
                  bold: Boolean = false, align: Paint.Align = Paint.Align.LEFT,
                  maxW: Float = 0f, shrink: Boolean = false
              ) {
                  tp.color = color
                  tp.textAlign = align
                  tp.typeface = if (bold) Typeface.DEFAULT_BOLD else Typeface.DEFAULT
                  tp.textSize = size * u
                  var str = s
                  if (maxW > 0f) {
                      val w = tp.measureText(str)
                      if (w > maxW) {
                          if (shrink) {
                              tp.textSize = max(size * u * maxW / w, 7f * u)
                          }
                          if (tp.measureText(str) > maxW) {
                              str = TextUtils.ellipsize(str, tp, maxW, TextUtils.TruncateAt.END).toString()
                          }
                      }
                  }
                  c.drawText(str, x, y, tp)
              }

              private fun drawBmp(c: Canvas, bmp: Bitmap, l: Float, t: Float, r: Float, b: Float, rad: Float) {
                  path.reset()
                  rect.set(l, t, r, b)
                  path.addRoundRect(rect, rad, rad, Path.Direction.CW)
                  val sv = c.save()
                  c.clipPath(path)
                  src.set(0, 0, bmp.width, bmp.height)
                  c.drawBitmap(bmp, src, rect, bmpPaint)
                  c.restoreToCount(sv)
              }

              private fun avatar(c: Canvas, bmp: Bitmap?, color: Int, label: String, cx: Float, cy: Float, r: Float) {
                  if (bmp != null) {
                      drawBmp(c, bmp, cx - r, cy - r, cx + r, cy + r, r)
                  } else {
                      fill.color = color
                      c.drawCircle(cx, cy, r, fill)
                      val ch = if (label.isNotEmpty()) label.substring(0, 1).uppercase() else "?"
                      text(c, ch, cx, cy + 4.5f * u, 12f, Color.WHITE, true, Paint.Align.CENTER)
                  }
              }

              private fun button(c: Canvas, label: String, color: Int, l: Float, t: Float, r: Float, b: Float, id: String) {
                  fill.color = color
                  rect.set(l, t, r, b)
                  c.drawRoundRect(rect, (b - t) / 2f, (b - t) / 2f, fill)
                  text(c, label, (l + r) / 2f, (t + b) / 2f + 4.5f * u, 12f, Color.WHITE, true, Paint.Align.CENTER)
                  hits.add(Hit(id, RectF(l, t, r, b)))
              }

              private fun drawBt(c: Canvas, x: Float, y: Float, k: Float, color: Int, w: Float) {
                  stroke.color = color
                  stroke.strokeWidth = w
                  path.reset()
                  path.moveTo(x - 5f * k, y - 5f * k)
                  path.lineTo(x + 5f * k, y + 5f * k)
                  path.lineTo(x, y + 10f * k)
                  path.lineTo(x, y - 10f * k)
                  path.lineTo(x + 5f * k, y - 5f * k)
                  path.lineTo(x - 5f * k, y + 5f * k)
                  c.drawPath(path, stroke)
              }

              private fun drawMini(c: Canvas, m: Mini, x: Float, cy: Float, maxW: Float) {
                  when (m.type) {
                      Mini.ART -> {
                          val hh = 14f * u
                          val b = m.bmp
                          if (b != null) {
                              drawBmp(c, b, x - hh / 2f, cy - hh / 2f, x + hh / 2f, cy + hh / 2f, 3.5f * u)
                          } else {
                              fill.color = m.color
                              rect.set(x - hh / 2f, cy - hh / 2f, x + hh / 2f, cy + hh / 2f)
                              c.drawRoundRect(rect, 3.5f * u, 3.5f * u, fill)
                          }
                      }
                      Mini.BARS -> {
                          val t = System.currentTimeMillis() / 1000f
                          for (i in 0..2) {
                              val hh = (0.35f + 0.65f * abs(sin(t * 4.2f + i * 1.7f))) * 12f * u
                              val bx = x + 4f * u + i * 6f * u
                              fill.color = C_TEAL
                              rect.set(bx, cy - hh / 2f, bx + 3f * u, cy + hh / 2f)
                              c.drawRoundRect(rect, 1.5f * u, 1.5f * u, fill)
                          }
                      }
                      Mini.BOLT -> {
                          path.reset()
                          path.moveTo(x + 2.5f * u, cy - 8f * u)
                          path.lineTo(x - 6.5f * u, cy + 1f * u)
                          path.lineTo(x - 1.5f * u, cy + 1f * u)
                          path.lineTo(x - 3.5f * u, cy + 8f * u)
                          path.lineTo(x + 6.5f * u, cy - 2f * u)
                          path.lineTo(x + 1.5f * u, cy - 2f * u)
                          path.close()
                          fill.color = C_TEAL
                          c.drawPath(path, fill)
                      }
                      Mini.BT -> drawBt(c, x, cy, u, C_SKY, 1.5f * u)
                      Mini.ALARM -> {
                          stroke.color = C_ORANGE
                          stroke.strokeWidth = 1.5f * u
                          c.drawCircle(x, cy, 6f * u, stroke)
                          path.reset()
                          path.moveTo(x, cy - 3.5f * u)
                          path.lineTo(x, cy)
                          path.lineTo(x + 3f * u, cy)
                          c.drawPath(path, stroke)
                      }
                      Mini.RING -> {
                          stroke.color = C_ORANGE
                          stroke.strokeWidth = 2f * u
                          c.drawCircle(x, cy, 6f * u, stroke)
                      }
                      else -> text(c, m.text, x, cy + 4f * u, 11f, m.color, true, Paint.Align.LEFT, maxW, true)
                  }
              }

              private fun drawPill(c: Canvas, s: UiState, cx: Float) {
                  val w = tgt[0]
                  val cy = collapsedH / 2f
                  val l = s.left
                  val r = s.right
                  if (l != null) drawMini(c, l, cx - w / 2f + 15f * u, cy, 0f)
                  if (r != null) drawMini(c, r, cx + 16f * u, cy, w / 2f - 16f * u - 7f * u)
                  if (s.dots > 1) {
                      for (i in 0 until s.dots) {
                          fill.color = Color.WHITE
                          fill.alpha = if (i == s.dotIdx) 255 else 100
                          c.drawCircle(cx + (i - (s.dots - 1) / 2f) * 10f * u, collapsedH + 9f * u, 2.6f * u, fill)
                      }
                      fill.alpha = 255
                  }
              }

              private fun drawNotif(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = collapsedH
                  avatar(c, s.bmp, s.color, s.title, x0 + 28f * u, top + 30f * u, 14f * u)
                  text(c, s.title, x0 + 52f * u, top + 27f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 140f * u)
                  text(c, s.sub, x0 + 52f * u, top + 43f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 74f * u)
                  text(c, s.time, x0 + panelW - 20f * u, top + 27f * u, 11f, C_GRAY, false, Paint.Align.RIGHT)
                  hits.add(Hit("notif", RectF(x0, top, x0 + panelW, top + panelH(s))))
              }

              private fun drawCall(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = collapsedH
                  avatar(c, null, Color.parseColor("#7F77DD"), s.title, x0 + 28f * u, top + 30f * u, 16f * u)
                  text(c, s.title, x0 + 54f * u, top + 28f * u, 14f, Color.WHITE, true, Paint.Align.LEFT, panelW - 74f * u)
                  text(c, "Panggilan masuk", x0 + 54f * u, top + 44f * u, 11f, C_GRAY)
                  button(c, "Tolak", C_RED, x0 + 18f * u, top + 60f * u, x0 + 158f * u, top + 86f * u, "decline")
                  button(c, "Angkat", C_GREEN, x0 + 166f * u, top + 60f * u, x0 + 306f * u, top + 86f * u, "answer")
              }

              private fun drawMusic(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = collapsedH
                  val b = s.bmp
                  if (b != null) {
                      drawBmp(c, b, x0 + 18f * u, top + 20f * u, x0 + 58f * u, top + 60f * u, 8f * u)
                  } else {
                      fill.color = s.color
                      rect.set(x0 + 18f * u, top + 20f * u, x0 + 58f * u, top + 60f * u)
                      c.drawRoundRect(rect, 8f * u, 8f * u, fill)
                  }
                  text(c, s.title, x0 + 68f * u, top + 37f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 90f * u)
                  text(c, s.sub, x0 + 68f * u, top + 53f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 90f * u)

                  val tl = x0 + 18f * u
                  val tw = panelW - 36f * u
                  fill.color = C_TRACK
                  rect.set(tl, top + 72f * u, tl + tw, top + 76f * u)
                  c.drawRoundRect(rect, 2f * u, 2f * u, fill)
                  fill.color = Color.WHITE
                  rect.set(tl, top + 72f * u, tl + tw * max(0f, min(1f, s.progress)), top + 76f * u)
                  c.drawRoundRect(rect, 2f * u, 2f * u, fill)
                  hits.add(Hit("seek", RectF(tl, top + 62f * u, tl + tw, top + 86f * u), tl, tw))
                  text(c, s.posText, tl, top + 91f * u, 11f, C_GRAY)
                  text(c, s.durText, tl + tw, top + 91f * u, 11f, C_GRAY, false, Paint.Align.RIGHT)

                  val cy = top + 108f * u
                  fill.color = Color.WHITE

                  val px = cx - 38f * u
                  rect.set(px - 7f * u, cy - 7f * u, px - 4.5f * u, cy + 7f * u)
                  c.drawRect(rect, fill)
                  path.reset()
                  path.moveTo(px + 6f * u, cy - 7f * u)
                  path.lineTo(px + 6f * u, cy + 7f * u)
                  path.lineTo(px - 4f * u, cy)
                  path.close()
                  c.drawPath(path, fill)
                  hits.add(Hit("prev", RectF(px - 18f * u, cy - 18f * u, px + 18f * u, cy + 18f * u)))

                  if (s.playing) {
                      rect.set(cx - 6f * u, cy - 9f * u, cx - 2f * u, cy + 9f * u)
                      c.drawRect(rect, fill)
                      rect.set(cx + 2f * u, cy - 9f * u, cx + 6f * u, cy + 9f * u)
                      c.drawRect(rect, fill)
                  } else {
                      path.reset()
                      path.moveTo(cx - 6f * u, cy - 9f * u)
                      path.lineTo(cx - 6f * u, cy + 9f * u)
                      path.lineTo(cx + 8f * u, cy)
                      path.close()
                      c.drawPath(path, fill)
                  }
                  hits.add(Hit("toggle", RectF(cx - 20f * u, cy - 20f * u, cx + 20f * u, cy + 20f * u)))

                  val nx = cx + 38f * u
                  path.reset()
                  path.moveTo(nx - 6f * u, cy - 7f * u)
                  path.lineTo(nx - 6f * u, cy + 7f * u)
                  path.lineTo(nx + 4f * u, cy)
                  path.close()
                  c.drawPath(path, fill)
                  rect.set(nx + 4.5f * u, cy - 7f * u, nx + 7f * u, cy + 7f * u)
                  c.drawRect(rect, fill)
                  hits.add(Hit("next", RectF(nx - 18f * u, cy - 18f * u, nx + 18f * u, cy + 18f * u)))
              }

              private fun drawRows(c: Canvas, s: UiState, cx: Float, empty: String) {
                  val x0 = cx - panelW / 2f
                  val top = collapsedH
                  if (s.rows.isEmpty()) {
                      text(c, empty, cx, top + 42f * u, 12f, C_GRAY, false, Paint.Align.CENTER)
                      return
                  }
                  val vp = viewportH(s)
                  val clipT = top + 18f * u
                  val clipB = clipT + vp
                  listClip.set(x0, clipT, x0 + panelW, clipB)
                  val sv = c.save()
                  c.clipRect(x0, clipT, x0 + panelW, clipB)
                  for (i in s.rows.indices) {
                      val row = s.rows[i]
                      val rt = clipT + i * ROW * u - scrollY
                      if (rt > clipB || rt + ROW * u < clipT) continue
                      if (i > 0) {
                          fill.color = C_DARK
                          rect.set(x0 + 18f * u, rt, x0 + panelW - 18f * u, rt + 1f * u)
                          c.drawRect(rect, fill)
                      }
                      avatar(c, row.bmp, row.color, row.title, x0 + 32f * u, rt + 18f * u, 12f * u)
                      val rightW = if (row.right.isNotEmpty()) 64f * u else 0f
                      text(c, row.title, x0 + 52f * u, rt + 16f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 72f * u - rightW)
                      text(c, row.sub, x0 + 52f * u, rt + 31f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 72f * u - rightW)
                      if (row.right.isNotEmpty()) {
                          text(c, row.right, x0 + panelW - 20f * u, rt + 23f * u, 14f, C_ORANGE, true, Paint.Align.RIGHT)
                      }
                      hits.add(Hit(row.id, RectF(x0, rt, x0 + panelW, rt + ROW * u), 0f, 0f, true))
                  }
                  c.restoreToCount(sv)
                  val ms = maxScroll()
                  if (ms > 0f) {
                      val trackH = vp - 8f * u
                      val barH = max(16f * u, trackH * vp / (s.rows.size * ROW * u))
                      val by = clipT + 4f * u + (trackH - barH) * (scrollY / ms)
                      fill.color = C_TRACK
                      rect.set(x0 + panelW - 8f * u, by, x0 + panelW - 6f * u, by + barH)
                      c.drawRoundRect(rect, 1f * u, 1f * u, fill)
                  }
              }

              private fun drawQuick(c: Canvas, s: UiState, cx: Float) {
                  val x0 = cx - panelW / 2f
                  val top = collapsedH

                  val bt = top + 20f * u
                  val bb = top + 64f * u

                  // Senter
                  val tl1 = x0 + 18f * u
                  val tr1 = x0 + 158f * u
                  fill.color = if (s.torch) C_AMBER else C_DARK
                  rect.set(tl1, bt, tr1, bb)
                  c.drawRoundRect(rect, 18f * u, 18f * u, fill)
                  val fg = if (s.torch) Color.parseColor("#2B2100") else Color.WHITE
                  val my = (bt + bb) / 2f
                  stroke.color = fg
                  stroke.strokeWidth = 2f * u
                  c.drawCircle(tl1 + 26f * u, my - 3f * u, 6.5f * u, stroke)
                  fill.color = fg
                  rect.set(tl1 + 23f * u, my + 4f * u, tl1 + 29f * u, my + 10f * u)
                  c.drawRect(rect, fill)
                  text(c, "Senter", tl1 + 44f * u, my + 4.5f * u, 13f, fg, true)
                  hits.add(Hit("torch", RectF(tl1, bt, tr1, bb)))

                  // Matikan HP
                  val tl2 = x0 + 166f * u
                  val tr2 = x0 + 306f * u
                  fill.color = C_RED_DARK
                  rect.set(tl2, bt, tr2, bb)
                  c.drawRoundRect(rect, 18f * u, 18f * u, fill)
                  stroke.color = C_RED_TEXT
                  stroke.strokeWidth = 2f * u
                  val pcx = tl2 + 26f * u
                  rect.set(pcx - 8f * u, my - 8f * u, pcx + 8f * u, my + 8f * u)
                  c.drawArc(rect, -60f, 300f, false, stroke)
                  c.drawLine(pcx, my - 10f * u, pcx, my - 1f * u, stroke)
                  text(c, "Matikan HP", tl2 + 44f * u, my + 4.5f * u, 13f, C_RED_TEXT, true)
                  hits.add(Hit("power", RectF(tl2, bt, tr2, bb)))

                  // Volume
                  val tl = x0 + 18f * u
                  val tw = panelW - 36f * u
                  text(c, "Volume", tl, top + 86f * u, 11f, C_GRAY)
                  val pct = (max(0f, min(1f, s.volume)) * 100f).roundToInt()
                  text(c, pct.toString() + "%", tl + tw, top + 86f * u, 11f, Color.WHITE, true, Paint.Align.RIGHT)
                  fill.color = C_TRACK
                  rect.set(tl, top + 96f * u, tl + tw, top + 106f * u)
                  c.drawRoundRect(rect, 5f * u, 5f * u, fill)
                  val fx = tl + tw * max(0f, min(1f, s.volume))
                  fill.color = Color.WHITE
                  rect.set(tl, top + 96f * u, max(tl + 10f * u, fx), top + 106f * u)
                  c.drawRoundRect(rect, 5f * u, 5f * u, fill)
                  hits.add(Hit("vol", RectF(tl - 8f * u, top + 88f * u, tl + tw + 8f * u, top + 116f * u), tl, tw))
              }

              // --------------------------------------------------------------- touch

              private fun hitAt(x: Float, y: Float): Hit? {
                  for (i in hits.indices.reversed()) {
                      val h = hits[i]
                      if (h.scroll && !listClip.contains(x, y)) continue
                      if (h.r.contains(x, y)) return h
                  }
                  return null
              }

              private fun isSlider(h: Hit?): Boolean = h != null && h.tw > 0f

              private fun slider(x: Float, last: Boolean) {
                  val h = downHit ?: return
                  if (h.tw <= 0f) return
                  val f = max(0f, min(1f, (x - h.tl) / h.tw))
                  if (h.id == "vol") {
                      host.onAction("vol", f)
                  } else if (last) {
                      host.onAction("seek", f)
                  }
              }

              private fun press(on: Boolean) {
                  val s = state ?: return
                  if (s.kind != Kind.IDLE && s.kind != Kind.PILL) return
                  tgt[3] = if (on) 1f else 0f
                  startLoop()
              }

              private val longRun = Runnable {
                  longFired = true
                  press(false)
                  performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                  host.onLongPress(downX < width / 2f)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          parent?.requestDisallowInterceptTouchEvent(true)
                          host.onActive()
                          downX = e.x
                          downY = e.y
                          moved = false
                          longFired = false
                          scrolling = false
                          flingV = 0f
                          startScroll = scrollY
                          inList = listClip.contains(e.x, e.y) && maxScroll() > 0f
                          downHit = hitAt(e.x, e.y)
                          tracker?.recycle()
                          tracker = VelocityTracker.obtain()
                          tracker?.addMovement(e)
                          val s = state
                          if (s != null && (s.kind == Kind.IDLE || s.kind == Kind.PILL)) {
                              press(true)
                              postDelayed(longRun, 450L)
                          }
                          if (isSlider(downHit)) slider(e.x, false)
                      }
                      MotionEvent.ACTION_MOVE -> {
                          tracker?.addMovement(e)
                          val dy = e.y - downY
                          if (abs(e.x - downX) > slop || abs(dy) > slop) {
                              moved = true
                              removeCallbacks(longRun)
                              press(false)
                          }
                          if (inList && abs(dy) > slop) {
                              scrolling = true
                              host.onActive()
                              val ms = maxScroll()
                              scrollY = max(0f, min(ms, startScroll - dy))
                              invalidate()
                          }
                          if (isSlider(downHit)) slider(e.x, false)
                      }
                      MotionEvent.ACTION_UP -> {
                          removeCallbacks(longRun)
                          press(false)
                          tracker?.addMovement(e)
                          if (scrolling) {
                              tracker?.computeCurrentVelocity(1000)
                              flingV = -(tracker?.yVelocity ?: 0f)
                              startLoop()
                          } else if (!longFired) {
                              val dx = e.x - downX
                              val dy = e.y - downY
                              val hit = downHit
                              if (hit != null && isSlider(hit)) {
                                  slider(e.x, true)
                              } else if (dy < -28f * u && abs(dy) > abs(dx) && !inList) {
                                  host.onClose()
                              } else if (abs(dx) > 28f * u && abs(dx) > abs(dy)) {
                                  host.onSwipe(if (dx < 0f) 1 else -1)
                              } else if (!moved) {
                                  if (hit != null) host.onAction(hit.id, 0f) else host.onTapEmpty()
                              }
                          }
                          tracker?.recycle()
                          tracker = null
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          removeCallbacks(longRun)
                          press(false)
                          tracker?.recycle()
                          tracker = null
                      }
                      else -> {
                      }
                  }
                  return true
              }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/Prefs.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.content.Context

          object Prefs {

              val APPS: List<Pair<String, String>> = listOf(
                  Pair("WhatsApp", "com.whatsapp"),
                  Pair("WhatsApp Business", "com.whatsapp.w4b"),
                  Pair("Telegram", "org.telegram.messenger"),
                  Pair("Instagram", "com.instagram.android"),
                  Pair("Messenger", "com.facebook.orca"),
                  Pair("Line", "jp.naver.line.android"),
                  Pair("TikTok", "com.zhiliaoapp.musically"),
                  Pair("Gmail", "com.google.android.gm"),
                  Pair("Pesan (SMS)", "com.google.android.apps.messaging")
              )

              private fun sp(c: Context) = c.getSharedPreferences("notch", Context.MODE_PRIVATE)

              fun enabled(c: Context): Boolean = sp(c).getBoolean("enabled", true)

              fun setEnabled(c: Context, v: Boolean) {
                  sp(c).edit().putBoolean("enabled", v).apply()
              }

              fun widthPct(c: Context): Int = sp(c).getInt("w", 33)

              fun setWidthPct(c: Context, v: Int) {
                  sp(c).edit().putInt("w", v).apply()
              }

              fun extraDp(c: Context): Int = sp(c).getInt("h", 0)

              fun setExtraDp(c: Context, v: Int) {
                  sp(c).edit().putInt("h", v).apply()
              }

              fun offsetDp(c: Context): Int = sp(c).getInt("x", 0)

              fun setOffsetDp(c: Context, v: Int) {
                  sp(c).edit().putInt("x", v).apply()
              }

              fun apps(c: Context): Set<String> {
                  val def = setOf("com.whatsapp", "com.whatsapp.w4b")
                  val s = sp(c).getStringSet("apps", def) ?: def
                  return HashSet(s)
              }

              fun setApps(c: Context, v: Set<String>) {
                  sp(c).edit().putStringSet("apps", HashSet(v)).apply()
              }
          }
          CAMES_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CamesNotch.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: CamesNotch-APK
          path: CamesNotch.apk

      - name: Publikasikan di Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CamesNotch build ${{ github.run_number }}
          files: CamesNotch.apk
