           private fun singleTap() {
            val a = acts()
            if (a.isNotEmpty()) {
             val cur = a[Math.floorMod(actIdx, a.size)]
             if (cur.type == 0) setExp(Exp.MUSIC) else setExp(Exp.TIMER)
