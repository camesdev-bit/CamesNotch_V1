           }

           private fun drawMusic(c: Canvas, s: UiState, cx: Float) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            art(c, s.bmp, s.color, x0 + 18f * u, top + 20f * u, x0 + 58f * u, top + 60f * u, 9f * u)
            text(c, s.title, x0 + 68f * u, top + 37f * u, 14f, Color.WHITE, true, Paint.Align.LEFT, panelW - 90f * u)
            text(c, s.sub, x0 + 68f * u, top + 53f * u, 11.5f, C_GRAY, false, Paint.Align.LEFT, panelW - 90f * u)

            val tl = x0 + 18f * u
            val tw = panelW - 36f * u
            fill.color = C_TRACK
            rect.set(tl, top + 72f * u, tl + tw, top + 76f * u)
            c.drawRoundRect(rect, 2f * u, 2f * u, fill)
            fill.color = Color.WHITE
            rect.set(tl, top + 72f * u, tl + tw * max(0f, min(1f, s.progress)), top + 76f * u)
            c.drawRoundRect(rect, 2f * u, 2f * u, fill)
            addHit(Hit("seek", RectF(tl, top + 62f * u, tl + tw, top + 86f * u), tl, tw))
            text(c, s.posText, tl, top + 91f * u, 10.5f, C_GRAY)
            text(c, s.durText, tl + tw, top + 91f * u, 10.5f, C_GRAY, false, Paint.Align.RIGHT)

            val cy = top + 108f * u
            fill.color = Color.WHITE

            val px = cx - 40f * u
            rect.set(px - 8f * u, cy - 8f * u, px - 5.5f * u, cy + 8f * u)
            c.drawRect(rect, fill)
            path.reset()
            path.moveTo(px + 7f * u, cy - 8f * u)
            path.lineTo(px + 7f * u, cy + 8f * u)
            path.lineTo(px - 4.5f * u, cy)
            path.close()
            c.drawPath(path, fill)
            addHit(Hit("prev", RectF(px - 18f * u, cy - 18f * u, px + 18f * u, cy + 18f * u)))

            if (s.playing) {
             rect.set(cx - 7f * u, cy - 10f * u, cx - 2.5f * u, cy + 10f * u)
             c.drawRoundRect(rect, 1.5f * u, 1.5f * u, fill)
             rect.set(cx + 2.5f * u, cy - 10f * u, cx + 7f * u, cy + 10f * u)
             c.drawRoundRect(rect, 1.5f * u, 1.5f * u, fill)
            } else {
             path.reset()
             path.moveTo(cx - 6f * u, cy - 10f * u)
             path.lineTo(cx - 6f * u, cy + 10f * u)
             path.lineTo(cx + 9f * u, cy)
             path.close()
             c.drawPath(path, fill)
            }
            addHit(Hit("toggle", RectF(cx - 20f * u, cy - 20f * u, cx + 20f * u, cy + 20f * u)))

            val nx = cx + 40f * u
            path.reset()
            path.moveTo(nx - 7f * u, cy - 8f * u)
            path.lineTo(nx - 7f * u, cy + 8f * u)
            path.lineTo(nx + 4.5f * u, cy)
            path.close()
            c.drawPath(path, fill)
            rect.set(nx + 5.5f * u, cy - 8f * u, nx + 8f * u, cy + 8f * u)
            c.drawRect(rect, fill)
            addHit(Hit("next", RectF(nx - 18f * u, cy - 18f * u, nx + 18f * u, cy + 18f * u)))
           }

           private fun drawRows(c: Canvas, s: UiState, cx: Float, empty: String) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            if (s.rows.isEmpty()) {
             text(c, empty, cx, top + 42f * u, 12f, C_GRAY, false, Paint.Align.CENTER)
             return
            }
            val vp = viewportH(s)
            val clipT = top + 18f * u
            val clipB = clipT + vp
            listClip.set(x0, clipT, x0 + panelW, clipB)
            val sv = c.save()
            c.clipRect(x0, clipT, x0 + panelW, clipB)
            for (i in s.rows.indices) {
             val row = s.rows[i]
             val rt = clipT + i * ROW * u - scrollY
             if (rt > clipB || rt + ROW * u < clipT) continue
             if (i > 0) {
              fill.color = C_LINE
              rect.set(x0 + 52f * u, rt, x0 + panelW - 18f * u, rt + 0.8f * u)
              c.drawRect(rect, fill)
             }
             avatar(c, row.bmp, row.color, row.title, x0 + 32f * u, rt + 18f * u, 12f * u)
             val rightW = if (row.right.isNotEmpty()) 64f * u else 0f
             text(c, row.title, x0 + 52f * u, rt + 16f * u, 13f, Color.WHITE, true, Paint.Align.LEFT, panelW - 72f * u - rightW)
             text(c, row.sub, x0 + 52f * u, rt + 31f * u, 11f, C_GRAY, false, Paint.Align.LEFT, panelW - 72f * u - rightW)
             if (row.right.isNotEmpty()) {
              text(c, row.right, x0 + panelW - 20f * u, rt + 23f * u, 14f, C_ORANGE, true, Paint.Align.RIGHT)
             }
             addHit(Hit(row.id, RectF(x0, rt, x0 + panelW, rt + ROW * u), 0f, 0f, true))
            }
            c.restoreToCount(sv)
            val ms = maxScroll()
            if (ms > 0f) {
             val trackH = vp - 8f * u
             val barH = max(16f * u, trackH * vp / (s.rows.size * ROW * u))
             val by = clipT + 4f * u + (trackH - barH) * (scrollY / ms)
             fill.color = C_TRACK
             rect.set(x0 + panelW - 8f * u, by, x0 + panelW - 6f * u, by + barH)
             c.drawRoundRect(rect, 1f * u, 1f * u, fill)
            }
           }

           private fun icon(c: Canvas, id: String, x: Float, y: Float, color: Int) {
            stroke.color = color
            stroke.strokeWidth = 1.9f * u
            fill.color = color
            when (id) {
             "torch" -> {
              c.drawCircle(x, y - 3f * u, 6.5f * u, stroke)
              rect.set(x - 3f * u, y + 4f * u, x + 3f * u, y + 9f * u)
              c.drawRoundRect(rect, 1.2f * u, 1.2f * u, fill)
             }
             "timer" -> {
              c.drawCircle(x, y + 1f * u, 7.5f * u, stroke)
              c.drawLine(x, y + 1f * u, x, y - 3.5f * u, stroke)
              c.drawLine(x - 2.5f * u, y - 9.5f * u, x + 2.5f * u, y - 9.5f * u, stroke)
             }
             "text" -> {
              c.drawLine(x - 8f * u, y - 6f * u, x + 8f * u, y - 6f * u, stroke)
              c.drawLine(x - 8f * u, y, x + 4f * u, y, stroke)
              c.drawLine(x - 8f * u, y + 6f * u, x + 8f * u, y + 6f * u, stroke)
             }
             "shot" -> {
              val k = 8f * u
              val n = 4f * u
              path.reset()
              path.moveTo(x - k, y - k + n); path.lineTo(x - k, y - k); path.lineTo(x - k + n, y - k)
              path.moveTo(x + k - n, y - k); path.lineTo(x + k, y - k); path.lineTo(x + k, y - k + n)
              path.moveTo(x + k, y + k - n); path.lineTo(x + k, y + k); path.lineTo(x + k - n, y + k)
              path.moveTo(x - k + n, y + k); path.lineTo(x - k, y + k); path.lineTo(x - k, y + k - n)
              c.drawPath(path, stroke)
              c.drawCircle(x, y, 1.6f * u, fill)
             }
             "lock" -> {
              rect.set(x - 6.5f * u, y - 1f * u, x + 6.5f * u, y + 8f * u)
              c.drawRoundRect(rect, 2.5f * u, 2.5f * u, fill)
              rect.set(x - 4.5f * u, y - 8f * u, x + 4.5f * u, y + 1f * u)
              c.drawArc(rect, 180f, 180f, false, stroke)
              c.drawLine(x - 4.5f * u, y - 3.5f * u, x - 4.5f * u, y - 0.5f * u, stroke)
              c.drawLine(x + 4.5f * u, y - 3.5f * u, x + 4.5f * u, y - 0.5f * u, stroke)
             }
             "wifi" -> {
              val wy = y + 7f * u
              val radii = floatArrayOf(5f, 9.5f, 14f)
              for (rr in radii) {
               rect.set(x - rr * u, wy - rr * u, x + rr * u, wy + rr * u)
               c.drawArc(rect, 225f, 90f, false, stroke)
              }
              c.drawCircle(x, wy, 1.8f * u, fill)
             }
             "globe" -> {
              c.drawCircle(x, y, 9f * u, stroke)
              rect.set(x - 4f * u, y - 9f * u, x + 4f * u, y + 9f * u)
              c.drawOval(rect, stroke)
              c.drawLine(x - 9f * u, y, x + 9f * u, y, stroke)
             }
             "copy" -> {
              rect.set(x - 3f * u, y - 9f * u, x + 8f * u, y + 3f * u)
              c.drawRoundRect(rect, 2.5f * u, 2.5f * u, stroke)
              rect.set(x - 8f * u, y - 3f * u, x + 3f * u, y + 9f * u)
              c.drawRoundRect(rect, 2.5f * u, 2.5f * u, stroke)
             }
             "search" -> {
              c.drawCircle(x - 1.5f * u, y - 1.5f * u, 6.5f * u, stroke)
              c.drawLine(x + 3.5f * u, y + 3.5f * u, x + 9f * u, y + 9f * u, stroke)
             }
             "bt" -> drawBt(c, x, y, 1.2f * u, color, 1.9f * u)
             "power" -> {
              rect.set(x - 7.5f * u, y - 7.5f * u, x + 7.5f * u, y + 7.5f * u)
              c.drawArc(rect, -60f, 300f, false, stroke)
              c.drawLine(x, y - 10f * u, x, y - 1.5f * u, stroke)
             }
            }
           }

           private fun drawQuick(c: Canvas, s: UiState, cx: Float) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            val tl = x0 + 18f * u
            val tw = panelW - 36f * u
            val ids = arrayOf("torch", "timer", "text", "shot", "lock", "wifi", "bt", "power")
            val labels = arrayOf("Senter", "Timer", "Teks", "Tangkap", "Kunci", "Wifi", "Bluetooth", "Matikan")
            for (i in 0..7) {
             val col = i % 4
             val rw = i / 4
             val tx = tl + col * 76f * u
             val ty = top + 20f * u + rw * 58f * u
             val on = i == 0 && s.torch
             val isPower = i == 7
             fill.color = if (on) C_AMBER else if (isPower) Color.argb(70, 255, 69, 58) else C_FILL
             rect.set(tx, ty, tx + 60f * u, ty + 38f * u)
             c.drawRoundRect(rect, 14f * u, 14f * u, fill)
             val ic = if (on) Color.parseColor("#2B2100") else if (isPower) C_RED_TEXT else Color.WHITE
             icon(c, ids[i], tx + 30f * u, ty + 19f * u, ic)
             text(c, labels[i], tx + 30f * u, ty + 51f * u, 10.5f, C_GRAY, false, Paint.Align.CENTER)
             addHit(Hit(ids[i], RectF(tx - 6f * u, ty - 4f * u, tx + 66f * u, ty + 56f * u)))
            }

            text(c, "Volume", tl, top + 148f * u, 11f, C_GRAY)
            val vp = (max(0f, min(1f, s.volume)) * 100f).roundToInt()
            text(c, vp.toString() + "%", tl + tw, top + 148f * u, 11f, Color.WHITE, true, Paint.Align.RIGHT)
            fill.color = C_TRACK
            rect.set(tl, top + 154f * u, tl + tw, top + 162f * u)
            c.drawRoundRect(rect, 4f * u, 4f * u, fill)
            fill.color = Color.WHITE
            rect.set(tl, top + 154f * u, max(tl + 8f * u, tl + tw * max(0f, min(1f, s.volume))), top + 162f * u)
            c.drawRoundRect(rect, 4f * u, 4f * u, fill)
            addHit(Hit("vol", RectF(tl - 8f * u, top + 140f * u, tl + tw + 8f * u, top + 170f * u), tl, tw))

            text(c, "Kecerahan", tl, top + 180f * u, 11f, C_GRAY)
            if (s.brightness < 0f) {
             text(c, "Ketuk untuk izinkan", tl + tw, top + 180f * u, 11f, C_ORANGE, true, Paint.Align.RIGHT)
            } else {
             val bp = (max(0f, min(1f, s.brightness)) * 100f).roundToInt()
             text(c, bp.toString() + "%", tl + tw, top + 180f * u, 11f, Color.WHITE, true, Paint.Align.RIGHT)
            }
            fill.color = C_TRACK
            rect.set(tl, top + 186f * u, tl + tw, top + 194f * u)
            c.drawRoundRect(rect, 4f * u, 4f * u, fill)
            fill.color = Color.WHITE
            val bf = max(0f, min(1f, s.brightness))
            rect.set(tl, top + 186f * u, max(tl + 8f * u, tl + tw * bf), top + 194f * u)
            c.drawRoundRect(rect, 4f * u, 4f * u, fill)
            addHit(Hit("bright", RectF(tl - 8f * u, top + 172f * u, tl + tw + 8f * u, top + 202f * u), tl, tw))
           }

           private fun drawInfo(c: Canvas, s: UiState, cx: Float) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            text(c, s.title, x0 + 22f * u, top + 56f * u, 34f, Color.WHITE, false, Paint.Align.LEFT, 0f, false, true)
            text(c, s.sub, x0 + 22f * u, top + 74f * u, 12f, C_GRAY)
            val xr = x0 + panelW - 22f * u
            if (s.battery >= 0) {
             text(c, s.battery.toString() + "%", xr, top + 44f * u, 12.5f, Color.WHITE, true, Paint.Align.RIGHT)
             val gx = xr - 62f * u
             val gy = top + 35f * u
             stroke.color = Color.argb(150, 255, 255, 255)
             stroke.strokeWidth = 1.2f * u
             rect.set(gx, gy - 6f * u, gx + 26f * u, gy + 6f * u)
             c.drawRoundRect(rect, 3.5f * u, 3.5f * u, stroke)
             fill.color = if (s.charging) C_GREEN else if (s.battery <= 15) C_RED else Color.WHITE
             val fw = 22f * u * max(0.04f, min(1f, s.battery / 100f))
             rect.set(gx + 2f * u, gy - 4f * u, gx + 2f * u + fw, gy + 4f * u)
             c.drawRoundRect(rect, 2f * u, 2f * u, fill)
             fill.color = Color.argb(150, 255, 255, 255)
             rect.set(gx + 27.4f * u, gy - 2.2f * u, gx + 29f * u, gy + 2.2f * u)
             c.drawRect(rect, fill)
            }
            if (s.note.isNotEmpty()) {
             text(c, s.note, xr, top + 74f * u, 12f, C_ORANGE, true, Paint.Align.RIGHT)
            }
           }

           private fun drawTimer(c: Canvas, s: UiState, cx: Float) {
            val x0 = cx - panelW / 2f
            val top = collapsedH
            val tl = x0 + 18f * u
            text(c, "Timer", tl, top + 32f * u, 14f, Color.WHITE, true)
            if (s.timerOn) {
             text(c, s.time, x0 + panelW - 44f * u, top + 32f * u, 13f, C_ORANGE, true, Paint.Align.RIGHT)
            } else {
             text(c, "Pilih durasi", x0 + panelW - 44f * u, top + 32f * u, 11.5f, C_GRAY, false, Paint.Align.RIGHT)
