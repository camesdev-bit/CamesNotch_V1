           private fun cameraLike(p: String): Boolean {
            return p.contains("camera") || p.contains("scan") || p.contains("qr") ||
              p.contains("lens") || p.contains("barcode")
           }

           private fun shouldScan(): Boolean {
            val c = a11y ?: return false
            if (Build.VERSION.SDK_INT < 30) return false
            if (!Prefs.on(c, "qr")) return false
            if (!cameraLike(fgPkg)) return false
            val pm = c.getSystemService(Context.POWER_SERVICE) as PowerManager
            return pm.isInteractive
           }

           private val scanRun = Runnable { doScan() }

           private fun kickScan() {
            h.removeCallbacks(scanRun)
            if (shouldScan()) h.postDelayed(scanRun, 700L)
           }

           private fun doScan() {
            val s = a11y ?: return
            if (!shouldScan()) return
            if (scanning || exp != Exp.NONE || trans != null) {
             h.postDelayed(scanRun, 900L)
             return
            }
            scanning = true
            try {
             s.takeScreenshot(Display.DEFAULT_DISPLAY, exec, object : AccessibilityService.TakeScreenshotCallback {
              override fun onSuccess(result: AccessibilityService.ScreenshotResult) {
               var raw: String? = null
               try {
                val hb = result.hardwareBuffer
                val hw = Bitmap.wrapHardwareBuffer(hb, result.colorSpace)
                if (hw != null) {
                 val soft = hw.copy(Bitmap.Config.ARGB_8888, false)
                 hw.recycle()
                 if (soft != null) {
                  val mx = max(soft.width, soft.height)
                  val k = if (mx > 1100) 1100f / mx.toFloat() else 1f
                  val bmp = if (k < 1f) {
                   Bitmap.createScaledBitmap(
                    soft, (soft.width * k).toInt(), (soft.height * k).toInt(), true
                   )
                  } else {
                   soft
                  }
                  raw = QrScanner.decode(bmp)
                  if (bmp !== soft) bmp.recycle()
                  soft.recycle()
                 }
                }
                hb.close()
               } catch (e: Throwable) {
               }
               val r = raw
               h.post {
                scanning = false
                if (r != null) onScanResult(r)
                kickScan()
               }
              }

              override fun onFailure(errorCode: Int) {
               h.post {
                scanning = false
                h.postDelayed(scanRun, 1500L)
               }
              }
             })
            } catch (e: Throwable) {
             scanning = false
            }
           }

           private fun onScanResult(raw: String) {
            val now = System.currentTimeMillis()
            if (raw == lastRaw && now - lastRawAt < 20000L) return
            lastRaw = raw
            lastRawAt = now
            if (exp != Exp.NONE) return
            val sc = QrScanner.classify(raw)
            qrScan = sc
            val col = when (sc.type) {
             Scan.WIFI -> SKY
             Scan.URL -> Color.parseColor("#6EA8FF")
             Scan.SEARCH -> Color.parseColor("#FFD60A")
             else -> Color.parseColor("#D1D1D6")
            }
            hapticTick()
            showTransient(
             UiState(Kind.PANEL_QR, title = sc.title, sub = sc.sub, note = sc.button, color = col, dotIdx = sc.type),
             9000L, null
            )
           }

           private fun copyText(t: String) {
            val c = a11y ?: return
            try {
             val cm = c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
             cm.setPrimaryClip(ClipData.newPlainText("CamesNotch", t))
            } catch (e: Exception) {
            }
           }

           private fun openUrl(url: String) {
            val c = a11y ?: return
            try {
             val i = Intent(Intent.ACTION_VIEW, Uri.parse(url))
             i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
             c.startActivity(i)
            } catch (e: Exception) {
            }
           }

           private fun connectWifi(sc: Scan) {
            val c = a11y ?: return
            val sec = sc.sec.uppercase()
            if (Build.VERSION.SDK_INT >= 30 && sec != "WEP" && sc.ssid.isNotEmpty()) {
             try {
              val b = WifiNetworkSuggestion.Builder().setSsid(sc.ssid).setIsHiddenSsid(sc.hidden)
              if (sc.pass.isNotEmpty() && sec != "NOPASS") {
               if (sec == "SAE" || sec == "WPA3") b.setWpa3Passphrase(sc.pass) else b.setWpa2Passphrase(sc.pass)
              }
              val list = ArrayList<WifiNetworkSuggestion>()
              list.add(b.build())
              val i = Intent(Settings.ACTION_WIFI_ADD_NETWORKS)
              i.putParcelableArrayListExtra(Settings.EXTRA_WIFI_NETWORK_LIST, list)
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              c.startActivity(i)
              return
             } catch (e: Exception) {
             }
            }
            if (sc.pass.isNotEmpty()) copyText(sc.pass)
            launch(if (Build.VERSION.SDK_INT >= 29) Settings.Panel.ACTION_WIFI else Settings.ACTION_WIFI_SETTINGS)
           }

           private fun runScan() {
            val sc = qrScan ?: return
            exp = Exp.NONE
            trans = null
            h.removeCallbacks(clearTransRun)
            if (sc.type == Scan.WIFI) {
             connectWifi(sc)
            } else if (sc.type == Scan.URL) {
             openUrl(sc.data)
            } else if (sc.type == Scan.SEARCH) {
             openUrl("https://www.google.com/search?q=" + Uri.encode(sc.data))
            } else {
             copyText(sc.data)
             showTransient(
              UiState(
               Kind.PILL,
               left = Mini(Mini.RING, color = TEAL, frac = 1f),
               right = Mini(Mini.TEXT, "Tersalin", color = TEAL)
              ), 2500L, null
             )
             return
            }
            render()
           }

           override fun onAction(id: String, frac: Float) {
            val m = media
            if (id == "prev") {
             m?.transportControls?.skipToPrevious()
            } else if (id == "next") {
             m?.transportControls?.skipToNext()
            } else if (id == "toggle") {
             val tc = m?.transportControls
             if (m?.playbackState?.state == PlaybackState.STATE_PLAYING) tc?.pause() else tc?.play()
            } else if (id == "seek") {
             val dur = m?.metadata?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0L
             if (dur > 0L) m?.transportControls?.seekTo((dur * frac).toLong())
            } else if (id == "answer") {
             send(call?.answer ?: call?.open)
            } else if (id == "decline") {
             send(call?.decline)
            } else if (id == "notif") {
             send(transOpen)
             onClose()
             return
            } else if (id == "music") {
             setExp(Exp.MUSIC)
             return
            } else if (id == "timer" || id == "sw" && exp == Exp.ACTS) {
             setExp(Exp.TIMER)
             return
            } else if (id.startsWith("n:")) {
             val idx = id.substring(2).toIntOrNull() ?: -1
             if (idx >= 0 && idx < itemList.size) send(itemList[idx].pi)
             onClose()
             return
            } else if (id.startsWith("t:")) {
             val sec = id.substring(2).toLongOrNull() ?: 0L
             if (sec > 0L) {
              ownTimerEnd = System.currentTimeMillis() + sec * 1000L
              ownTimerTotal = sec
              hapticTick()
              exp = Exp.NONE
              h.removeCallbacks(collapseRun)
             }
            } else if (id == "sw") {
             if (swRunning) {
              swAccum += SystemClock.elapsedRealtime() - swStart
              swRunning = false
             } else {
              swStart = SystemClock.elapsedRealtime()
              swRunning = true
             }
             hapticTick()
            } else if (id == "tcancel") {
             ownTimerEnd = 0L
             timerEnd = 0L
             swRunning = false
             swAccum = 0L
             hapticTick()
            } else if (id == "torch") {
             toggleTorch()
            } else if (id == "shot") {
             onClose()
             global(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT, 550L)
             return
            } else if (id == "lock") {
             onClose()
             global(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN, 200L)
             return
            } else if (id == "power") {
             onClose()
             global(AccessibilityService.GLOBAL_ACTION_POWER_DIALOG, 150L)
             return
            } else if (id == "wifi") {
             launch(if (Build.VERSION.SDK_INT >= 29) Settings.Panel.ACTION_WIFI else Settings.ACTION_WIFI_SETTINGS)
             onClose()
             return
            } else if (id == "text") {
             setExp(Exp.TEXT)
             return
            } else if (id == "pin") {
             val c = a11y
             if (c != null) Prefs.setOn(c, "keep", !Prefs.on(c, "keep", false))
             armCollapse()
            } else if (id == "tx_play") {
             textPlaying = !textPlaying
             armCollapse()
            } else if (id == "tx_end") {
             textPlaying = false
             armCollapse()
            } else if (id == "tx_speed") {
             val c = a11y
             if (c != null) Prefs.setTextSpeed(c, (Prefs.textSpeed(c) + 1) % speeds.size)
            } else if (id == "tx_font") {
             val c = a11y
             if (c != null) Prefs.setTextFont(c, (Prefs.textFont(c) + 1) % fonts.size)
            } else if (id == "tx_next") {
             textIdx += 1
            } else if (id == "qr") {
             runScan()
             return
            } else if (id == "bt") {
             launch(Settings.ACTION_BLUETOOTH_SETTINGS)
             onClose()
             return
            } else if (id == "bright") {
             val c = a11y
             if (c != null) {
              if (Settings.System.canWrite(c)) {
               try {
                Settings.System.putInt(
                 c.contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE,
                 Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL
                )
                Settings.System.putInt(
                 c.contentResolver, Settings.System.SCREEN_BRIGHTNESS,
                 max(1, (frac * 255f).roundToInt())
                )
               } catch (e: Exception) {
               }
              } else {
               launchWriteSettings()
               onClose()
               return
              }
             }
            } else if (id == "vol") {
             val c = a11y
             if (c != null) {
              val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              val mx = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
              am.setStreamVolume(AudioManager.STREAM_MUSIC, (frac * mx).roundToInt(), 0)
             }
            }
            render()
           }
          }
