name: Build CamesNotch APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tulis file proyek
        run: |
          cat > 'settings.gradle.kts' <<'CAMES_EOF'
          pluginManagement {
              repositories {
                  google()
                  maven("https://maven-central.storage-download.googleapis.com/maven2/")
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  maven("https://maven-central.storage-download.googleapis.com/maven2/")
                  mavenCentral()
              }
          }
          rootProject.name = "CamesNotch"
          include(":app")
          CAMES_EOF
          cat > 'build.gradle.kts' <<'CAMES_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          CAMES_EOF
          cat > 'gradle.properties' <<'CAMES_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          systemProp.org.gradle.internal.http.socketTimeout=60000
          kotlin.code.style=official
          CAMES_EOF
          cat > '.gitignore' <<'CAMES_EOF'
          .gradle/
          build/
          local.properties
          *.iml
          .idea/
          CAMES_EOF
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'CAMES_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "id.cames.notch"
              compileSdk = 34

              defaultConfig {
                  applicationId = "id.cames.notch"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("com.google.zxing:core:3.5.3")
          }
          CAMES_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.DIAL" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.APP_MESSAGING" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.APP_BROWSER" />
                  </intent>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".LauncherActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:label="CamesNotch Launcher"
                      android:theme="@android:style/Theme.Material.Wallpaper.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".NotchAccessibilityService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/a11y_config" />
                  </service>

                  <service
                      android:name=".NotchListener"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>

              </application>
          </manifest>
          CAMES_EOF
          mkdir -p 'app/src/main/res/values'
          cat > 'app/src/main/res/values/strings.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">CamesNotch</string>
              <string name="a11y_desc">Menampilkan notch di atas layar supaya bisa diketuk, digeser, dan ditekan lama.</string>
          </resources>
          CAMES_EOF
          mkdir -p 'app/src/main/res/xml'
          cat > 'app/src/main/res/xml/a11y_config.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="false"
              android:canTakeScreenshot="true"
              android:description="@string/a11y_desc"
              android:notificationTimeout="200" />
          CAMES_EOF
          mkdir -p 'app/src/main/res/drawable'
          cat > 'app/src/main/res/drawable/ic_launcher.xml' <<'CAMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#185FA5"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#000000"
                  android:pathData="M26,18 h56 v16 a16,16 0 0 1 -16,16 h-24 a16,16 0 0 1 -16,-16 z" />
              <path
                  android:fillColor="#5DCAA5"
                  android:pathData="M54,70 m-6,0 a6,6 0 1 0 12,0 a6,6 0 1 0 -12,0" />
          </vector>
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/Demo.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.graphics.Color
          import android.os.Handler
          import android.os.Looper
          import android.widget.Toast

          class DemoController : NotchView.Host {

           lateinit var v: NotchView

           private class DAct(val type: Int, val left: Mini, val right: Mini, val row: Row)

           private val h = Handler(Looper.getMainLooper())
           private val coral = Color.parseColor("#FF6A3D")
           private val orange = Color.parseColor("#FF9F0A")
           private val teal = Color.parseColor("#63E6BE")
           private val green = Color.parseColor("#30D158")
           private val sky = Color.parseColor("#64D2FF")

           private var musicOn = false
           private var timerOn = false
           private var swRunning = false
           private var playing = true
           private var posSec = 53
           private var timerLeft = 300
           private var swSec = 0
           private var exp = 0
           private var idx = 0
           private var trans: UiState? = null
           private var torch = false
           private var volume = 0.55f
           private var brightness = 0.6f
           private var pinned = false
           private var textPlaying = false
           private var textFont = 2
           private var textSpeed = 2
           private val speeds = floatArrayOf(0.5f, 0.75f, 1f, 1.5f, 2f, 3f)
           private val fonts = floatArrayOf(12f, 14f, 16f, 18f, 22f)
           private val total = 212

           private val tick = object : Runnable {
            override fun run() {
             if (musicOn && playing) posSec = (posSec + 1) % total
             if (timerOn && timerLeft > 0) timerLeft -= 1
             if (timerOn && timerLeft == 0) timerOn = false
             if (swRunning) swSec += 1
             render()
             h.postDelayed(this, 1000L)
            }
           }

           private val clearTrans = Runnable {
            trans = null
            render()
           }

           private val collapse = Runnable {
            exp = 0
            render()
           }

           fun start() {
            render()
            h.postDelayed(tick, 1000L)
           }

           fun stop() {
            h.removeCallbacksAndMessages(null)
           }

           fun toggleMusic() {
            musicOn = !musicOn
            if (!musicOn && exp == 1) exp = 0
            render()
           }

           fun toggleTimer() {
            timerOn = !timerOn
            if (timerOn) timerLeft = 300
            render()
           }

           fun toggleStopwatch() {
            swRunning = !swRunning
            if (swRunning) swSec = 0
            render()
           }

           fun showNotif() {
            showTransient(
             UiState(Kind.PANEL_NOTIF, title = "Budi", sub = "Bro, jadi bikin appnya?", time = "sekarang", color = green),
             4500L
            )
           }

           fun showQr(wifi: Boolean) {
            if (wifi) {
             showTransient(
              UiState(
               Kind.PANEL_QR, title = "Sambung ke WiFi ini?", sub = "Rumah_5G", note = "Sambung",
               color = sky, dotIdx = 0
              ), 7000L
             )
            } else {
             showTransient(
              UiState(
               Kind.PANEL_QR, title = "Masuk ke URL ini?", sub = "cames.my.id", note = "Buka",
               color = Color.parseColor("#6EA8FF"), dotIdx = 1
              ), 7000L
             )
            }
           }

           fun showCall() {
            showTransient(UiState(Kind.PANEL_CALL, title = "Mama"), 6000L)
           }

           fun showCharge() {
            showTransient(
             UiState(Kind.PILL, left = Mini(Mini.BOLT, color = teal), right = Mini(Mini.TEXT, "82%", color = teal)),
             3500L
            )
           }

           fun showBt() {
            showTransient(
             UiState(Kind.PILL, left = Mini(Mini.BT, color = sky), right = Mini(Mini.TEXT, "Buds Pro", color = Color.WHITE)),
             3500L
            )
           }

           fun showAlarm() {
            showTransient(
             UiState(Kind.PILL, left = Mini(Mini.ALARM, color = orange), right = Mini(Mini.TEXT, "06.00", color = orange)),
             4000L
            )
           }

           private fun showTransient(st: UiState, ms: Long) {
            exp = 0
            h.removeCallbacks(collapse)
            trans = st
            h.removeCallbacks(clearTrans)
            h.postDelayed(clearTrans, ms)
            render()
           }

           private fun fmt(s: Int): String = String.format("%d:%02d", s / 60, s % 60)

           private fun fmtT(s: Int): String = String.format("%02d.%02d", s / 60, s % 60)

           private fun acts(): List<DAct> {
            val l = ArrayList<DAct>()
            if (musicOn) {
             l.add(
              DAct(
               0, Mini(Mini.ART, color = coral), Mini(Mini.BARS),
               Row("Teh Hijau", "Tulus", coral, null, "", "music")
              )
             )
            }
            if (timerOn) {
             val t = fmtT(timerLeft)
             l.add(
              DAct(
               1, Mini(Mini.RING, color = orange), Mini(Mini.TEXT, t, color = orange),
               Row("Timer", "Hitung mundur", orange, null, t, "timer")
              )
             )
            }
            if (swRunning) {
             val t = fmtT(swSec)
             l.add(
              DAct(
               2, Mini(Mini.RING, color = teal), Mini(Mini.TEXT, t, color = teal),
               Row("Stopwatch", "Berjalan", teal, null, t, "sw")
              )
             )
            }
            return l
           }

           private fun demoRows(): List<Row> {
            val g = Color.parseColor("#30D158")
            val b = Color.parseColor("#64D2FF")
            val p = Color.parseColor("#7F77DD")
            return listOf(
             Row("Budi", "Bro, jadi bikin appnya?", g, null, "", "n:0"),
             Row("Grup Dev", "Update terbaru sudah rilis", b, null, "", "n:1"),
             Row("Mama", "Jangan lupa makan ya", g, null, "", "n:2"),
             Row("Kak Rina", "Filenya sudah aku kirim", p, null, "", "n:3"),
             Row("Pak Ahmad", "Besok jadi rapat jam 9", b, null, "", "n:4"),
             Row("Tim Cames", "Desain notch keren banget", g, null, "", "n:5")
            )
           }

           private fun build(): UiState {
            when (exp) {
             1 -> return UiState(
              Kind.PANEL_MUSIC, title = "Teh Hijau", sub = "Tulus", color = coral,
              progress = posSec.toFloat() / total.toFloat(), posText = fmt(posSec), durText = fmt(total),
              playing = playing
             )
             2 -> return UiState(Kind.PANEL_LIST, rows = acts().map { it.row })
             3 -> return UiState(Kind.PANEL_NOTIFS, rows = demoRows())
             4 -> return UiState(Kind.PANEL_QUICK, torch = torch, volume = volume, brightness = brightness)
             5 -> return UiState(
              Kind.PANEL_INFO, title = "09.41", sub = "Minggu, 1 Nov", battery = 82,
              charging = false, note = "Alarm 06.00"
             )
             7 -> return UiState(
              Kind.PANEL_TEXT, title = "Contoh", sub = "1/1", body = Prefs.DEFAULT_NOTE,
              speed = speeds[textSpeed], fontSize = fonts[textFont], playing = textPlaying
             )
             6 -> return UiState(
              Kind.PANEL_TIMER, time = if (timerOn) fmtT(timerLeft) else "", timerOn = timerOn,
              playing = swRunning, note = if (swSec > 0) fmtT(swSec) else ""
             )
             else -> {
             }
            }
            val t = trans
            if (t != null) return t
            val a = acts()
            if (a.isNotEmpty()) {
             val k = Math.floorMod(idx, a.size)
             val c = a[k]
             return UiState(
              Kind.PILL, left = c.left, right = c.right,
              dots = if (a.size > 1) a.size else 0, dotIdx = k
             )
            }
            return UiState(Kind.IDLE)
           }

           private fun render() {
            v.setState(build().withPinned(pinned))
           }

           private fun arm() {
            h.removeCallbacks(collapse)
            if (exp != 0 && !pinned && !(exp == 7 && textPlaying)) h.postDelayed(collapse, 8000L)
           }

           private fun setExp(e: Int) {
            exp = e
            if (e == 7) textPlaying = false
            arm()
            render()
           }

           private fun close() {
            exp = 0
            trans = null
            h.removeCallbacks(collapse)
            h.removeCallbacks(clearTrans)
            render()
           }

           private fun toast(msg: String) {
            Toast.makeText(v.context, msg, Toast.LENGTH_SHORT).show()
           }

           override fun onAction(id: String, frac: Float) {
            if (id == "toggle") {
             playing = !playing
            } else if (id == "prev" || id == "next") {
             posSec = 0
            } else if (id == "seek") {
             posSec = (frac * total).toInt()
            } else if (id == "vol") {
             volume = frac
            } else if (id == "bright") {
             brightness = frac
            } else if (id == "torch") {
             torch = !torch
            } else if (id == "timer" || (id == "sw" && exp == 2)) {
             setExp(6)
             return
            } else if (id.startsWith("t:")) {
             timerLeft = id.substring(2).toIntOrNull() ?: 300
             timerOn = true
             close()
             return
            } else if (id == "sw") {
             swRunning = !swRunning
            } else if (id == "tcancel") {
             timerOn = false
             swRunning = false
             swSec = 0
            } else if (id == "power") {
             toast("Di HP asli, ini membuka menu matikan HP.")
             close()
             return
            } else if (id == "text") {
             setExp(7)
             return
            } else if (id == "pin") {
             pinned = !pinned
             arm()
            } else if (id == "tx_play") {
             textPlaying = !textPlaying
             arm()
            } else if (id == "tx_end") {
             textPlaying = false
             arm()
            } else if (id == "tx_speed") {
             textSpeed = (textSpeed + 1) % speeds.size
            } else if (id == "tx_font") {
             textFont = (textFont + 1) % fonts.size
            } else if (id == "tx_next") {
             arm()
            } else if (id == "qr") {
             toast("Di HP asli, ini langsung dijalankan.")
             close()
             return
            } else if (id == "shot" || id == "lock" || id == "wifi" || id == "bt") {
             toast("Di HP asli, tombol ini dijalankan.")
             close()
             return
            } else if (id == "music") {
             setExp(1)
             return
            } else if (id == "answer" || id == "decline" || id == "notif" || id.startsWith("n:")) {
             close()
             return
            }
            render()
           }

           override fun onTapEmpty() {
            if (exp != 0 || trans != null) return
            val a = acts()
            if (a.size >= 2) {
             setExp(2)
            } else if (a.size == 1) {
             setExp(if (a[0].type == 0) 1 else 6)
            } else {
             setExp(5)
            }
           }

           override fun onLongPress(left: Boolean) {
            if (exp != 0) return
            setExp(if (left) 3 else 4)
           }

           override fun onSwipe(dir: Int) {
            if (exp != 0) return
            if (acts().size >= 2) {
             idx += dir
             v.nudge(dir)
             render()
            }
           }

           override fun onSwipeDown() {
            if (exp != 0 || trans != null) return
            setExp(7)
           }

           override fun onClose() {
            close()
           }

           override fun onActive() {
            arm()
           }

           override fun onSettled() {
           }
          }
          CAMES_EOF
          mkdir -p 'app/src/main/java/id/cames/notch'
          cat > 'app/src/main/java/id/cames/notch/MainActivity.kt' <<'CAMES_EOF'
          package id.cames.notch

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.Editable
          import android.text.InputType
          import android.text.TextWatcher
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

           private var st1: TextView? = null
           private var st2: TextView? = null
           private var density = 1f
           private var demo: DemoController? = null
           private var demoView: NotchView? = null

           private fun dp(x: Int): Int = (x * density).toInt()

           private fun label(text: String, size: Float, bold: Boolean, color: Int): TextView {
            val t = TextView(this)
            t.text = text
            t.textSize = size
            t.setTextColor(color)
            if (bold) t.setTypeface(t.typeface, Typeface.BOLD)
            t.setPadding(0, dp(6), 0, dp(2))
            return t
           }

           private fun button(text: String, onClick: () -> Unit): Button {
            val b = Button(this)
            b.text = text
            b.isAllCaps = false
            b.setOnClickListener { onClick() }
            return b
           }

           private fun chipRow(vararg items: Pair<String, () -> Unit>): LinearLayout {
            val r = LinearLayout(this)
            r.orientation = LinearLayout.HORIZONTAL
            for (p in items) {
             val b = Button(this)
             b.text = p.first
             b.textSize = 12f
             b.isAllCaps = false
             b.setPadding(0, 0, 0, 0)
             val action = p.second
             b.setOnClickListener { action() }
             r.addView(b, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
            }
            return r
           }

           private fun switchRow(text: String, value: Boolean, onChange: (Boolean) -> Unit): Switch {
            val sw = Switch(this)
            sw.text = text
            sw.isChecked = value
            sw.setPadding(0, dp(6), 0, dp(6))
            sw.setOnCheckedChangeListener { _, checked -> onChange(checked) }
            return sw
           }


           private val gestureRefresh = ArrayList<() -> Unit>()

           private fun gestureRow(slot: String, title: String): View {
            val names = Prefs.GESTURE_NAMES
            val b = Button(this)
            b.isAllCaps = false
            val refresh: () -> Unit = {
             b.text = title + ": " + names[Prefs.gesture(this, slot)]
            }
            refresh()
            gestureRefresh.add(refresh)
            b.setOnClickListener {
             AlertDialog.Builder(this).setTitle(title).setItems(names) { _, which ->
              Prefs.setGesture(this, slot, which)
              NotchController.rebuild()
              for (r in gestureRefresh) r()
             }.show()
            }
            return b
           }

           private fun featureRow(key: String, text: String, def: Boolean): Switch {
            return switchRow(text, Prefs.on(this, key, def)) { checked ->
             Prefs.setOn(this, key, checked)
             NotchController.rebuild()
            }
           }

           private fun slider(
            title: String, min: Int, max: Int, value: Int, onSet: (Int) -> Unit
           ): View {
            val box = LinearLayout(this)
            box.orientation = LinearLayout.VERTICAL
            box.setPadding(0, dp(8), 0, 0)
            val t = TextView(this)
            t.text = title + ": " + value
            t.setTextColor(Color.parseColor("#222222"))
            val sb = SeekBar(this)
            sb.max = max - min
            sb.progress = value - min
            sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
             override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
              t.text = title + ": " + (p + min)
             }

             override fun onStartTrackingTouch(s: SeekBar?) {
             }

             override fun onStopTrackingTouch(s: SeekBar?) {
              val p = s?.progress ?: 0
              onSet(p + min)
             }
            })
            box.addView(t)
            box.addView(sb)
            return box
           }

           private fun noteEditor(i: Int): View {
            val box = LinearLayout(this)
            box.orientation = LinearLayout.VERTICAL
            box.setPadding(0, dp(6), 0, dp(6))
            val titleEt = EditText(this)
            titleEt.hint = "Judul teks " + (i + 1)
            titleEt.setText(Prefs.noteTitle(this, i))
            titleEt.setSingleLine(true)
            val bodyEt = EditText(this)
            bodyEt.hint = "Tulis atau tempel teks yang mau dibaca"
            bodyEt.setText(Prefs.noteBody(this, i))
            bodyEt.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
            bodyEt.minLines = 3
            bodyEt.gravity = Gravity.TOP
            val watcher = object : TextWatcher {
             override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {
             }

             override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {
             }

             override fun afterTextChanged(s: Editable?) {
